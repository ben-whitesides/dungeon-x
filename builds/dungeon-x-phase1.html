// INVENTORY SYSTEM
// ============================================================
const BACKPACK_COLS = 4;
const BACKPACK_ROWS = 6;
const BACKPACK_SIZE = BACKPACK_COLS * BACKPACK_ROWS;
const SLOT_SIZE = 48;
const SLOT_PAD = 2;

let inventory = {
  equipment: {
    head: null,
    chest: null,
    left_hand: null,
    right_hand: null,
    legs: null,
    feet: null
  },
  backpack: new Array(BACKPACK_SIZE).fill(null),
  maxWeight: 60
};

function getInventoryWeight() {
  let w = 0;
  for (const slot of Object.values(inventory.equipment)) {
    if (slot) w += slot.weight * (slot.count || 1);
  }
  for (const item of inventory.backpack) {
    if (item) w += item.weight * (item.count || 1);
  }
  return w;
}

function addToBackpack(item) {
  if (!item) return false;
  // Try stacking first
  if (item.stackable) {
    for (let i = 0; i < BACKPACK_SIZE; i++) {
      const slot = inventory.backpack[i];
      if (slot && slot.id === item.id && slot.count < slot.maxStack) {
        const canAdd = Math.min(item.count, slot.maxStack - slot.count);
        slot.count += canAdd;
        item.count -= canAdd;
        if (item.count <= 0) return true;
      }
    }
  }
  // Find empty slot
  for (let i = 0; i < BACKPACK_SIZE; i++) {
    if (!inventory.backpack[i]) {
      inventory.backpack[i] = { ...item };
      return true;
    }
  }
  return false; // Full
}

function removeFromBackpack(index) {
  const item = inventory.backpack[index];
  inventory.backpack[index] = null;
  return item;
}

function hasItemInInventory(itemId) {
  for (const slot of Object.values(inventory.equipment)) {
    if (slot && slot.id === itemId) return true;
  }
  for (const item of inventory.backpack) {
    if (item && item.id === itemId) return true;
  }
  return false;
}

function removeItemById(itemId) {
  for (let i = 0; i < BACKPACK_SIZE; i++) {
    if (inventory.backpack[i] && inventory.backpack[i].id === itemId) {
      if (inventory.backpack[i].count > 1) {
        inventory.backpack[i].count--;
      } else {
        inventory.backpack[i] = null;
      }
      return true;
    }
  }
  for (const slotName of Object.keys(inventory.equipment)) {
    if (inventory.equipment[slotName] && inventory.equipment[slotName].id === itemId) {
      inventory.equipment[slotName] = null;
      return true;
    }
  }
  return false;
}

function useConsumable(item) {
  if (!item || item.type !== 'consumable') return false;
  switch (item.useEffect) {
    case 'torch':
      player.torch = Math.min(player.maxTorch, player.torch + 30);
      showNotification('Torch brightness restored! +30%', '#c88020');
      return true;
    case 'food':
      player.food = Math.min(player.maxFood, player.food + 25);
      showNotification('Ate bread. +25 food.', '#c8a060');
      return true;
    case 'water':
      player.water = Math.min(player.maxWater, player.water + 30);
      showNotification('Drank water. +30 water.', '#4090c8');
      return true;
    case 'health':
      player.hp = Math.min(player.maxHp, player.hp + 30);
      showNotification('Health restored! +30 HP', '#c83030');
      return true;
    case 'mana':
      player.mana = Math.min(player.maxMana, player.mana + 30);
      showNotification('Mana restored! +30 MP', '#3050c8');
      return true;
    case 'fire_scroll':
      showNotification('Fire Scroll used! Massive fire damage!', '#c85020');
      return true;
  }
  return false;
}

function loadReputation() {
  try {
    const data = localStorage.getItem('dungeonx_reputation');
    return data ? JSON.parse(data) : {
      totalRuns: 0, totalEnemiesSlain: 0, totalGold: 0,
      deepestFloor: 0, fragmentsFound: [], slainEnemyTypes: []
    };
  } catch(e) {
    return { totalRuns: 0, totalEnemiesSlain: 0, totalGold: 0, deepestFloor: 0, fragmentsFound: [], slainEnemyTypes: [] };
  }
}

function saveReputation(rep) {
  try { localStorage.setItem('dungeonx_reputation', JSON.stringify(rep)); } catch(e) {}
}

function getReputationTitle(rep) {
  const runs = rep.totalRuns;
  if (runs >= 21) return 'Legendary Champion';
  if (runs >= 11) return 'Feared Warrior';
  if (runs >= 6) return 'Seasoned Adventurer';
  if (runs >= 3) return 'Dungeon Delver';
  if (runs >= 1) return 'Curious Wanderer';
  return 'Unknown Stranger';
}

function completeRun() {
  const rep = loadReputation();
  rep.totalRuns++;
  rep.totalEnemiesSlain += player.enemiesSlain;
  rep.totalGold += player.gold;
  rep.deepestFloor = Math.max(rep.deepestFloor, 1);
  for (const t of Object.keys(player.slainTypes)) {
    if (!rep.slainEnemyTypes.includes(t)) rep.slainEnemyTypes.push(t);
  }
  if (player.hasFragment && !rep.fragmentsFound.includes('fragment_of_dawn')) {
    rep.fragmentsFound.push('fragment_of_dawn');
  }
  saveReputation(rep);
}

function loadFragmentCount() {
  return loadReputation().fragmentsFound.length;
}

function getWhispers() {
  const rep = loadReputation();
  const whispers = [];
  if (rep.fragmentsFound.includes('fragment_of_dawn')) whispers.push('...they say the Stranger found the Fragment of Dawn...');
  if (rep.slainEnemyTypes.includes('frost_wraith')) whispers.push('...conquered the Frost Wraith with nothing but a spark spell...');
  if (rep.slainEnemyTypes.includes('bone_revenant')) whispers.push('...faced the Bone Revenant and lived to tell the tale...');
  if (rep.slainEnemyTypes.includes('shadow_lurker')) whispers.push('...the one who walks in darkness without fear...');
  if (rep.totalEnemiesSlain >= 10) whispers.push('...a warrior who has slain ' + rep.totalEnemiesSlain + ' creatures of the deep...');
  if (rep.totalGold >= 200) whispers.push('...pockets heavy with ' + rep.totalGold + ' gold from the crypts...');
  if (rep.totalRuns >= 10) whispers.push('...descended into the crypts ' + rep.totalRuns + ' times and returned each time...');
  if (whispers.length === 0) {
    whispers.push('...another soul enters the crypts...');
    whispers.push('...the darkness stirs below...');
  }
  return whispers;
}

    localStorage.setItem('dungeonx_best', JSON.stringify(best));
  } catch(e) {}
}

}

// ============================================================
// AUDIO ENGINE
// ============================================================
let audioCtx = null;
let masterGain = null;
let isMuted = false;
let currentMusic = null;

function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = audioCtx.createGain();
  masterGain.gain.value = 0.3;
  masterGain.connect(audioCtx.destination);
}

function toggleMute() {
  isMuted = !isMuted;
  if (masterGain) masterGain.gain.value = isMuted ? 0 : 0.3;
  document.getElementById('muteBtn').textContent = 'SOUND: ' + (isMuted ? 'OFF' : 'ON');
}

document.getElementById('muteBtn').addEventListener('click', toggleMute);

function stopMusic() {
  if (currentMusic) {
    currentMusic.forEach(function(n) { try { n.stop(); } catch(e) {} });
    currentMusic = null;
  }
}

function playNote(freq, duration, type, gainVal, delay) {
  type = type || 'square'; gainVal = gainVal || 0.1; delay = delay || 0;
  if (!audioCtx) return null;
  var osc = audioCtx.createOscillator();
  var gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(gainVal, audioCtx.currentTime + delay);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + delay + duration);
  osc.connect(gain);
  gain.connect(masterGain);
  osc.start(audioCtx.currentTime + delay);
  osc.stop(audioCtx.currentTime + delay + duration);
  return osc;
}

function playFootstep() {
  if (!audioCtx) return;
  var osc = audioCtx.createOscillator();
  var gain = audioCtx.createGain();
  osc.type = 'square';
  osc.frequency.value = 80 + Math.random() * 40;
  gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
  osc.connect(gain); gain.connect(masterGain);
  osc.start(); osc.stop(audioCtx.currentTime + 0.08);
}

function playCombatHit() {
  if (!audioCtx) return;
  var n1 = audioCtx.createOscillator(); var g1 = audioCtx.createGain();
  n1.type = 'sawtooth'; n1.frequency.value = 150;
  g1.gain.setValueAtTime(0.15, audioCtx.currentTime);
  g1.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
  n1.connect(g1); g1.connect(masterGain); n1.start(); n1.stop(audioCtx.currentTime + 0.15);
  var n2 = audioCtx.createOscillator(); var g2 = audioCtx.createGain();
  n2.type = 'square'; n2.frequency.value = 60;
  g2.gain.setValueAtTime(0.12, audioCtx.currentTime);
  g2.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
  n2.connect(g2); g2.connect(masterGain); n2.start(); n2.stop(audioCtx.currentTime + 0.1);
}

function playSpellSound(element) {
  if (!audioCtx) return;
  var freqs = { fire: [440,660,880], ice: [330,495,220], stone: [110,165,130], combo: [440,550,660,880] };
  var f = freqs[element] || freqs.fire;
  f.forEach(function(freq, i) { playNote(freq, 0.3, 'sine', 0.08, i * 0.08); });
}

function playFizzle() {
  if (!audioCtx) return;
  var osc = audioCtx.createOscillator(); var gain = audioCtx.createGain();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(200, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.4);
  gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
  osc.connect(gain); gain.connect(masterGain); osc.start(); osc.stop(audioCtx.currentTime + 0.4);
}

function playVictory() {
  if (!audioCtx) return;
  [262,330,392,523,392,523,659].forEach(function(f,i) { playNote(f, 0.3, 'square', 0.1, i*0.15); });
}

function playDeath() {
  if (!audioCtx) return;
  [220,196,165,131,110].forEach(function(f,i) { playNote(f, 0.5, 'sawtooth', 0.08, i*0.2); });
}

function playDoorOpen() {

let ambientNodes = [];
function stopAmbient() {
  ambientNodes.forEach(function(n) { try { n.stop(); } catch(e) {} });
  ambientNodes = [];
}

function startTavernMusic() {
  stopAmbient();
  if (!audioCtx) return;
  var pad = audioCtx.createOscillator(); var padGain = audioCtx.createGain();
  var padFilter = audioCtx.createBiquadFilter();
  pad.type = 'sine'; pad.frequency.value = 130.81; padGain.gain.value = 0.04;
  padFilter.type = 'lowpass'; padFilter.frequency.value = 400;
  pad.connect(padFilter); padFilter.connect(padGain); padGain.connect(masterGain);
  pad.start(); ambientNodes.push(pad);
  var pad2 = audioCtx.createOscillator(); var pad2Gain = audioCtx.createGain();
  pad2.type = 'sine'; pad2.frequency.value = 196; pad2Gain.gain.value = 0.025;
  pad2.connect(pad2Gain); pad2Gain.connect(masterGain);
  pad2.start(); ambientNodes.push(pad2);
  var melodyNotes = [262,294,330,262,247,220,247,262]; var melodyIdx = 0;
  function playMelodyNote() {
    if (!audioCtx || ambientNodes.length === 0) return;
    playNote(melodyNotes[melodyIdx], 0.8, 'triangle', 0.03, 0);
    melodyIdx = (melodyIdx + 1) % melodyNotes.length;
    setTimeout(playMelodyNote, 800);
  }
  setTimeout(playMelodyNote, 1000);
}

function startCombatMusic() {
  stopAmbient();

// ============================================================
// PIXEL ART DRAWING HELPERS
// ============================================================
function drawPixelRect(x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(Math.floor(x), Math.floor(y), Math.floor(w), Math.floor(h));
}

function drawPixelBorder(x, y, w, h, color, thickness) {
  thickness = thickness || 2;
  ctx.strokeStyle = color; ctx.lineWidth = thickness;
  ctx.strokeRect(Math.floor(x)+0.5, Math.floor(y)+0.5, Math.floor(w), Math.floor(h));
}

function drawPixelText(text, x, y, color, size, align) {
  color = color || '#c8a840'; size = size || 16; align = align || 'left';
  ctx.fillStyle = color; ctx.font = size + 'px monospace';
  ctx.textAlign = align; ctx.textBaseline = 'top';
  ctx.fillText(text, Math.floor(x), Math.floor(y));
}

function drawTrophyWall(tx, ty) {
  var rep = loadReputation();
  drawPixelRect(tx, ty, 120, 8, '#5a4a3a');
  drawPixelText('TROPHIES', tx+60, ty-14, '#6a5a3a', 10, 'center');
  for (var i = 0; i < 10; i++) {
    var fx = tx+4+i*11, fy = ty+12;
    if (i < rep.fragmentsFound.length) {
      ctx.globalAlpha = 0.6 + Math.sin(frameCount*0.05+i)*0.4;
      drawPixelRect(fx, fy, 9, 9, '#c8a840'); ctx.globalAlpha = 1;
    } else { drawPixelRect(fx, fy, 9, 9, '#1a1a1a'); }
    drawPixelBorder(fx, fy, 9, 9, '#3a3a3a', 1);
  }
  var eTypes = ['shadow_lurker','frost_wraith','bone_revenant'];
  var sColors = ['#6a2a6a','#4080c0','#80c040'];
  var sNames = ['SL','FW','BR'];
  for (var i = 0; i < 3; i++) {
    var sx = tx+8+i*38, sy = ty+28;
    var slain = rep.slainEnemyTypes.includes(eTypes[i]);
    drawPixelRect(sx, sy, 28, 22, slain ? sColors[i] : '#2a2a2a');
    drawPixelText(sNames[i], sx+14, sy+5, slain ? '#ffffff' : '#4a4a4a', 10, 'center');
  }
  drawPixelText('RUNS: ' + rep.totalRuns, tx+60, ty+56, '#6a6a7a', 10, 'center');
}

function drawWhispers() {
  var whispers = getWhispers();
  if (whispers.length === 0) return;
  var speed = 0.008;
  var cycle = Math.floor(frameCount * speed) % whispers.length;
  ctx.globalAlpha = Math.abs(Math.sin(frameCount * speed * Math.PI)) * 0.35;
  drawPixelText(whispers[cycle], 20, H-60, '#6a5a4a', 11, 'left');
  var cycle2 = (cycle + 1) % whispers.length;
  ctx.globalAlpha = Math.abs(Math.cos(frameCount * speed * Math.PI)) * 0.3;
  drawPixelText(whispers[cycle2], W-20, H-75, '#6a5a4a', 11, 'right');
  ctx.globalAlpha = 1;
}

  drawPixelText(tavern.dialogueSpeaker, 110, H-190, '#c8a840', 18);
  var maxW = W - 240, words = tavern.dialogueText.split(' '), line = '', ly = H-160;

// ============================================================
// DUNGEON RENDERING — First Person Pseudo-3D
// ============================================================
const DIR_DX = [0, 1, 0, -1];
const DIR_DY = [-1, 0, 1, 0];
const DIR_NAMES = ['North', 'East', 'South', 'West'];

function getTile(x, y) {
  if (x < 0 || x >= 8 || y < 0 || y >= 8) return 1;
  return dungeonMap[y][x];
}

function isWall(x, y) {
  var t = getTile(x, y);
  if (t === 1) return true;
  if (t === 10 && !leverState.pulled) return false; // lever tile is walkable
  if (t === 10 && leverState.pulled) return false;
  if (t === 11 && !pushStoneState.pushed) return true; // pushable stone blocks passage
  if (t === 11 && pushStoneState.pushed) return false;
  if (t === 2 && doorStates['4,2'] === false) return true;
  if (t === 3 && doorStates['6,3'] === true) return true;
  return false;
}

function getFacingTile() {
  var fx = player.x + DIR_DX[player.dir];
  var fy = player.y + DIR_DY[player.dir];
  return { x: fx, y: fy, tile: getTile(fx, fy) };
}

function drawDungeon() {
  ctx.fillStyle = '#0a0a0f'; ctx.fillRect(0, 0, W, H);
  var viewW = 640, viewH = 480, viewX = 10, viewY = 10;
  ctx.save();
  ctx.beginPath(); ctx.rect(viewX, viewY, viewW, viewH); ctx.clip();
  drawFirstPersonView(viewX, viewY, viewW, viewH);
  ctx.restore();
  drawPixelBorder(viewX, viewY, viewW, viewH, '#3a3a4e', 3);
  drawHUD();
  drawMinimap(700, 30, 230, 230);
  drawPixelText('WASD: Move | [I]nventory | [U]se | [H]elp', W/2+100, H-25, '#4a4a5a', 12, 'center');
  drawPixelText('Facing ' + DIR_NAMES[player.dir], viewX+viewW/2, viewY+viewH+8, '#6a6a7a', 14, 'center');

  // Interaction prompt — large, pulsing, impossible to miss
  if (interactionPrompt) {
    var promptPulse = 0.7 + Math.sin(frameCount * 0.08) * 0.3;
    drawPixelRect(viewX+20, viewY+viewH-70, viewW-40, 50, 'rgba(0,0,0,0.9)');
    drawPixelBorder(viewX+20, viewY+viewH-70, viewW-40, 50, `rgba(200, 168, 64, ${promptPulse})`, 2);
    drawPixelText(interactionPrompt, viewX+viewW/2, viewY+viewH-56, '#c8a840', 16, 'center');
    // Add secondary hint for doors
    var facing = getFacingTile();
    if (facing.tile === 2 || facing.tile === 3) {
      drawPixelText('(or click the door in view)', viewX+viewW/2, viewY+viewH-36, '#6a6a7a', 12, 'center');
    }
  }

  // Notification
  if (notification.timer > 0) {
    notification.timer--;
    ctx.globalAlpha = Math.min(1, notification.timer / 30);
    drawPixelRect(viewX+20, viewY+viewH-95, viewW-40, 28, 'rgba(0,0,0,0.8)');
    drawPixelText(notification.text, viewX+viewW/2, viewY+viewH-90, notification.color, 14, 'center');
    ctx.globalAlpha = 1;
  }

  // Clue tile
  var tile = getTile(player.x, player.y);
  if (tile === 7) {
    drawPixelRect(viewX+60, viewY+viewH-130, viewW-120, 50, 'rgba(0,0,0,0.85)');
    drawPixelBorder(viewX+60, viewY+viewH-130, viewW-120, 50, '#8a6a30', 2);
    drawPixelText('Wall Marking: "Where flame meets stone, the path reveals itself"', viewX+viewW/2, viewY+viewH-118, '#c8a840', 13, 'center');
    drawPixelText('[Press P to cast spell combination]', viewX+viewW/2, viewY+viewH-98, '#6a6a7a', 12, 'center');
  }
}

function drawFirstPersonView(vx, vy, vw, vh) {
  var torchRatio = player.torch / player.maxTorch;
  var torchRadius = Math.floor(torchRatio * 3) + (torchRatio > 0.05 ? 1 : 0);
  var flicker = 0.85 + Math.random() * 0.15;
  var brightness = torchRatio * flicker;

  var ceilGrd = ctx.createLinearGradient(vx, vy, vx, vy+vh/2);
  ceilGrd.addColorStop(0, 'rgba(15, 12, 10, ' + (brightness*0.3) + ')');
  ceilGrd.addColorStop(1, 'rgba(30, 25, 20, ' + (brightness*0.5) + ')');
  ctx.fillStyle = ceilGrd; ctx.fillRect(vx, vy, vw, vh/2);

  var floorGrd = ctx.createLinearGradient(vx, vy+vh/2, vx, vy+vh);
  floorGrd.addColorStop(0, 'rgba(40, 35, 28, ' + (brightness*0.5) + ')');
  floorGrd.addColorStop(1, 'rgba(20, 18, 14, ' + (brightness*0.3) + ')');
  ctx.fillStyle = floorGrd; ctx.fillRect(vx, vy+vh/2, vw, vh/2);

  for (var dist = Math.min(torchRadius, 4); dist >= 0; dist--) {
    var distBright = brightness * (1 - dist * 0.2);
    if (distBright <= 0) continue;
    var fx = player.x + DIR_DX[player.dir] * dist;
    var fy = player.y + DIR_DY[player.dir] * dist;
    var leftDir = (player.dir + 3) % 4;
    var rightDir = (player.dir + 1) % 4;
    var scale = 1 / (dist + 1);
    var wallH = vh * scale;
    var wallW = vw * scale;
    var cx = vx + vw/2;
    var cy = vy + vh/2;

    for (var side = -2; side <= 2; side++) {
      var sx = fx + DIR_DX[leftDir] * (-side);
      var sy = fy + DIR_DY[leftDir] * (-side);
      if (isWall(sx, sy)) {
        var sideOffset = side * wallW * 0.5;
        var wx = cx + sideOffset - wallW * 0.25;
        var wy = cy - wallH/2;
        drawWallBlock(wx, wy, wallW*0.5, wallH, distBright, dist, side);
      }
    }

    var lx = fx + DIR_DX[leftDir], ly = fy + DIR_DY[leftDir];
    if (isWall(lx, ly)) drawSideWall(cx-wallW/2, cy-wallH/2, wallW*0.15, wallH, distBright, 'left', dist);
    var rx = fx + DIR_DX[rightDir], ry = fy + DIR_DY[rightDir];
    if (isWall(rx, ry)) drawSideWall(cx+wallW/2-wallW*0.15, cy-wallH/2, wallW*0.15, wallH, distBright, 'right', dist);

    if (isWall(fx, fy)) {
      drawFrontWall(cx-wallW/2, cy-wallH/2, wallW, wallH, distBright, dist, fx, fy);
      break;
    }

    if (fx >= 0 && fx < 8 && fy >= 0 && fy < 8) explored[fy][fx] = true;
  }

  if (torchRatio > 0.05) {
    var tGrd = ctx.createRadialGradient(vx+vw/2, vy+vh*0.6, 0, vx+vw/2, vy+vh*0.6, vw*0.7);
    tGrd.addColorStop(0, 'rgba(255, 140, 40, ' + (brightness*0.06) + ')');
    tGrd.addColorStop(0.6, 'rgba(255, 80, 20, ' + (brightness*0.02) + ')');
    tGrd.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = tGrd; ctx.fillRect(vx, vy, vw, vh);
  }

  if (torchRatio < 0.4) {
    ctx.fillStyle = 'rgba(0, 0, 0, ' + Math.min(0.85, (0.4-torchRatio)*1.5) + ')';
    ctx.fillRect(vx, vy, vw, vh);
  }
  if (torchRatio <= 0.05) {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.95)'; ctx.fillRect(vx, vy, vw, vh);
    drawPixelText('Your torch sputters...', vx+vw/2, vy+vh/2, '#3a2a1a', 20, 'center');
  }
  explored[player.y][player.x] = true;
}

function drawWallBlock(x, y, w, h, brightness, dist, side) {
  var r = Math.floor(60*brightness), g = Math.floor(55*brightness), b = Math.floor(50*brightness);
  ctx.fillStyle = 'rgb('+r+','+g+','+b+')'; ctx.fillRect(x, y, w, h);
  var blockH = h/4;
  for (var i = 0; i < 4; i++) {
    ctx.fillStyle = 'rgb('+Math.floor(40*brightness)+','+Math.floor(38*brightness)+','+Math.floor(35*brightness)+')';
    ctx.fillRect(x, y+i*blockH, w, 2);
    ctx.fillRect(x + w*0.5 + (i%2)*w*0.3, y+i*blockH, 2, blockH);
  }
  if ((dist+side)%3===0 && brightness > 0.3) {
    ctx.fillStyle = 'rgb(20, '+Math.floor(80*brightness)+', 20)';
    ctx.fillRect(x+w*0.2, y+h*0.7, w*0.1, h*0.05);
    ctx.fillRect(x+w*0.25, y+h*0.67, w*0.08, h*0.03);
  }
}

function drawSideWall(x, y, w, h, brightness, side, dist) {
  ctx.fillStyle = 'rgb('+Math.floor(45*brightness)+','+Math.floor(42*brightness)+','+Math.floor(38*brightness)+')';
  ctx.fillRect(x, y, w, h);
  var blockH = h/4;
  for (var i = 0; i < 4; i++) {
    ctx.fillStyle = 'rgb('+Math.floor(30*brightness)+','+Math.floor(28*brightness)+','+Math.floor(25*brightness)+')';
    ctx.fillRect(x, y+i*blockH, w, 1);
  }
}

function drawFrontWall(x, y, w, h, brightness, dist, fx, fy) {
  var tile = getTile(fx, fy);
  var r = Math.floor(65*brightness), g = Math.floor(60*brightness), b = Math.floor(55*brightness);
  ctx.fillStyle = 'rgb('+r+','+g+','+b+')'; ctx.fillRect(x, y, w, h);

  var blockH = h/5, blockW = w/4;
  for (var by2 = 0; by2 < 5; by2++) {
    for (var bx2 = 0; bx2 < 4; bx2++) {
      var offset = (by2%2)*blockW*0.5;
      var br = r + Math.floor((Math.random()-0.5)*10);
      var bg = g + Math.floor((Math.random()-0.5)*10);
      var bb = b + Math.floor((Math.random()-0.5)*10);
      ctx.fillStyle = 'rgb('+Math.max(0,br)+','+Math.max(0,bg)+','+Math.max(0,bb)+')';
      ctx.fillRect(x+bx2*blockW+offset, y+by2*blockH, blockW-2, blockH-2);
    }
  }

  ctx.fillStyle = 'rgb('+Math.floor(35*brightness)+','+Math.floor(33*brightness)+','+Math.floor(30*brightness)+')';
  for (var i = 1; i < 5; i++) ctx.fillRect(x, y+i*blockH, w, 2);
  for (var i = 1; i < 4; i++) ctx.fillRect(x+i*blockW, y, 2, h);

  // Door rendering
  if (tile === 2 || tile === 3) {
    var doorW = w*0.4, doorH = h*0.7;
    var dx = x + (w - doorW)/2, dy = y + h - doorH;
    if (tile === 3 && doorStates['6,3']) {
      ctx.fillStyle = 'rgb('+Math.floor(50*brightness)+', '+Math.floor(30*brightness)+', '+Math.floor(15*brightness)+')';
      ctx.fillRect(dx, dy, doorW, doorH);
      // Lock/keyhole
      ctx.fillStyle = 'rgb('+Math.floor(180*brightness)+', '+Math.floor(150*brightness)+', '+Math.floor(40*brightness)+')';
      ctx.fillRect(dx+doorW/2-6, dy+doorH/2-6, 12, 12);
      // Keyhole shape
      ctx.fillStyle = 'rgb('+Math.floor(20*brightness)+', '+Math.floor(15*brightness)+', '+Math.floor(10*brightness)+')';
      ctx.fillRect(dx+doorW/2-2, dy+doorH/2-3, 4, 4);
      ctx.fillRect(dx+doorW/2-1, dy+doorH/2+1, 2, 5);
      // Runes
      ctx.fillStyle = 'rgb('+Math.floor(100*brightness)+', '+Math.floor(40*brightness)+', '+Math.floor(40*brightness)+')';
      for (var ri = 0; ri < 3; ri++) ctx.fillRect(dx+8, dy+15+ri*doorH*0.25, doorW-16, 3);
      ctx.fillStyle = 'rgb('+Math.floor(80*brightness)+', '+Math.floor(60*brightness)+', '+Math.floor(30*brightness)+')';
      ctx.fillRect(dx-4, dy-4, doorW+8, 8);
    } else if (tile === 2 && doorStates['4,2'] === false) {
      ctx.fillStyle = 'rgb('+Math.floor(70*brightness)+', '+Math.floor(45*brightness)+', '+Math.floor(20*brightness)+')';
      ctx.fillRect(dx, dy, doorW, doorH);
      ctx.fillStyle = 'rgb('+Math.floor(50*brightness)+', '+Math.floor(32*brightness)+', '+Math.floor(14*brightness)+')';
      for (var pi = 0; pi < 4; pi++) ctx.fillRect(dx+pi*doorW/4, dy, 2, doorH);
      // Keyhole on regular door
      ctx.fillStyle = 'rgb('+Math.floor(150*brightness)+', '+Math.floor(130*brightness)+', '+Math.floor(80*brightness)+')';
      ctx.fillRect(dx+doorW-14, dy+doorH/2-4, 8, 8);
      ctx.fillStyle = 'rgb('+Math.floor(30*brightness)+', '+Math.floor(20*brightness)+', '+Math.floor(10*brightness)+')';
      ctx.fillRect(dx+doorW-12, dy+doorH/2-2, 3, 3);
      ctx.fillRect(dx+doorW-11, dy+doorH/2+1, 1, 3);
    }
  }

  // Lever rendering
  if (tile === 10 && dist <= 1) {
    var leverX = x + w*0.45, leverY = y + h*0.2;
    var leverH2 = h*0.5;
    // Bracket
    ctx.fillStyle = 'rgb('+Math.floor(100*brightness)+', '+Math.floor(90*brightness)+', '+Math.floor(80*brightness)+')';
    ctx.fillRect(leverX-2, leverY, 8, leverH2);
    // Handle
    if (leverState.pulled) {
      ctx.fillStyle = 'rgb('+Math.floor(140*brightness)+', '+Math.floor(60*brightness)+', '+Math.floor(30*brightness)+')';
      ctx.fillRect(leverX-4, leverY+leverH2-12, 12, 12);
    } else {
      ctx.fillStyle = 'rgb('+Math.floor(140*brightness)+', '+Math.floor(60*brightness)+', '+Math.floor(30*brightness)+')';
      ctx.fillRect(leverX-4, leverY, 12, 12);
    }
  }

  // Pushable stone rendering
  if (tile === 11 && dist <= 1 && !pushStoneState.pushed) {
    var stoneX = x + w*0.3, stoneY = y + h*0.3;
    var stoneW = w*0.4, stoneH2 = h*0.4;
    ctx.fillStyle = 'rgb('+Math.floor(75*brightness)+', '+Math.floor(70*brightness)+', '+Math.floor(60*brightness)+')';
    ctx.fillRect(stoneX, stoneY, stoneW, stoneH2);
    // Cracks
    ctx.fillStyle = 'rgb('+Math.floor(40*brightness)+', '+Math.floor(38*brightness)+', '+Math.floor(32*brightness)+')';
    ctx.fillRect(stoneX+stoneW*0.3, stoneY+stoneH2*0.2, 2, stoneH2*0.6);
    ctx.fillRect(stoneX+stoneW*0.2, stoneY+stoneH2*0.5, stoneW*0.3, 2);
  }

  // Cracks on wall
  if (dist < 2 && brightness > 0.4) {
    ctx.fillStyle = 'rgba(0, 0, 0, ' + (brightness*0.3) + ')';
    ctx.fillRect(x+w*0.3, y+h*0.2, 2, h*0.15);
    ctx.fillRect(x+w*0.3, y+h*0.35, w*0.05, 2);
    ctx.fillRect(x+w*0.7, y+h*0.6, 2, h*0.1);
  }
}

// ============================================================
// HUD
// ============================================================
function drawHUD() {
  var hudY = 500;
  var barW = 140, barH = 14;

  // HP Bar
  drawPixelText('HP', 20, hudY, '#c83030', 12);
  drawPixelRect(42, hudY, barW, barH, '#2a1010');
  drawPixelRect(42, hudY, barW * (player.hp / player.maxHp), barH, '#c83030');
  drawPixelBorder(42, hudY, barW, barH, '#5a2020');
  drawPixelText(player.hp + '/' + player.maxHp, 42+barW/2, hudY+1, '#e8c8c8', 11, 'center');

  // Mana Bar
  drawPixelText('MP', 20, hudY+18, '#3050c8', 12);
  drawPixelRect(42, hudY+18, barW, barH, '#101030');
  drawPixelRect(42, hudY+18, barW * (player.mana / player.maxMana), barH, '#3050c8');
  drawPixelBorder(42, hudY+18, barW, barH, '#202050');
  drawPixelText(player.mana + '/' + player.maxMana, 42+barW/2, hudY+19, '#c8c8e8', 11, 'center');

  // Torch Meter
  var torchPct = player.torch / player.maxTorch;
  var torchColor = torchPct > 0.5 ? '#c88020' : torchPct > 0.2 ? '#c85020' : '#c83020';
  drawPixelText('TORCH', 195, hudY, '#c88020', 12);
  drawPixelRect(242, hudY, barW, barH, '#1a1008');
  drawPixelRect(242, hudY, barW * torchPct, barH, torchColor);
  drawPixelBorder(242, hudY, barW, barH, '#5a4010');
  drawPixelText(Math.floor(player.torch) + '%', 242+barW/2, hudY+1, '#e8d8a8', 11, 'center');

  // Food Bar
  var foodPct = player.food / player.maxFood;
  var foodColor = foodPct > 0.3 ? '#c8a060' : '#c86030';
  drawPixelText('FOOD', 195, hudY+18, '#c8a060', 12);
  drawPixelRect(242, hudY+18, barW, barH, '#1a1408');
  drawPixelRect(242, hudY+18, barW * foodPct, barH, foodColor);
  drawPixelBorder(242, hudY+18, barW, barH, '#5a4a10');
  drawPixelText(Math.floor(player.food), 242+barW/2, hudY+19, '#e8d8a8', 11, 'center');

  // Water Bar
  var waterPct = player.water / player.maxWater;
  var waterColor = waterPct > 0.3 ? '#4090c8' : '#c84040';
  drawPixelText('WATER', 195, hudY+36, '#4090c8', 12);
  drawPixelRect(242, hudY+36, barW, barH, '#081018');
  drawPixelRect(242, hudY+36, barW * waterPct, barH, waterColor);
  drawPixelBorder(242, hudY+36, barW, barH, '#204050');
  drawPixelText(Math.floor(player.water), 242+barW/2, hudY+37, '#c8d8e8', 11, 'center');

  // Gold & Floor
  drawPixelText('Gold: ' + player.gold, 400, hudY, '#c8a840', 14);
  drawPixelText('Floor: B1', 400, hudY+18, '#8a8a9a', 14);

  // Inventory hints
  if (player.hasAncientScroll) drawPixelText('Ancient Scroll', 400, hudY+36, '#a080c0', 13);
  if (player.hasHeartOfDungeon) drawPixelText('Heart of the Dungeon!', 400, hudY+36, '#c8a840', 13);

  // Fragment indicator
  if (player.hasFragment) {
    ctx.globalAlpha = 0.5 + Math.sin(frameCount * 0.05) * 0.5;
    drawPixelRect(560, hudY+36, 10, 10, '#c8a840');
    ctx.globalAlpha = 1;
    drawPixelText('Fragment of Dawn', 576, hudY+36, '#c8a840', 13);
  }

  // Spells & controls
  drawPixelText('[F]ire [I]ce [S]tone | [P]uzzle | [I]nventory | [U]se', 20, hudY+56, '#5a5a6a', 11);

  // Quick inventory slots (first 4 backpack items)

function drawMinimap(mx, my, mw, mh) {
  var cellW = mw/8, cellH = mh/8;
  drawPixelRect(mx-4, my-4, mw+8, mh+8, '#0a0a0f');
  drawPixelBorder(mx-4, my-4, mw+8, mh+8, '#3a3a4e', 2);
  drawPixelText('MAP', mx+mw/2, my-20, '#6a6a7a', 12, 'center');

  for (var y = 0; y < 8; y++) {
    for (var x = 0; x < 8; x++) {
      var cx2 = mx+x*cellW, cy2 = my+y*cellH;
      if (!explored[y][x]) { drawPixelRect(cx2, cy2, cellW-1, cellH-1, '#0a0a0f'); continue; }
      var tile = dungeonMap[y][x];
      var color = '#1a1a2e';
      if (tile === 1) color = '#4a4a5a';
      else if (tile === 0 || tile === 4 || tile === 7 || tile === 8 || tile === 10) color = '#2a2a3e';
      else if (tile === 11) color = pushStoneState.pushed ? '#2a2a3e' : '#5a5a5a';
      else if (tile === 2) color = doorStates['4,2'] === false ? '#6a4a2a' : '#2a2a3e';
      else if (tile === 3) color = doorStates['6,3'] ? '#8a4a4a' : '#2a2a3e';
      else if (tile === 5) color = '#c8a840';
      else if (tile === 6) color = '#40c880';
      else if (tile === 9) color = '#c8a840';
      drawPixelRect(cx2, cy2, cellW-1, cellH-1, color);
      if (tile === 4 && enemies[x+','+y]) drawPixelRect(cx2+cellW/4, cy2+cellH/4, cellW/2, cellH/2, '#c83030');
      if (tile === 7) drawPixelRect(cx2+cellW/3, cy2+cellH/3, cellW/3, cellH/3, '#c8a840');
      if (tile === 10) drawPixelRect(cx2+cellW/3, cy2+cellH/3, cellW/3, cellH/3, '#8a6a3a');
    }
  }

  var px = mx+player.x*cellW+cellW/4, py = my+player.y*cellH+cellH/4;
  drawPixelRect(px, py, cellW/2, cellH/2, '#40c8f0');
  var arrowSize = cellW/3;
  ctx.fillStyle = '#80e0ff'; ctx.beginPath();
  var acx = px+cellW/4, acy = py+cellH/4;
  if (player.dir === 0) { ctx.moveTo(acx, acy-arrowSize); ctx.lineTo(acx-arrowSize/2, acy); ctx.lineTo(acx+arrowSize/2, acy); }
  else if (player.dir === 1) { ctx.moveTo(acx+arrowSize, acy); ctx.lineTo(acx, acy-arrowSize/2); ctx.lineTo(acx, acy+arrowSize/2); }
  else if (player.dir === 2) { ctx.moveTo(acx, acy+arrowSize); ctx.lineTo(acx-arrowSize/2, acy); ctx.lineTo(acx+arrowSize/2, acy); }
  else { ctx.moveTo(acx-arrowSize, acy); ctx.lineTo(acx, acy-arrowSize/2); ctx.lineTo(acx, acy+arrowSize/2); }
  ctx.fill();
}

function drawCombat() {

    drawPixelText(entry.text, 40, 412+(i-logStart)*20, entry.color || '#c8c8d0', 14);
  }

  if (combat.playerTurn && combat.animTimer <= 0) {
    var actions = [
      { key: '1', name: 'ATTACK', color: '#8a8a8a', desc: 'Physical strike' },
      { key: '2', name: 'FIRE', color: '#c85020', desc: getSpellDesc(enemy, 'fire', 15) },
      { key: '3', name: 'ICE', color: '#2060c8', desc: getSpellDesc(enemy, 'ice', 12) },
      { key: '4', name: 'STONE', color: '#8a7a5a', desc: getSpellDesc(enemy, 'stone', 14) },
      { key: '5', name: 'FLEE', color: '#6a6a3a', desc: 'Run away (50%)' }
    ];
    actions.forEach(function(a, i) {
      var bx = 15+i*188, by = 540;
      var hovered = mouseX >= bx && mouseX <= bx+178 && mouseY >= by && mouseY <= by+60;
      drawPixelRect(bx, by, 178, 55, hovered ? '#2a2a3e' : '#1a1a2e');

function getSpellDesc(enemy, element, cost) {
  if (enemy.weaknesses && enemy.weaknesses[element]) return cost + ' MP - SUPER EFFECTIVE!';
  if (enemy.resistances && enemy.resistances[element]) return cost + ' MP - RESISTED';
  return cost + ' MP';
}

function executeCombatAction(action) {
  if (!combat.playerTurn || combat.animTimer > 0) return;
  var enemy = combat.enemy;
  if (!enemy) return;
  combat.playerTurn = false;
  combat.animTimer = 30;

  if (action === 'attack') {
    var dmg = Math.max(1, 10 + Math.floor(Math.random()*8) - enemy.def);
    // Weapon bonus from equipment
    if (inventory.equipment.right_hand && inventory.equipment.right_hand.atkBonus) dmg += inventory.equipment.right_hand.atkBonus;
    enemy.hp -= dmg;
    combat.log.push({ text: 'You strike the '+enemy.name+' for '+dmg+' damage!', color: '#c8c8d0' });
    playCombatHit(); combat.shakeTimer = 10; combat.flashTimer = 5;
    combat.flashColor = 'rgba(255, 255, 255, 0.15)';
  } else if (action === 'fire' || action === 'ice' || action === 'stone') {
    var spellData = {
      fire: { cost: 15, baseDmg: 20, range: 10, color: '#c85020', weakColor: '#c88020', flashColor: 'rgba(255, 80, 20, 0.4)' },
      ice: { cost: 12, baseDmg: 18, range: 8, color: '#3060c8', weakColor: '#60a0e0', flashColor: 'rgba(40, 80, 200, 0.3)' },
      stone: { cost: 14, baseDmg: 22, range: 6, color: '#8a7a5a', weakColor: '#c8b870', flashColor: 'rgba(140, 120, 60, 0.3)' }
    };
    var sd = spellData[action];
    if (player.mana < sd.cost) { combat.log.push({ text: 'Not enough mana!', color: '#c85050' }); combat.playerTurn = true; combat.animTimer = 0; return; }
    player.mana -= sd.cost;
    var dmg = sd.baseDmg + Math.floor(Math.random()*sd.range);
    var weakMult = enemy.weaknesses && enemy.weaknesses[action];
    var resistMult = enemy.resistances && enemy.resistances[action];
    var spellName = action.charAt(0).toUpperCase()+action.slice(1);
    if (weakMult) { dmg = Math.floor(dmg*weakMult); combat.log.push({ text: spellName+' Spell hits! '+enemy.name+' is WEAK! '+dmg+' damage!', color: sd.weakColor }); }
    else if (resistMult) { dmg = Math.floor(dmg*resistMult); combat.log.push({ text: spellName+' Spell barely affects '+enemy.name+'! RESISTED! Only '+dmg+' damage.', color: '#6a6a7a' }); }
    else { combat.log.push({ text: spellName+' Spell deals '+dmg+' damage!', color: sd.color }); }
    enemy.hp -= dmg;
    playSpellSound(action === 'stone' ? 'fire' : action);
    combat.shakeTimer = 15; combat.flashTimer = 10; combat.flashColor = sd.flashColor;
  } else if (action === 'flee') {
    if (Math.random() < 0.5) {
      combat.log.push({ text: 'You fled successfully!', color: '#8a8a4a' });
      setTimeout(function() {
        state = GameState.DUNGEON; startDungeonAmbient();
        var backDir = (player.dir+2)%4;
        var bx = player.x+DIR_DX[backDir], by2 = player.y+DIR_DY[backDir];
        if (!isWall(bx, by2)) { player.x = bx; player.y = by2; }
      }, 500);
      return;
    } else { combat.log.push({ text: 'Failed to flee!', color: '#c85050' }); }
  }

  if (enemy.hp <= 0) {
    enemy.hp = 0;
    combat.log.push({ text: enemy.name+' is defeated!', color: '#40c840' });
    player.gold += enemy.goldReward; player.xp += enemy.xpReward;
    player.enemiesSlain++;
    if (enemy.type) player.slainTypes[enemy.type] = true;
    combat.log.push({ text: '+'+enemy.goldReward+' gold, +'+enemy.xpReward+' XP', color: '#c8a840' });
    // Drop items
    if (enemy.drops) {
      enemy.drops.forEach(function(dropId) {
        var dropItem = createItem(dropId);
        if (dropItem) {
          if (addToBackpack(dropItem)) {
            combat.log.push({ text: 'Obtained: '+dropItem.name+'!', color: '#c8a840' });
          } else {
            combat.log.push({ text: dropItem.name+' dropped but your pack is full!', color: '#c85050' });
          }
        }
      });
    }
    playVictory();
    delete enemies[combat.enemyPos];
    setTimeout(function() {
      state = GameState.DUNGEON; startDungeonAmbient();
      showNotification('Enemy defeated! The shadows recede...', '#40c840');
    }, 1500);
    return;
  }
  setTimeout(function() { enemyTurn(); }, 800);
}

function enemyTurn() {
  var enemy = combat.enemy;
  if (!enemy || enemy.hp <= 0) return;
  var dmg = Math.max(1, enemy.atk - 2 + Math.floor(Math.random()*5));
  // Defense bonus from equipment
  var defBonus = 0;
  for (var slot in inventory.equipment) {
    if (inventory.equipment[slot] && inventory.equipment[slot].defBonus) defBonus += inventory.equipment[slot].defBonus;
  }
  dmg = Math.max(1, dmg - defBonus);
  player.hp -= dmg;
  combat.log.push({ text: enemy.name+' attacks you for '+dmg+' damage!', color: '#c85050' });
  playCombatHit(); combat.shakeTimer = 8; combat.flashTimer = 5;
  combat.flashColor = 'rgba(200, 40, 40, 0.3)';
  if (player.hp <= 0) {
    player.hp = 0;
    combat.log.push({ text: 'You have been slain...', color: '#c83030' });
    playDeath();
    setTimeout(function() { state = GameState.GAMEOVER; }, 1500);
    return;
  }
  combat.playerTurn = true; combat.animTimer = 0;
}

function attemptPuzzleCast() {
  if (puzzleState.selectedSpells.length !== 2) return;
  if (player.mana < 10) { puzzleState.message = 'Not enough mana!'; puzzleState.msgColor = '#c85050'; puzzleState.msgTimer = 90; return; }
  player.mana -= 10;
  var sorted = puzzleState.selectedSpells.slice().sort();
  if (sorted[0] === 'fire' && sorted[1] === 'stone') {
    playSpellSound('combo');
    puzzleState.message = 'The sealed door glows with magma... it opens!';
    puzzleState.msgColor = '#c8a840'; puzzleState.msgTimer = 120;
    doorStates['6,3'] = false; player.secretsFound++;
    setTimeout(function() { state = GameState.DUNGEON; showNotification('The sealed door is now open!', '#c8a840', 180); }, 2000);
  } else {
    playFizzle();
    puzzleState.message = 'The elements fizzle and dissipate. Wrong combination...';
    puzzleState.msgColor = '#8a5050'; puzzleState.msgTimer = 90;
  }
  puzzleState.selectedSpells = [];
}

function togglePuzzleSpell(spell) {
  var idx = puzzleState.selectedSpells.indexOf(spell);
  if (idx >= 0) { puzzleState.selectedSpells.splice(idx, 1); }
  else {
    if (puzzleState.selectedSpells.length >= 2) puzzleState.selectedSpells.shift();
    puzzleState.selectedSpells.push(spell);
  }
}

function drawItemTooltip(item, tx, ty) {
  if (ty < 10) ty = 10;
  if (tx + 220 > W) tx = W - 230;
  var tw = 210, th = 70;
  if (item.description) th += 18;
  if (item.atkBonus) th += 16;
  if (item.defBonus) th += 16;
  drawPixelRect(tx, ty, tw, th, 'rgba(10, 10, 20, 0.95)');
  drawPixelBorder(tx, ty, tw, th, '#c8a840', 2);
  drawPixelText(item.name, tx+8, ty+6, '#c8a840', 14);
  drawPixelText(item.type.toUpperCase(), tx+8, ty+24, '#6a6a8a', 11);
  drawPixelText('Wt: '+item.weight, tx+tw-40, ty+24, '#6a6a7a', 11);
  var infoY = ty+40;
  if (item.atkBonus) { drawPixelText('ATK +'+item.atkBonus, tx+8, infoY, '#c85050', 11); infoY += 16; }
  if (item.defBonus) { drawPixelText('DEF +'+item.defBonus, tx+8, infoY, '#5050c8', 11); infoY += 16; }
  if (item.description) {
    // Word wrap description
    var words = item.description.split(' '), line = '';
    ctx.font = '10px monospace';
    for (var wi = 0; wi < words.length; wi++) {
      var test = line + words[wi] + ' ';
      if (ctx.measureText(test).width > tw-16) {
        drawPixelText(line, tx+8, infoY, '#8a8a9a', 10); line = words[wi]+' '; infoY += 14;
      } else { line = test; }
    }
    drawPixelText(line, tx+8, infoY, '#8a8a9a', 10);
  }
}

canvas.addEventListener('mousemove', function(e) {
  var rect = canvas.getBoundingClientRect();
  mouseX = (e.clientX - rect.left) * (W / rect.width);
  mouseY = (e.clientY - rect.top) * (H / rect.height);

  // Update drag position
  if (dragState.active) {
    dragState.mouseX = mouseX;
    dragState.mouseY = mouseY;
  }

  // Push stone hold tracking
  if (mouseDown && state === GameState.DUNGEON && pushStoneState.holding) {
    // Keep tracking
  }

  // Lever drag tracking
  if (mouseDown && state === GameState.DUNGEON && leverDragState.active) {
    leverDragState.currentY = mouseY;
  }

  // Tavern hover detection
  if (state === GameState.TAVERN && !tavern.dialogueActive && !tavern.noticeBoard) {
    tavern.hoveredNpc = -1;
    if (mouseX >= 410 && mouseX <= 510 && mouseY >= 200 && mouseY <= 350) tavern.hoveredNpc = 0;
    if (mouseX >= 130 && mouseX <= 230 && mouseY >= 290 && mouseY <= 430) tavern.hoveredNpc = 1;
    if (mouseX >= 620 && mouseX <= 730 && mouseY >= 300 && mouseY <= 440) tavern.hoveredNpc = 2;
  }

  if (state === GameState.TAVERN && tavern.noticeBoard) {
    tavern.hoveredDungeon = -1;
    if (mouseX >= 180 && mouseX <= W-180) {
      if (mouseY >= 130 && mouseY <= 300) tavern.hoveredDungeon = 0;
      if (mouseY >= 330 && mouseY <= 500) tavern.hoveredDungeon = 1;
    }
  }
});

// Lever drag state
var leverDragState = { active: false, startY: 0, currentY: 0 };

canvas.addEventListener('mousedown', function(e) {
  initAudio();
  mouseDown = true;
  var rect = canvas.getBoundingClientRect();
  var cx = (e.clientX - rect.left) * (W / rect.width);
  var cy = (e.clientY - rect.top) * (H / rect.height);

  // Inventory drag start
  if (state === GameState.INVENTORY) {
    handleInventoryMouseDown(cx, cy, e.button);
    return;
  }

  // Dungeon interactions
  if (state === GameState.DUNGEON) {
    var facing = getFacingTile();
    // Lever interaction
    if (facing.tile === 10 && !leverState.pulled && isFacingDistance1(facing)) {
      var viewX = 10, viewY = 10, viewW = 640, viewH = 480;
      if (cx >= viewX+viewW*0.35 && cx <= viewX+viewW*0.65 && cy >= viewY+viewH*0.1 && cy <= viewY+viewH*0.7) {
        leverDragState.active = true;
        leverDragState.startY = cy;
        leverDragState.currentY = cy;
      }
    }
    // Push stone interaction
    if (facing.tile === 11 && !pushStoneState.pushed && isFacingDistance1(facing)) {
      var viewX2 = 10, viewY2 = 10, viewW2 = 640, viewH2 = 480;
      if (cx >= viewX2+viewW2*0.2 && cx <= viewX2+viewW2*0.8 && cy >= viewY2+viewH2*0.2 && cy <= viewY2+viewH2*0.8) {
        pushStoneState.holding = true;
        pushStoneState.holdStart = Date.now();
      }
    }
    // Chest interaction
    if (facing.tile === 5 && isFacingDistance1(facing)) {
      handleChestClick(facing);
    }
    // Door click — use key on door by clicking in viewport
    if ((facing.tile === 2 || facing.tile === 3) && isFacingDistance1(facing)) {
      var vX = 10, vY = 10, vW = 640, vH = 480;
      if (cx >= vX && cx <= vX+vW && cy >= vY && cy <= vY+vH) {
        handleUseKey();
      }
    }
  }
});

canvas.addEventListener('mouseup', function(e) {
  mouseDown = false;
  var rect = canvas.getBoundingClientRect();
  var cx = (e.clientX - rect.left) * (W / rect.width);
  var cy = (e.clientY - rect.top) * (H / rect.height);

  // Inventory drag end
  if (state === GameState.INVENTORY && dragState.active) {
    handleInventoryDrop(cx, cy);
    return;
  }

  // Lever release
  if (leverDragState.active) {
    var dragDist = leverDragState.currentY - leverDragState.startY;
    if (dragDist >= 60) {
      // Successfully pulled!
      leverState.pulled = true;
      secretPassageOpen = true;
      // Open secret passage - change wall at (3,0) row 0 to open, but let's change (1,3) wall
      // Actually let's open the wall between (0,3) or make the map change meaningful
      // We'll change tile at row 2 col 3 (the wall) to open
      if (dungeonMap[2][3] === 1) dungeonMap[2][3] = 0;
      playLeverSound();
      showNotification('The lever clicks! A secret passage grinds open!', '#c8a840', 180);
    } else {
      playClank();
      showNotification('The lever springs back. Pull harder!', '#6a6a7a');
    }
    leverDragState.active = false;
  }

  // Push stone release
  if (pushStoneState.holding) {
    pushStoneState.holding = false;
  }
});

function isFacingDistance1(facing) {
  var fx = player.x + DIR_DX[player.dir];
  var fy = player.y + DIR_DY[player.dir];
  return fx === facing.x && fy === facing.y;
}

canvas.addEventListener('click', function(e) {
  initAudio();
  var rect = canvas.getBoundingClientRect();
  var cx = (e.clientX - rect.left) * (W / rect.width);
  var cy = (e.clientY - rect.top) * (H / rect.height);

  if (state === GameState.TITLE) { enterTavern(); return; }
  if (state === GameState.TAVERN) { handleTavernClick(cx, cy); return; }
  if (state === GameState.COMBAT) { handleCombatClick(cx, cy); return; }
  if (state === GameState.PUZZLE) { handlePuzzleClick(cx, cy); return; }
  if (state === GameState.GAMEOVER || state === GameState.VICTORY) { resetGame(); enterTavern(); return; }
  if (state === GameState.FRAGMENT) {
    if (fragmentDiscover.timer > 120) { state = GameState.DUNGEON; startDungeonAmbient(); showNotification('The Fragment of Dawn pulses with ancient warmth...', '#c8a840', 180); }
    return;
  }
  if (state === GameState.JOURNEY) {
    if (journey.ready) {
      var ftx = W/2-170, fty = 370;
      if (cx >= ftx && cx <= ftx+150 && cy >= fty && cy <= fty+50) { startDungeon(); return; }
    }
    return;
  }
});

// Right-click for using items in inventory
canvas.addEventListener('contextmenu', function(e) {
  e.preventDefault();
  if (state === GameState.INVENTORY) {
    var rect = canvas.getBoundingClientRect();
    var cx = (e.clientX - rect.left) * (W / rect.width);
    var cy = (e.clientY - rect.top) * (H / rect.height);
    handleInventoryRightClick(cx, cy);
  }
});

function handleInventoryMouseDown(cx, cy, button) {
  if (button !== 0) return; // Left click only for drag

  var gridX = 500, gridY = 60;
  var cellSize = SLOT_SIZE + SLOT_PAD*2;
  var silX = 80+140, silY = 60+230;

  // Check backpack slots
  for (var row = 0; row < BACKPACK_ROWS; row++) {
    for (var col = 0; col < BACKPACK_COLS; col++) {
      var idx = row*BACKPACK_COLS+col;
      var sx = gridX + col*cellSize;
      var sy = gridY + 24 + row*cellSize;
      if (cx >= sx && cx <= sx+cellSize && cy >= sy && cy <= sy+cellSize) {
        if (inventory.backpack[idx]) {
          dragState.active = true;
          dragState.item = inventory.backpack[idx];
          dragState.sourceSlot = { type: 'backpack', index: idx };
          dragState.mouseX = cx;
          dragState.mouseY = cy;
          return;
        }
      }
    }
  }

  // Check equipment slots
  var eqSlots = [
    { name: 'head', x: silX-25, y: silY-170, w: 50, h: 50 },
    { name: 'chest', x: silX-25, y: silY-105, w: 50, h: 50 },
    { name: 'left_hand', x: silX-90, y: silY-105, w: 50, h: 50 },
    { name: 'right_hand', x: silX+40, y: silY-105, w: 50, h: 50 },
    { name: 'legs', x: silX-25, y: silY-40, w: 50, h: 50 },
    { name: 'feet', x: silX-25, y: silY+20, w: 50, h: 50 }
  ];

  for (var i = 0; i < eqSlots.length; i++) {
    var slot = eqSlots[i];
    if (cx >= slot.x && cx <= slot.x+slot.w && cy >= slot.y && cy <= slot.y+slot.h) {
      if (inventory.equipment[slot.name]) {
        dragState.active = true;
        dragState.item = inventory.equipment[slot.name];
        dragState.sourceSlot = { type: 'equipment', slot: slot.name };
        dragState.mouseX = cx;
        dragState.mouseY = cy;
        return;
      }
    }
  }
}

function handleInventoryDrop(cx, cy) {
  if (!dragState.active || !dragState.item) { dragState.active = false; return; }

  var gridX = 500, gridY = 60;
  var cellSize = SLOT_SIZE + SLOT_PAD*2;
  var silX = 80+140, silY = 60+230;
  var dropped = false;

  // Check drop on equipment slots
  var eqSlots = [
    { name: 'head', x: silX-25, y: silY-170, w: 50, h: 50 },
    { name: 'chest', x: silX-25, y: silY-105, w: 50, h: 50 },
    { name: 'left_hand', x: silX-90, y: silY-105, w: 50, h: 50 },
    { name: 'right_hand', x: silX+40, y: silY-105, w: 50, h: 50 },
    { name: 'legs', x: silX-25, y: silY-40, w: 50, h: 50 },
    { name: 'feet', x: silX-25, y: silY+20, w: 50, h: 50 }
  ];

  for (var i = 0; i < eqSlots.length; i++) {
    var slot = eqSlots[i];
    if (cx >= slot.x && cx <= slot.x+slot.w && cy >= slot.y && cy <= slot.y+slot.h) {
      // Allow equip if: item.slot matches the slot name, OR item can go in hand slots (keys, torches)
      var canEquip = (dragState.item.slot === slot.name);
      // Keys and consumables can be held in either hand
      if (!canEquip && (slot.name === 'left_hand' || slot.name === 'right_hand')) {
        if (dragState.item.type === 'key' || dragState.item.type === 'consumable' || dragState.item.type === 'scroll') {
          canEquip = true;
        }
      }
      if (canEquip) {
        // Equip the item
        var existing = inventory.equipment[slot.name];
        // Remove from source
        if (dragState.sourceSlot.type === 'backpack') {
          inventory.backpack[dragState.sourceSlot.index] = existing; // swap
        } else if (dragState.sourceSlot.type === 'equipment') {
          inventory.equipment[dragState.sourceSlot.slot] = existing;
        }
        inventory.equipment[slot.name] = dragState.item;
        dropped = true;
        playItemPickup();
      }
      break;
    }
  }

  // Check drop on backpack slots
  if (!dropped) {
    for (var row = 0; row < BACKPACK_ROWS; row++) {
      for (var col = 0; col < BACKPACK_COLS; col++) {
        var idx = row*BACKPACK_COLS+col;
        var sx = gridX + col*cellSize;
        var sy = gridY + 24 + row*cellSize;
        if (cx >= sx && cx <= sx+cellSize && cy >= sy && cy <= sy+cellSize) {
          // Swap or place
          var existing2 = inventory.backpack[idx];
          if (dragState.sourceSlot.type === 'backpack') {
            inventory.backpack[dragState.sourceSlot.index] = existing2;
          } else if (dragState.sourceSlot.type === 'equipment') {
            inventory.equipment[dragState.sourceSlot.slot] = existing2;
          }
          inventory.backpack[idx] = dragState.item;
          dropped = true;
          playItemPickup();
          break;
        }
      }
      if (dropped) break;
    }
  }

  // If not dropped on valid target, return to source (no-op since we haven't removed yet)
  // Actually we need to handle the case where it wasn't dropped - item stays where it was
  if (!dropped) {
    // Item returns to source - nothing to do since we only visually removed it
  }

  dragState.active = false;
  dragState.item = null;
  dragState.sourceSlot = null;
}

function handleInventoryRightClick(cx, cy) {
  var gridX = 500, gridY = 60;
  var cellSize = SLOT_SIZE + SLOT_PAD*2;

  // Check backpack slots for right-click use
  for (var row = 0; row < BACKPACK_ROWS; row++) {
    for (var col = 0; col < BACKPACK_COLS; col++) {
      var idx = row*BACKPACK_COLS+col;
      var sx = gridX + col*cellSize;
      var sy = gridY + 24 + row*cellSize;
      if (cx >= sx && cx <= sx+cellSize && cy >= sy && cy <= sy+cellSize) {
        var item = inventory.backpack[idx];
        if (item && item.type === 'consumable') {
          if (useConsumable(item)) {
            if (item.count > 1) { item.count--; }
            else { inventory.backpack[idx] = null; }
            playItemPickup();
          }
          return;
        }
        // Try equipping on right-click
        if (item && item.slot) {
          var existing = inventory.equipment[item.slot];
          inventory.equipment[item.slot] = item;
          inventory.backpack[idx] = existing;
          playItemPickup();
          showNotification('Equipped '+item.name, '#c8a840');
          return;
        }
      }
    }
  }
}

function handleChestClick(facing) {
  var key = facing.x+','+facing.y;
  if (chestOpened[key]) return;
  chestOpened[key] = true;
  playChestOpen();

  // Give treasure
  if (!player.hasAncientScroll) {
    player.hasAncientScroll = true;
    player.gold += 50;
    player.secretsFound++;
  }

  // Add fire scroll to backpack
  var scroll = createItem('fire_scroll');
  if (scroll) {
    if (addToBackpack(scroll)) {
      showNotification('Chest opened! Found Fire Scroll + 50 gold!', '#c8a840', 180);
    } else {
      showNotification('Chest opened! +50 gold. Pack full - Fire Scroll lost!', '#c85050', 180);
    }
  }
  dungeonMap[facing.y][facing.x] = 0;
}

// ============================================================
// KEYBOARD INPUT
// ============================================================
function handleTavernClick(cx, cy) {
  if (tavern.dialogueActive) {
    var npc = tavernNpcs.find(function(n) { return n.name === tavern.dialogueSpeaker; });
    if (npc) {
      var lines = (tavern._useVeteran && npc.veteranDialogue) ? npc.veteranDialogue : npc.dialogue;
      npc.dialogueIndex++;
      if (npc.dialogueIndex >= lines.length) { npc.dialogueIndex = 0; tavern.dialogueActive = false; }
      else {
        var text = lines[npc.dialogueIndex];
        text = text.replace('{title}', getReputationTitle(loadReputation()));
        tavern.dialogueText = text;
      }
    } else { tavern.dialogueActive = false; }
    return;
  }
  if (tavern.noticeBoard) {
    if (tavern.hoveredDungeon === 0) {
      tavern.noticeBoard = false; state = GameState.JOURNEY;
      journey.timer = 0; journey.ready = false;
      setTimeout(function() { journey.ready = true; }, 1500);
      return;
    }
    if (cx < 150 || cx > W-150 || cy < 60 || cy > H-60) { tavern.noticeBoard = false; return; }
    return;
  }
  if (tavern.hoveredNpc >= 0) {
    var npc = tavernNpcs[tavern.hoveredNpc];
    npc.dialogueIndex = 0; tavern.dialogueActive = true; tavern.dialogueSpeaker = npc.name;
    var npcRep = loadReputation();
    var useVeteran = npcRep.totalRuns >= 3 && npc.veteranDialogue;
    var lines = useVeteran ? npc.veteranDialogue : npc.dialogue;
    var text = lines[0];
    if (useVeteran) text = text.replace('{title}', getReputationTitle(npcRep));
    tavern.dialogueText = text; tavern._useVeteran = useVeteran;
    return;
  }
  if (cx >= 770 && cx <= 890 && cy >= 60 && cy <= 200) {
    tavern.noticeBoard = true; tavern.hoveredDungeon = -1; return;
  }
}

function handleCombatClick(cx, cy) {
  if (!combat.playerTurn || combat.animTimer > 0) return;
  var actions = ['attack', 'fire', 'ice', 'stone', 'flee'];
  for (var i = 0; i < 5; i++) {
    var bx = 15+i*188, by = 540;
    if (cx >= bx && cx <= bx+178 && cy >= by && cy <= by+60) { executeCombatAction(actions[i]); return; }
  }
}

function handlePuzzleClick(cx, cy) {
  var spellNames = ['fire', 'ice', 'stone'];
  for (var i = 0; i < 3; i++) {
    var bx = W/2-270+i*190, by = 170;
    if (cx >= bx && cx <= bx+160 && cy >= by && cy <= by+120) { togglePuzzleSpell(spellNames[i]); return; }
  }
  if (puzzleState.selectedSpells.length === 2) {
    var cbx = W/2-80, cby = 320;
    if (cx >= cbx && cx <= cbx+160 && cy >= cby && cy <= cby+45) { attemptPuzzleCast(); return; }
  }
}

document.addEventListener('keydown', function(e) {
  initAudio();
  keysDown[e.key] = true;

  if (e.key === 'm' || e.key === 'M') { toggleMute(); return; }
  if (state === GameState.TITLE) { enterTavern(); return; }
  if (state === GameState.GAMEOVER || state === GameState.VICTORY) { resetGame(); enterTavern(); return; }

  if (state === GameState.FRAGMENT) {
    if (fragmentDiscover.timer > 120) {
      state = GameState.DUNGEON; startDungeonAmbient();
      showNotification('The Fragment of Dawn pulses with ancient warmth...', '#c8a840', 180);
    }
    return;
  }

  if (state === GameState.JOURNEY) {
    if (e.key === 'Escape') { enterTavern(); return; }
    if (journey.ready && (e.key === 'Enter' || e.key === ' ')) { startDungeon(); return; }
    return;
  }

  if (state === GameState.INVENTORY) {
    if (e.key === 'i' || e.key === 'I' || e.key === 'Escape') {
      state = GameState.DUNGEON;
      dragState.active = false;
    }
    return;
  }

  if (state === GameState.TAVERN) {
    if (tavern.dialogueActive && (e.key === 'Enter' || e.key === ' ')) {
      var npc = tavernNpcs.find(function(n) { return n.name === tavern.dialogueSpeaker; });
      if (npc) {
        var lines = (tavern._useVeteran && npc.veteranDialogue) ? npc.veteranDialogue : npc.dialogue;
        npc.dialogueIndex++;
        if (npc.dialogueIndex >= lines.length) { npc.dialogueIndex = 0; tavern.dialogueActive = false; }
        else {
          var text = lines[npc.dialogueIndex];
          text = text.replace('{title}', getReputationTitle(loadReputation()));
          tavern.dialogueText = text;
        }
      } else { tavern.dialogueActive = false; }
      return;
    }
    if (tavern.noticeBoard && e.key === 'Escape') { tavern.noticeBoard = false; return; }
    return;
  }

  if (state === GameState.DUNGEON) {
    handleDungeonInput(e.key);
    return;
  }

  if (state === GameState.COMBAT) {
    if (e.key === '1') executeCombatAction('attack');
    if (e.key === '2') executeCombatAction('fire');
    if (e.key === '3') executeCombatAction('ice');
    if (e.key === '4') executeCombatAction('stone');
    if (e.key === '5') executeCombatAction('flee');
    return;
  }

  if (state === GameState.PUZZLE) {
    if (e.key === '1') togglePuzzleSpell('fire');
    if (e.key === '2') togglePuzzleSpell('ice');
    if (e.key === '3') togglePuzzleSpell('stone');
    if (e.key === 'Enter' || e.key === ' ') attemptPuzzleCast();
    if (e.key === 'Escape') { state = GameState.DUNGEON; }
    return;
  }
});

document.addEventListener('keyup', function(e) { keysDown[e.key] = false; });

function handleDungeonInput(key) {
  // Close legend on Escape or any movement key
  if (showLegend && key !== 'h' && key !== 'H' && key !== '?') {
    showLegend = false;
    if (key === 'Escape') return;
  }
  if (key === 'ArrowUp' || key === 'w' || key === 'W') { moveForward(); }
  else if (key === 'ArrowDown' || key === 's' || key === 'S') { moveBackward(); }
  else if (key === 'ArrowLeft' || key === 'a' || key === 'A') { player.dir = (player.dir+3)%4; playFootstep(); }
  else if (key === 'ArrowRight' || key === 'd' || key === 'D') { player.dir = (player.dir+1)%4; playFootstep(); }
  else if (key === 'i' || key === 'I') {
    state = GameState.INVENTORY;
  }
  else if (key === 'u' || key === 'U') {
    // Use key on facing door
    handleUseKey();
  }
  else if (key === 'h' || key === 'H' || key === '?') {
    showLegend = !showLegend;
    return;
  }
  else if (key === 'p' || key === 'P') {
    var tile = getTile(player.x, player.y);
    if (tile === 7 || isAdjacentToLockedDoor()) {
      if (doorStates['6,3'] === false) { showNotification('The sealed door is already open.', '#6a6a7a'); }
      else { state = GameState.PUZZLE; puzzleState.selectedSpells = []; puzzleState.message = ''; puzzleState.msgTimer = 0; }
    } else { showNotification('There is nothing to cast upon here.', '#6a6a7a'); }
  }
}

function handleUseKey() {
  var facing = getFacingTile();
  // Regular door - needs iron key
  if (facing.tile === 2 && doorStates['4,2'] === false) {
    if (hasItemInInventory('iron_key')) {
      removeItemById('iron_key');
      doorStates['4,2'] = true;
      playDoorOpen();
      showNotification('Used Iron Key. The door creaks open...', '#c8a840');
    } else {
      showNotification('This door is locked. You need a key.', '#c85050');
    }
    return;
  }
  // Locked door - needs gold key
  if (facing.tile === 3 && doorStates['6,3'] === true) {
    if (hasItemInInventory('gold_key')) {
      removeItemById('gold_key');
      doorStates['6,3'] = false;
      playDoorOpen();
      player.secretsFound++;
      showNotification('Used Gold Key! The sealed door opens!', '#c8a840', 180);
    } else {
      showNotification('A magically sealed door. You need a special key, or try the spell combo.', '#8a5050');
    }
    return;
  }
  // Quick-use first consumable
  for (var i = 0; i < BACKPACK_SIZE; i++) {
    var item = inventory.backpack[i];
    if (item && item.type === 'consumable') {
      if (useConsumable(item)) {
        if (item.count > 1) item.count--;
        else inventory.backpack[i] = null;
        playItemPickup();
      }
      return;
    }
  }
  showNotification('Nothing to use here.', '#6a6a7a');
}

function isAdjacentToLockedDoor() {
  for (var d = 0; d < 4; d++) {
    if (getTile(player.x+DIR_DX[d], player.y+DIR_DY[d]) === 3) return true;
  }
  return false;
}

function moveForward() {
  var nx = player.x + DIR_DX[player.dir];
  var ny = player.y + DIR_DY[player.dir];
  var tile = getTile(nx, ny);

  if (tile === 2 && doorStates['4,2'] === false) {
    if (hasItemInInventory('iron_key')) {
      showNotification('Press [U] to use your Iron Key on this door.', '#c8a840');
    } else {
      showNotification('A locked door. You need a key.', '#8a5050');
    }
    return;
  }
  if (tile === 3 && doorStates['6,3'] === true) {
    if (hasItemInInventory('gold_key')) {
      showNotification('Press [U] to use your Gold Key, or [P] for spell combo.', '#c8a840');
    } else {
      showNotification('A magically sealed door. Look for clues or a special key.', '#8a5050');
    }
    return;
  }
  if (isWall(nx, ny)) { showNotification('A solid wall blocks your path.', '#5a5a6a'); return; }

  player.x = nx; player.y = ny;
  explored[ny][nx] = true;
  playFootstep();
  player.torch = Math.max(0, player.torch - 0.4);

  // Food & water depletion per step
  player.stepCount++;
  player.food = Math.max(0, player.food - 0.3);
  player.water = Math.max(0, player.water - 0.4);

  // Starvation damage
  if (player.food <= 0 && player.stepCount % 3 === 0) {
    player.hp = Math.max(1, player.hp - 1);
    if (player.stepCount % 9 === 0) showNotification('Starving! Eat something!', '#c86030');
  }
  // Dehydration warning
  if (player.water <= 0 && player.stepCount % 12 === 0) {
    showNotification('Dehydrated! Mana will not regenerate!', '#4090c8');
  }

  checkTileEvent();
}

function moveBackward() {
  var backDir = (player.dir+2)%4;
  var nx = player.x+DIR_DX[backDir], ny = player.y+DIR_DY[backDir];
  if (isWall(nx, ny)) return;
  player.x = nx; player.y = ny;
  explored[ny][nx] = true; playFootstep();
  player.torch = Math.max(0, player.torch - 0.4);
  player.stepCount++;
  player.food = Math.max(0, player.food - 0.3);
  player.water = Math.max(0, player.water - 0.4);
}

function checkTileEvent() {
  var key = player.x+','+player.y;
  var tile = getTile(player.x, player.y);
  if (tile === 4 && enemies[key]) { startCombat(enemies[key], key); return; }
  if (tile === 5) {
    // Chest tile - show prompt, don't auto-open
    // Auto-open is handled by click
  }
  if (tile === 6) {
    if (!player.hasHeartOfDungeon) {
      player.hasHeartOfDungeon = true; player.gold += 100;
      playTreasure(); playVictory();
      dungeonMap[player.y][player.x] = 0;
      setTimeout(function() { state = GameState.VICTORY; stopAmbient(); }, 1000);
    }
  }
  if (tile === 9) {
    if (!player.hasFragment) {
      player.hasFragment = true; player.secretsFound++;
      dungeonMap[player.y][player.x] = 0;
      playFragmentFanfare();
      state = GameState.FRAGMENT; fragmentDiscover.timer = 0; fragmentDiscover.glowPulse = 0;
      stopAmbient();
    }
  }
  if (tile === 7) { showNotification('You see markings on the wall...', '#c8a840'); }
  // Hidden alcove loot
  if (hiddenAlcoveOpen && !hiddenAlcoveLooted && player.x === 4 && player.y === 3) {
    hiddenAlcoveLooted = true;
    var bread = createItem('bread', 1);
    var water = createItem('water_flask', 1);
    addToBackpack(bread); addToBackpack(water);
    showNotification('Found hidden supplies! +1 Bread, +1 Water Flask', '#c8a840', 180);
    playTreasure();
  }
}

function startCombat(enemy, pos) {
  state = GameState.COMBAT;
  combat.enemy = {};
  for (var k in enemy) combat.enemy[k] = enemy[k];
  if (enemy.drops) combat.enemy.drops = enemy.drops.slice();
  combat.enemyPos = pos;
  combat.log = [{ text: 'A '+enemy.name+' emerges from the shadows!', color: '#c85050' }];
  combat.playerTurn = true; combat.animTimer = 0; combat.shakeTimer = 0;
  startCombatMusic(); playEnemySound(enemy.type);
}

// ============================================================
// GAME FLOW
// ============================================================
function enterTavern() {
  state = GameState.TAVERN;
  tavern.dialogueActive = false; tavern.noticeBoard = false; tavern.hoveredNpc = -1;
  startTavernMusic();
}

function startDungeon() {
  state = GameState.DUNGEON;
  tavern.noticeBoard = false;
  resetExplored(); resetDoors(); resetEnemies();

  // Reset dungeon map from original
  for (var y = 0; y < 8; y++) {
    for (var x = 0; x < 8; x++) dungeonMap[y][x] = dungeonMapOriginal[y][x];
  }
  // Place fragment
  dungeonMap[6][5] = 9;

  // Reset interactive states
  leverState = { pulled: false };
  pushStoneState = { pushed: false, holdStart: 0, holding: false };
  secretPassageOpen = false;
  hiddenAlcoveOpen = false;
  hiddenAlcoveLooted = false;
  chestOpened = {};
  sconces = {};
  leverDragState = { active: false, startY: 0, currentY: 0 };

  player.x = 1; player.y = 1; player.dir = 2;
  player.torch = 100;
  player.food = 100; player.water = 100;
  player.hasFragment = false;
  player.stepCount = 0;
  explored[1][1] = true;

  // Initialize starting inventory
  initStartingInventory();

  startDungeonAmbient();
  showNotification('You descend into The Whispering Crypts...', '#8a8aaa', 180);
}

function resetGame() {
  player.hp = player.maxHp; player.mana = player.maxMana;
  player.torch = player.maxTorch;
  player.food = player.maxFood; player.water = player.maxWater;
  player.gold = 0; player.xp = 0;
  player.hasAncientScroll = false; player.hasHeartOfDungeon = false;
  player.hasFragment = false;
  player.enemiesSlain = 0; player.secretsFound = 0;
  player.slainTypes = {}; player._runCompleted = false;
  player.stepCount = 0;
  tavernNpcs.forEach(function(n) { n.dialogueIndex = 0; });
  dragState = { active: false, item: null, sourceSlot: null, mouseX: 0, mouseY: 0 };
}

// ============================================================
// INTERACTION PROMPT SYSTEM
// ============================================================
function updateInteractionPrompt() {
  interactionPrompt = '';
  if (state !== GameState.DUNGEON) return;

  var facing = getFacingTile();
  var dist = Math.abs(facing.x - player.x) + Math.abs(facing.y - player.y);
  if (dist !== 1) return;

  switch(facing.tile) {
    case 2:
      if (doorStates['4,2'] === false) {
        if (hasItemInInventory('iron_key')) interactionPrompt = 'Press [U] to use Iron Key, or [I] for inventory';
        else interactionPrompt = 'This door is locked. You need a key.';
      }
      break;
    case 3:
      if (doorStates['6,3'] === true) {
        if (hasItemInInventory('gold_key')) interactionPrompt = 'Press [U] to use Gold Key, or [P] for spell combo';
        else interactionPrompt = 'Sealed door. Find a key or use spell combo [P].';
      }
      break;
    case 10:
      if (!leverState.pulled) interactionPrompt = 'Click and drag lever down to pull';
      else interactionPrompt = 'Lever has been pulled.';
      break;
    case 11:
      if (!pushStoneState.pushed) interactionPrompt = 'Click and hold to push stone (1.5s)';
      else interactionPrompt = 'The stone has been pushed inward.';
      break;
    case 5:
      var key = facing.x+','+facing.y;
      if (!chestOpened[key]) interactionPrompt = 'Click to open chest';
      break;
  }
}

// ============================================================
// HEARTBEAT PROXIMITY
// ============================================================
var heartbeatTimer = 0;
function checkDangerProximity() {
  if (state !== GameState.DUNGEON) return;
  for (var pos in enemies) {
    var parts = pos.split(',');
    var ex = parseInt(parts[0]), ey = parseInt(parts[1]);
    var dist = Math.abs(ex-player.x)+Math.abs(ey-player.y);
    if (dist <= 2) {
      heartbeatTimer++;
      if (heartbeatTimer % (dist === 1 ? 20 : 35) === 0) {
        if (audioCtx) { playNote(55, 0.15, 'sine', 0.06, 0); playNote(55, 0.1, 'sine', 0.04, 0.2); }
      }
      return;
    }
  }
  heartbeatTimer = 0;
}

// ============================================================
// PUSH STONE UPDATE (called in game loop)
// ============================================================
function updatePushStone() {
  if (!pushStoneState.holding || pushStoneState.pushed) return;
  var elapsed = (Date.now() - pushStoneState.holdStart) / 1000;
  if (elapsed >= 1.5) {
    pushStoneState.pushed = true;
    pushStoneState.holding = false;
    hiddenAlcoveOpen = true;
    // Change tile to open
    if (dungeonMap[3][4] === 11) dungeonMap[3][4] = 0;
    playStoneGrind();
    showNotification('The stone grinds inward revealing a hidden alcove!', '#c8a840', 180);
  }
}

// ============================================================
// PUSH STONE PROGRESS BAR (drawn in dungeon view)
// ============================================================
function drawPushStoneProgress() {
  if (!pushStoneState.holding || pushStoneState.pushed) return;
  var elapsed = (Date.now() - pushStoneState.holdStart) / 1000;
  var pct = Math.min(1, elapsed / 1.5);
  var viewX = 10, viewY = 10, viewW = 640;
  var barX = viewX + viewW/2 - 80, barY = viewY + 20;
  drawPixelRect(barX, barY, 160, 20, '#0a0a14');
  drawPixelRect(barX, barY, 160*pct, 20, '#c88020');
  drawPixelBorder(barX, barY, 160, 20, '#c8a840', 2);
  drawPixelText('PUSHING...', barX+80, barY+3, '#fff', 14, 'center');
}

// ============================================================
// LEVER DRAG VISUAL (drawn in dungeon view)
// ============================================================
function drawLeverDragProgress() {
  if (!leverDragState.active) return;
  var dragDist = leverDragState.currentY - leverDragState.startY;
  var pct = Math.min(1, Math.max(0, dragDist / 60));
  var viewX = 10, viewY = 10, viewW = 640;
  var barX = viewX + viewW/2 - 60, barY = viewY + 20;
  drawPixelRect(barX, barY, 120, 20, '#0a0a14');
  drawPixelRect(barX, barY, 120*pct, 20, pct >= 1 ? '#40c840' : '#c88020');
  drawPixelBorder(barX, barY, 120, 20, '#c8a840', 2);
  drawPixelText(pct >= 1 ? 'RELEASE!' : 'PULL DOWN...', barX+60, barY+3, '#fff', 12, 'center');
}

// ============================================================
// KEYBOARD LEGEND OVERLAY
// ============================================================
function drawKeyboardLegend() {
  if (!showLegend) return;
  // Darken background
  ctx.fillStyle = 'rgba(0,0,0,0.85)';
  ctx.fillRect(0, 0, W, H);

  var lx = 80, ly = 30, colW = 400;

  drawPixelText('KEYBOARD CONTROLS', W/2, ly, '#c8a840', 22, 'center');
  drawPixelText('Press [H] or [?] to close', W/2, ly+26, '#6a6a7a', 12, 'center');

  var y = ly + 60;
  var lineH = 22;

  // Column 1 — Movement & Dungeon
  drawPixelText('-- DUNGEON --', lx+100, y, '#c8a840', 14, 'center');
  y += lineH + 4;
  var dungeonKeys = [
    ['W / Arrow Up', 'Move forward'],
    ['S / Arrow Down', 'Move backward'],
    ['A / Arrow Left', 'Turn left'],
    ['D / Arrow Right', 'Turn right'],
    ['U', 'Use key on door / Use item'],
    ['P', 'Cast spell combo (near sealed door)'],
    ['I', 'Open inventory'],
    ['H / ?', 'Toggle this legend'],
    ['M', 'Toggle sound on/off']
  ];
  for (var i = 0; i < dungeonKeys.length; i++) {
    drawPixelText('['+dungeonKeys[i][0]+']', lx, y, '#e0d090', 12, 'left');
    drawPixelText(dungeonKeys[i][1], lx+160, y, '#aaaacc', 12, 'left');
    y += lineH;
  }

  y += 10;
  drawPixelText('-- MOUSE (DUNGEON) --', lx+100, y, '#c8a840', 14, 'center');
  y += lineH + 4;
  var mouseKeys = [
    ['Click door', 'Use key on facing door'],
    ['Click+drag lever', 'Pull lever down'],
    ['Click+hold stone', 'Push stone (hold 1.5s)'],
    ['Click chest', 'Open chest']
  ];
  for (var i = 0; i < mouseKeys.length; i++) {
    drawPixelText(mouseKeys[i][0], lx, y, '#e0d090', 12, 'left');
    drawPixelText(mouseKeys[i][1], lx+160, y, '#aaaacc', 12, 'left');
    y += lineH;
  }

  // Column 2 — Combat, Puzzle, Inventory, Tavern
  var y2 = ly + 60;
  var rx = lx + colW + 40;

  drawPixelText('-- COMBAT --', rx+100, y2, '#c85050', 14, 'center');
  y2 += lineH + 4;
  var combatKeys = [
    ['1', 'Melee attack'],
    ['2', 'Fire spell'],
    ['3', 'Ice spell'],
    ['4', 'Stone spell'],
    ['5', 'Flee']
  ];
  for (var i = 0; i < combatKeys.length; i++) {
    drawPixelText('['+combatKeys[i][0]+']', rx, y2, '#e0d090', 12, 'left');
    drawPixelText(combatKeys[i][1], rx+160, y2, '#aaaacc', 12, 'left');
    y2 += lineH;
  }

  y2 += 10;
  drawPixelText('-- SPELL PUZZLE --', rx+100, y2, '#5090c8', 14, 'center');
  y2 += lineH + 4;
  var puzzleKeys = [
    ['1 / 2 / 3', 'Toggle Fire / Ice / Stone'],
    ['Enter / Space', 'Cast selected combo'],
    ['Escape', 'Back to dungeon']
  ];
  for (var i = 0; i < puzzleKeys.length; i++) {
    drawPixelText('['+puzzleKeys[i][0]+']', rx, y2, '#e0d090', 12, 'left');
    drawPixelText(puzzleKeys[i][1], rx+160, y2, '#aaaacc', 12, 'left');
    y2 += lineH;
  }

  y2 += 10;
  drawPixelText('-- INVENTORY --', rx+100, y2, '#50c850', 14, 'center');
  y2 += lineH + 4;
  var invKeys = [
    ['Left-drag', 'Move items between slots'],
    ['Right-click', 'Use consumable item'],
    ['I / Escape', 'Close inventory']
  ];
  for (var i = 0; i < invKeys.length; i++) {
    drawPixelText(invKeys[i][0], rx, y2, '#e0d090', 12, 'left');
    drawPixelText(invKeys[i][1], rx+160, y2, '#aaaacc', 12, 'left');
    y2 += lineH;
  }

  y2 += 10;
  drawPixelText('-- TAVERN --', rx+100, y2, '#c8a840', 14, 'center');
  y2 += lineH + 4;
  var tavernKeys = [
    ['Click NPC', 'Talk to character'],
    ['Enter / Space', 'Advance dialogue'],
    ['Click Notice Board', 'Choose dungeon'],
    ['Escape', 'Close notice board']
  ];
  for (var i = 0; i < tavernKeys.length; i++) {
    drawPixelText(tavernKeys[i][0], rx, y2, '#e0d090', 12, 'left');
    drawPixelText(tavernKeys[i][1], rx+160, y2, '#aaaacc', 12, 'left');
    y2 += lineH;
  }

  // Border around the whole thing
  drawPixelBorder(40, 15, W-80, H-30, '#c8a840', 2);
}

// ============================================================
// MAIN GAME LOOP
// ============================================================
function gameLoop(timestamp) {
  var dt = timestamp - lastTime;
  lastTime = timestamp;
  frameCount++;

  if (state === GameState.DUNGEON) {
    player.torch = Math.max(0, player.torch - 0.003);
    checkDangerProximity();
    updateInteractionPrompt();
    updatePushStone();
  }

  if (combat.animTimer > 0) combat.animTimer--;

  switch (state) {
    case GameState.TITLE: drawTitleScreen(); break;
    case GameState.TAVERN: drawTavern(); break;
    case GameState.DUNGEON:
      drawDungeon();
      drawPushStoneProgress();
      drawLeverDragProgress();
      drawKeyboardLegend();
      break;
    case GameState.COMBAT: drawCombat(); break;
    case GameState.PUZZLE: drawPuzzleScreen(); break;
    case GameState.GAMEOVER: drawGameOver(); break;
    case GameState.VICTORY: drawVictoryScreen(); break;
    case GameState.FRAGMENT: drawFragmentScreen(); break;
    case GameState.JOURNEY: drawJourneyScreen(); break;
    case GameState.INVENTORY: drawInventoryScreen(); break;
  }

  requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);
</script>
