    // Show list of living party members to heal
    if (member.mana < 5) { this.addLog(`${member.name}: Not enough mana.`); return; }
    if (this.healOverlay) this.healOverlay.forEach(e => e.destroy());
    this.healOverlay = [];
    const bg = this.add.graphics().setDepth(600);
    bg.fillStyle(0x111122, 0.95); bg.fillRect(200, 200, 200, 160);
    bg.lineStyle(1, 0x44cc44); bg.strokeRect(200, 200, 200, 160);
    this.healOverlay.push(bg);
    const title = this.add.text(300, 215, 'HEAL WHO?', {fontSize:'13px',fontFamily:'monospace',color:'#44cc44'}).setOrigin(0.5).setDepth(601);
    this.healOverlay.push(title);

    const targets = PARTY.filter(m => m.alive && m.hp < m.maxHp);
    targets.forEach((target, i) => {
      const y = 235 + i * 28;
      const txt = this.add.text(300, y + 10, `${target.name} (${target.hp}/${target.maxHp})`, {fontSize:'11px',fontFamily:'monospace',color:'#ccbbaa'}).setOrigin(0.5).setDepth(601).setInteractive();
      txt.on('pointerdown', () => {
        this.healOverlay.forEach(e => e.destroy());
        this.healOverlay = [];
        this.waitingForInput = false;
        member.mana -= 5;
        let heal = mod(member.wis);
        for (let i = 0; i < 2; i++) heal += rollDice(8);
        target.hp = Math.min(target.maxHp, target.hp + heal);
        this.addLog(`${member.name} heals ${target.name}: +${heal} HP`);
        AudioSys.healSound();
        this.drawPartyFormation();
        this.advanceTurn();
      });
      this.healOverlay.push(txt);
    });
    if (targets.length === 0) {
      const nt = this.add.text(300, 270, 'No one needs healing.', {fontSize:'11px',fontFamily:'monospace',color:'#666655'}).setOrigin(0.5).setDepth(601);
      this.healOverlay.push(nt);
    }
    const close = this.add.text(300, 345, '[Cancel]', {fontSize:'10px',fontFamily:'monospace',color:'#666655'}).setOrigin(0.5).setDepth(601).setInteractive();
    close.on('pointerdown', () => { this.healOverlay.forEach(e => e.destroy()); this.healOverlay = []; });
    this.healOverlay.push(close);
  }

  openReviveMenu(member) {
    // Revive a KO'd ally (10 mana)
    if (member.mana < 10) { this.addLog(`${member.name}: Need 10 mana to Revive.`); return; }
    const dead = PARTY.filter(m => !m.alive);
    if (dead.length === 0) { this.addLog('No one to revive.'); return; }

    if (this.reviveOverlay) this.reviveOverlay.forEach(e => e.destroy());
    this.reviveOverlay = [];
    const bg = this.add.graphics().setDepth(600);
    bg.fillStyle(0x111122, 0.95); bg.fillRect(200, 200, 200, 140);
    bg.lineStyle(1, 0xddaa44); bg.strokeRect(200, 200, 200, 140);
    this.reviveOverlay.push(bg);
    const title = this.add.text(300, 215, 'REVIVE WHO?', {fontSize:'13px',fontFamily:'monospace',color:'#ddaa44'}).setOrigin(0.5).setDepth(601);
    this.reviveOverlay.push(title);

    dead.forEach((target, i) => {
      const y = 235 + i * 28;
      const txt = this.add.text(300, y + 10, target.name + ' (K.O.)', {fontSize:'11px',fontFamily:'monospace',color:'#cc6644'}).setOrigin(0.5).setDepth(601).setInteractive();
      txt.on('pointerdown', () => {
        this.reviveOverlay.forEach(e => e.destroy());
        this.reviveOverlay = [];
        this.waitingForInput = false;
        member.mana -= 10;
        target.alive = true;
        target.hp = Math.floor(target.maxHp * 0.25);
        this.addLog(`${member.name} revives ${target.name}! (${target.hp} HP)`);
        AudioSys.healSound();
        // Add revived member back to turn order
        this.turnOrder.push({ type: 'party', member: target, init: 0 });
        this.drawPartyFormation();
        this.advanceTurn();
      });
      this.reviveOverlay.push(txt);
    });
    const close = this.add.text(300, 325, '[Cancel]', {fontSize:'10px',fontFamily:'monospace',color:'#666655'}).setOrigin(0.5).setDepth(601).setInteractive();
    close.on('pointerdown', () => { this.reviveOverlay.forEach(e => e.destroy()); this.reviveOverlay = []; });
    this.reviveOverlay.push(close);
  }

  openSwapMenu(member) {
    // Swap positions with another living member
    const others = livingMembers().filter(m => m !== member);
    if (others.length === 0) { this.addLog('No one to swap with.'); return; }

    if (this.swapOverlay) this.swapOverlay.forEach(e => e.destroy());
    this.swapOverlay = [];
    const bg = this.add.graphics().setDepth(600);
    bg.fillStyle(0x111122, 0.95); bg.fillRect(200, 200, 200, 140);
    bg.lineStyle(1, 0xffaa44); bg.strokeRect(200, 200, 200, 140);
    this.swapOverlay.push(bg);
    const title = this.add.text(300, 215, 'SWAP WITH?', {fontSize:'13px',fontFamily:'monospace',color:'#ffaa44'}).setOrigin(0.5).setDepth(601);
    this.swapOverlay.push(title);
    const posNames = ['Front-L','Front-R','Back-L','Back-R'];

    others.forEach((target, i) => {
      const y = 235 + i * 28;
      const txt = this.add.text(300, y + 10, `${target.name} (${posNames[target.position]})`, {fontSize:'11px',fontFamily:'monospace',color:'#ccbbaa'}).setOrigin(0.5).setDepth(601).setInteractive();
      txt.on('pointerdown', () => {
        this.swapOverlay.forEach(e => e.destroy());
        this.swapOverlay = [];
        this.waitingForInput = false;
        const fromPos = posNames[member.position];
        const toPos = posNames[target.position];
        swapPositions(member, target);
        this.addLog(`${member.name} swaps with ${target.name} (${fromPos} <-> ${toPos})`);
        this.drawPartyFormation();
        this.advanceTurn();
      });
      this.swapOverlay.push(txt);
    });
    const close = this.add.text(300, 325, '[Cancel]', {fontSize:'10px',fontFamily:'monospace',color:'#666655'}).setOrigin(0.5).setDepth(601).setInteractive();
    close.on('pointerdown', () => { this.swapOverlay.forEach(e => e.destroy()); this.swapOverlay = []; });
    this.swapOverlay.push(close);
  }

  doMemberDefend(member) {
    this.waitingForInput = false;
    member.defending = true;
    this.addLog(`${member.name} defends. AC+2 this round.`);
    this.drawPartyFormation();
    this.advanceTurn();
  }

  doPartyFlee(member) {
    if (this.isBoss) { this.addLog('No fleeing from the Vault Warden!'); return; }
    this.waitingForInput = false;
    const roll = rollDice(20) + mod(member.dex);
    const dc = 10 + mod(this.enemy.dex || 12);
    if (roll >= dc) {
      this.addLog(`${member.name} leads the party to safety!`);
      this.combatOver = true;
      this.clearButtons();
      this.time.delayedCall(1000, () => this.scene.start('Dungeon'));
    } else {
      this.addLog(`${member.name} fails to flee! (${roll} vs DC${dc})`);
      this.advanceTurn();
    }
  }

  // ---- ITEM MENU (Potions + Throwables) ----

  openItemMenu(member) {
    const usable = [];
    member.inventory.forEach((item, idx) => {
      if (item && (item.type === 'potion' || item.type === 'throwable')) {
        usable.push({ item, idx });
      }
    });
    if (usable.length === 0) { this.addLog(`${member.name} has no usable items.`); return; }

    if (this.itemOverlay) this.itemOverlay.forEach(e => e.destroy());
    this.itemOverlay = [];
    const bg = this.add.graphics().setDepth(600);
    const menuH = Math.min(200, 50 + usable.length * 28);
    bg.fillStyle(0x111122, 0.95); bg.fillRect(180, 180, 240, menuH);
    bg.lineStyle(1, 0xffaa44); bg.strokeRect(180, 180, 240, menuH);
    this.itemOverlay.push(bg);
    const title = this.add.text(300, 195, 'USE ITEM', {fontSize:'13px',fontFamily:'monospace',color:'#ffaa44'}).setOrigin(0.5).setDepth(601);
    this.itemOverlay.push(title);

    usable.forEach((entry, i) => {
      const y = 215 + i * 26;
      const item = entry.item;
      const label = item.type === 'throwable' ? `${item.name} [Throw]` : `${item.name}`;
      const col = item.type === 'throwable' ? '#cc8844' : '#44cc88';
      const txt = this.add.text(300, y, label, {fontSize:'10px',fontFamily:'monospace',color:col}).setOrigin(0.5).setDepth(601).setInteractive();
      txt.on('pointerdown', () => {
        this.itemOverlay.forEach(e => e.destroy());
        this.itemOverlay = [];
        if (item.type === 'potion') {
          this.doUsePotion(member, entry.idx);
        } else if (item.type === 'throwable') {
          this.doThrowItem(member, entry.idx);
        }
      });
      this.itemOverlay.push(txt);
    });
    const closeY = 215 + usable.length * 26 + 5;
    const close = this.add.text(300, closeY, '[Cancel]', {fontSize:'10px',fontFamily:'monospace',color:'#666655'}).setOrigin(0.5).setDepth(601).setInteractive();
    close.on('pointerdown', () => { this.itemOverlay.forEach(e => e.destroy()); this.itemOverlay = []; });
    this.itemOverlay.push(close);
  }

  doUsePotion(member, itemIdx) {
    const item = member.inventory[itemIdx];
    if (!item) return;
    this.waitingForInput = false;

    if (item.subtype === 'health' || !item.subtype) {
      const heal = item.healAmount || (rollDice(4) + rollDice(4) + 2);
      member.hp = Math.min(member.maxHp, member.hp + heal);
      this.addLog(`${member.name} drinks ${item.name}: +${heal} HP`);
      AudioSys.healSound();
    } else if (item.subtype === 'mana') {
      const restore = rollDice(6) + 3;
      member.mana = Math.min(member.maxMana, member.mana + restore);
      this.addLog(`${member.name} drinks ${item.name}: +${restore} MP`);
      AudioSys.healSound();
    } else if (item.subtype === 'resist') {
      member.resistTurns = item.resistTurns || 3;
      this.addLog(`${member.name} drinks ${item.name}: resistance for ${member.resistTurns} turns!`);
    } else if (item.subtype === 'strength') {
      member.str += item.strBonus || 4;
      member.attackMod += Math.floor((item.strBonus || 4) / 2);
      this.addLog(`${member.name} drinks ${item.name}: +${item.strBonus||4} STR!`);
    } else if (item.subtype === 'sight') {
      this.addLog(`${member.name} drinks ${item.name}: True Sight!`);
    } else {
      const heal = item.healAmount || (rollDice(4) + 2);
      member.hp = Math.min(member.maxHp, member.hp + heal);
      this.addLog(`${member.name} drinks ${item.name}: +${heal} HP`);
      AudioSys.healSound();
    }

    // Remove potion from inventory
    member.inventory.splice(itemIdx, 1);
    for (const slot of Object.keys(member.equipped)) {
      if (member.equipped[slot] > itemIdx) member.equipped[slot]--;
      else if (member.equipped[slot] === itemIdx) member.equipped[slot] = -1;
    }
    PLAYER.potions = Math.max(0, PLAYER.potions - 1);

    this.drawPartyFormation();
    this.advanceTurn();
  }

  doThrowItem(member, itemIdx) {
    const item = member.inventory[itemIdx];
    if (!item) return;
    this.waitingForInput = false;

    const throwDice = item.throwDice || 4;
    const throwStat = item.throwStat || 'dex';
    const roll = rollDice(20);
    const atkMod = mod(member[throwStat] || member.dex);
    const total = roll + atkMod;

    if (roll === 1) {
      this.addLog(`${member.name} throws ${item.name}: FUMBLE!`);
    } else if (roll === 20 || total >= this.enemy.ac) {
      let dmg = rollDice(throwDice) + atkMod;
      if (roll === 20) dmg += rollDice(throwDice);

      // Special throwable effects
      if (item.holyDice && item.holyRolls) {
        for (let i = 0; i < item.holyRolls; i++) dmg += rollDice(item.holyDice);
        this.addLog(`Holy water sears the creature!`);
        this.screenFlash(0xffffcc, 0.3);
      }
      if (item.fireDamage) {
        this.enemyOnFire = 3;
        this.addLog(`${this.enemy.name} is on fire!`);
        this.screenFlash(0xff4400, 0.3);
      }

      this.applyDamageToEnemy(dmg);
      this.addLog(`${member.name} throws ${item.name}: HIT ${dmg}dmg!`);
      this.drawEnemy();
      if (this.enemySprite) this.tweens.add({ targets: this.enemySprite, x:{from:290,to:310}, duration:50, yoyo:true, repeat:2 });
    } else {
      this.addLog(`${member.name} throws ${item.name}: MISS (${total} vs AC${this.enemy.ac})`);
    }

    // Track thrown item for recovery
    this.thrownItems.push({...item});

    // Remove from inventory
    member.inventory.splice(itemIdx, 1);
    for (const slot of Object.keys(member.equipped)) {
      if (member.equipped[slot] > itemIdx) member.equipped[slot]--;
      else if (member.equipped[slot] === itemIdx) member.equipped[slot] = -1;
    }

    this.drawPartyFormation();
    if (!this.checkEnemyDead()) this.advanceTurn();
  }

  // ---- ENVIRONMENTAL COMBAT ACTIONS ----

  doEnvAction(member, envType) {
    this.waitingForInput = false;
    const roll = rollDice(20) + mod(member.str);

    if (envType === 'portcullis') {
      const dc = 12;
      if (roll >= dc) {
        const dmg = rollDice(8) + rollDice(8) + 4;
        this.applyDamageToEnemy(dmg);
        this.addLog(`${member.name} drops the portcullis! ${dmg}dmg!`);
        this.screenFlash(0xffaa44, 0.3);
        this.drawEnemy();
        // Can only use once
        this.envOptions = this.envOptions.filter(e => e !== 'portcullis');
      } else {
        this.addLog(`${member.name} strains at the portcullis... can't trigger it! (${roll} vs DC${dc})`);
      }
    } else if (envType === 'ceiling_collapse') {
      const dc = 14;
      if (roll >= dc) {
        const dmg = rollDice(6) + rollDice(6) + rollDice(6);
        this.applyDamageToEnemy(dmg);
        this.addLog(`${member.name} brings the ceiling down! ${dmg}dmg!`);
        this.screenFlash(0x886644, 0.4);
        this.drawEnemy();
        this.envOptions = this.envOptions.filter(e => e !== 'ceiling_collapse');
        // Risky — party takes splash damage
        const splash = rollDice(4);
        livingMembers().forEach(m => {
          m.hp = Math.max(1, m.hp - splash);
        });
        this.addLog(`Debris hits the party! ${splash}dmg each!`);
      } else {
        this.addLog(`${member.name} tries to collapse the ceiling... fails! (${roll} vs DC${dc})`);
      }
    } else if (envType === 'push_into_pit') {
      const dc = 13;
      if (roll >= dc) {
        const dmg = rollDice(10) + rollDice(10);
        this.applyDamageToEnemy(dmg);
        this.addLog(`${member.name} shoves ${this.enemy.name} into the pit! ${dmg}dmg!`);
        this.screenFlash(0x111111, 0.5);
        this.drawEnemy();
        this.envOptions = this.envOptions.filter(e => e !== 'push_into_pit');
      } else {
        this.addLog(`${member.name} tries to push ${this.enemy.name}... resisted! (${roll} vs DC${dc})`);
      }
    }

    this.drawPartyFormation();
    if (!this.checkEnemyDead()) this.advanceTurn();
  }

  // ---- ENEMY TURN ----

  enemyTurn() {
    if (this.combatOver) return;
    this.time.delayedCall(600, () => {
      // Burn damage
      if (this.enemyOnFire > 0) {
        const burnDmg = rollDice(2);
        this.applyDamageToEnemy(burnDmg);
        this.addLog(`${this.enemy.name} burns: ${burnDmg} fire dmg!`);
        this.enemyOnFire--;
        if (this.checkEnemyDead()) return;
      }

      // Target selection based on formation
      let target = null;
      const front = frontRow();
      const back = backRow();
      const isRangedEnemy = this.enemyType.includes('shaman') || this.enemyType.includes('wraith');
      const isBossEnemy = this.isBoss;

      if (isBossEnemy) {
        // Boss: target lowest HP living member
        const alive = livingMembers();
        target = alive.reduce((low, m) => (!low || m.hp < low.hp) ? m : low, null);
      } else if (isRangedEnemy && back.length > 0 && Math.random() < 0.3) {
        // Ranged enemy: 30% chance to target back row
        target = back[Math.floor(Math.random() * back.length)];
      } else if (front.length > 0) {
        // Melee: must target front row
        // Weight toward position 0 (gets targeted more)
        if (front.length > 1 && Math.random() < 0.6) {
          target = front[0]; // Position 0 gets targeted more
        } else {
          target = front[Math.floor(Math.random() * front.length)];
        }
      } else if (back.length > 0) {
        // Front row all dead, hit back row
        target = back[Math.floor(Math.random() * back.length)];
      }

      if (!target) { this.advanceTurn(); return; }

      const roll = rollDice(20);
      const total = roll + this.enemy.attackMod;
      const targetAC = target.ac + (target.defending ? 2 : 0);

      if (roll === 1) {
        this.addLog(`${this.enemy.name} fumbles!`);
      } else if (roll === 20 || total >= targetAC) {
        let dmg = rollDice(this.enemy.damageDice) + this.enemy.damageBonus;
        if (roll === 20) { dmg += rollDice(this.enemy.damageDice); this.addLog(`${this.enemy.name} CRITS ${target.name}!`); }
        target.hp = Math.max(0, target.hp - dmg);
        this.addLog(`${this.enemy.name} -> ${target.name}: ${dmg}dmg (${target.hp}HP left)`);
        this.screenFlash(0xff0000, 0.15);

        if (target.hp <= 0) {
          target.alive = false;
          this.addLog(`${target.name} falls!`);
          this.screenFlash(0xff0000, 0.3);

          // Check TPK
          if (partyAllDead()) {
            this.handlePartyWipe();
            return;
          }
        }
      } else {
        this.addLog(`${this.enemy.name} -> ${target.name}: MISS (${total} vs AC${targetAC})`);
      }

      this.drawEnemy();
      this.drawPartyFormation();
      this.advanceTurn();
    });
  }

  handlePartyWipe() {
    this.addLog('The party has fallen...');
    this.combatOver = true;
    this.screenFlash(0xff0000, 0.5);

    if (window.DX_SAVE) DX_SAVE.recordDeath(PARTY[0].name, PARTY[0].classId, GAME.floor, GAME.dungeonId);
    if (window.DX_AUDIO) DX_AUDIO.setLayer('silence');

    this.time.delayedCall(2000, () => {
      PARTY.forEach(m => { m.hp = m.maxHp; m.mana = m.maxMana; m.alive = true; });
      PLAYER.food = 100; PLAYER.water = 100;
      syncPlayerFromParty();
      this.scene.start('Boot');
    });
  }

  checkEnemyDead() {
    if (this.enemy.hp <= 0) {
      this.addLog(`${this.enemy.name} defeated!`);
      if (this.encounterX !== undefined) markEncounterDefeated(this.encounterX, this.encounterY);

      if (window.DX_SAVE) DX_SAVE.recordKill(this.enemyType);
      if (window.DX_AUDIO) DX_AUDIO.playSFX('enemy_death');

      if (this.enemySprite) {
        if (this.enemyTween) this.enemyTween.destroy();
        this.tweens.add({ targets: this.enemySprite, alpha:0, scaleX:0, scaleY:0, duration:800, ease:'Power2' });
      }

      // XP split among living members (Wizardry rule)
      const alive = livingMembers();
      const xpEach = Math.floor(this.enemy.xp / Math.max(1, alive.length));
      alive.forEach(m => { m.xp += xpEach; });
      this.addLog(`+${xpEach} XP each (${alive.length} alive)`);

      // Loot — goes to first living member
      const lootItems = rollLoot(this.enemyType);
      const lootTarget = alive[0];
      lootItems.forEach(item => { applyLoot(item, lootTarget); this.addLog(`Found: ${item.name}`); });

      // Recover thrown items
      this.thrownItems.forEach(item => {
        if (Math.random() < 0.5) {
          applyLoot(item, lootTarget);
          this.addLog(`Recovered: ${item.name}`);
        }
      });

      if (this.enemyType === 'vault_warden') {
        GAME.vaultWardenDefeated = true;
        this.time.delayedCall(1500, () => this.addLog(resolveNarrative(NARRATIVE.afterVaultWarden)));
        this.time.delayedCall(4000, () => { PLAYER.fragmentOfDawn = true; this.addLog(resolveNarrative(NARRATIVE.getFragment)); });
      }

      // Check level ups for all living members
      let anyLevelUp = false;
      alive.forEach(m => {
        if (memberCheckLevelUp(m)) {
          anyLevelUp = true;
          this.addLog(`${m.name} LEVEL UP! Lv${m.level}`);
        }
      });
      syncPlayerFromParty();

      this.combatOver = true;
      this.clearButtons();
      const returnDelay = this.enemyType === 'vault_warden' ? 7000 : 2000;
      this.time.delayedCall(returnDelay, () => {
        if (anyLevelUp) this.scene.start('Dungeon', { narrative: 'LEVEL UP!' });
        else this.scene.start('Dungeon');
      });
      return true;
    }
    return false;
  }

  screenFlash(color, alpha) {
    this.flashGfx.clear(); this.flashGfx.setDepth(999);
    this.flashGfx.fillStyle(color, alpha); this.flashGfx.fillRect(0,0,800,600);
    this.time.delayedCall(150, ()=>this.flashGfx.clear());
  }
}

// ============================================================
// INVENTORY SCENE -- Per-Character Tabs with Drag-and-Drop
// ============================================================
class InventoryScene extends Phaser.Scene {
  constructor() { super('Inventory'); }

  create() {
    this.add.graphics().fillStyle(0x000000,0.7).fillRect(0,0,800,600);

    this.g = this.add.graphics();
    this.dragSprite = null;
    this.dragItem = null;
    this.dragOrigIdx = -1;
    this.floatingTexts = [];
    this.dropZoneGfx = this.add.graphics().setDepth(300);
    this.glowTimer = null;
    this.activeTab = 0; // Index into PARTY
    this.tabElements = [];

    this.add.text(400,20,'INVENTORY',{fontSize:'20px',fontFamily:'monospace',color:'#ff8800',fontStyle:'bold'}).setOrigin(0.5);

    // Character tabs across top
    this.drawTabs();

    // Draw inventory content for active member
    this.itemSprites = [];
    this.statLabels = [];
    this.drawMemberInventory();

    // Keyhole drop zone
    this.keyholeZone = null;
    this.keyholeGfx = null;
    const map = GAME.currentMap;
    if (map) {
      const fx = PLAYER.x + DX[PLAYER.dir];
      const fy = PLAYER.y + DY[PLAYER.dir];
      if (fx>=0 && fx<GAME.mapWidth && fy>=0 && fy<GAME.mapHeight && map[fy][fx] === 3) {
        this.keyholeZone = {x:130, y:460, w:50, h:50, tileX:fx, tileY:fy};
        this.keyholeGfx = this.add.graphics().setDepth(10);
        this.keyholeGfx.fillStyle(0x222211); this.keyholeGfx.fillRect(130, 460, 50, 50);
        this.keyholeGfx.lineStyle(2, 0x888866); this.keyholeGfx.strokeRect(130, 460, 50, 50);
        this.keyholeGfx.fillStyle(0x111111); this.keyholeGfx.fillCircle(155, 478, 8);
        this.keyholeGfx.fillRect(152, 478, 6, 14);
        this.add.text(155, 500, 'KEYHOLE', {fontSize:'8px',fontFamily:'monospace',color:'#888866'}).setOrigin(0.5).setDepth(11);
      }
    }

    // Sconce drop zone
    this.sconceZone = null;
    this.sconceGfx = null;
    if (map) {
      const fx = PLAYER.x + DX[PLAYER.dir];
      const fy = PLAYER.y + DY[PLAYER.dir];
      if (fx>=0 && fx<GAME.mapWidth && fy>=0 && fy<GAME.mapHeight && map[fy][fx] === 9) {
        const sconceKey = GAME.dungeonId+'-'+GAME.floor+'-'+fx+'-'+fy;
        if (!GAME.litSconces[sconceKey]) {
          this.sconceZone = {x:60, y:460, w:50, h:50, tileX:fx, tileY:fy, sconceKey:sconceKey};
          this.sconceGfx = this.add.graphics().setDepth(10);
          this.sconceGfx.fillStyle(0x1a1a11); this.sconceGfx.fillRect(60, 460, 50, 50);
          this.sconceGfx.lineStyle(2, 0x555544); this.sconceGfx.strokeRect(60, 460, 50, 50);
          this.sconceGfx.fillStyle(0x555555); this.sconceGfx.fillRect(78, 478, 14, 4);
          this.add.text(85, 500, 'SCONCE', {fontSize:'8px',fontFamily:'monospace',color:'#888866'}).setOrigin(0.5).setDepth(11);
        }
      }
    }

    this.add.text(400,568,'I/ESC: Close | Drag items | Click tabs to switch character',{fontSize:'11px',fontFamily:'monospace',color:'#555544'}).setOrigin(0.5);

    this.input.keyboard.on('keydown-I', () => { this.closeInventory(); });
    this.input.keyboard.on('keydown-ESC', () => { this.closeInventory(); });

    this.input.on('pointerdown', (ptr) => this.onPointerDown(ptr));
    this.input.on('pointermove', (ptr) => this.onPointerMove(ptr));
    this.input.on('pointerup', (ptr) => this.onPointerUp(ptr));

    this.longPressTimer = null;
    this.tooltipText = null;

    this.glowPhase = 0;
    this.glowTimer = this.time.addEvent({
      delay: 50, loop: true, callback: () => {
        this.glowPhase += 0.1;
        this.updateDropZoneGlow();
      }
    });
  }

  getActiveMember() {
    return PARTY[this.activeTab] || PARTY[0];
  }

  drawTabs() {
    if (this.tabElements) this.tabElements.forEach(e => e.destroy());
    this.tabElements = [];
    const tabW = 180, tabH = 26;
    PARTY.forEach((member, i) => {
      const tx = 40 + i * (tabW + 5);
      const ty = 38;
      const isActive = i === this.activeTab;
      const classHex = CLASS_COLORS[member.class] || 0x333333;
      const classColorStr = {Fighter:'#cc4444',Ranger:'#44cc44',Mage:'#4488ff',Cleric:'#ddaa44'}[member.class] || '#999';

      const tg = this.add.graphics();
      tg.fillStyle(classHex, isActive ? 0.6 : 0.2);
      tg.fillRect(tx, ty, tabW, tabH);
      tg.lineStyle(isActive ? 2 : 1, isActive ? 0xffdd44 : classHex);
      tg.strokeRect(tx, ty, tabW, tabH);
      this.tabElements.push(tg);

      const letter = CLASS_LETTERS[member.class] || '?';
      const label = `${letter} ${member.name.substring(0,8)}`;
      const tt = this.add.text(tx + tabW/2, ty + tabH/2, label, {
        fontSize:'11px',fontFamily:'monospace',
        color: isActive ? '#ffffff' : classColorStr,
        fontStyle: isActive ? 'bold' : ''
      }).setOrigin(0.5);
      this.tabElements.push(tt);

      if (!member.alive) {
        const dt = this.add.text(tx + tabW - 15, ty + 3, 'K.O.', {fontSize:'7px',fontFamily:'monospace',color:'#ff4444'});
        this.tabElements.push(dt);
      }

      const tz = this.add.zone(tx + tabW/2, ty + tabH/2, tabW, tabH).setInteractive();
      tz.on('pointerdown', () => {
        if (i !== this.activeTab) {
          this.activeTab = i;
          this.drawTabs();
          this.drawMemberInventory();
        }
      });
      this.tabElements.push(tz);
    });
  }

  drawMemberInventory() {
    // Clear old items
    if (this.itemSprites) this.itemSprites.forEach(s => s.destroy());
    this.itemSprites = [];
    if (this.statLabels) this.statLabels.forEach(s => s.destroy());
    this.statLabels = [];

    const member = this.getActiveMember();
    const ox = 30, oy = 80, cs = 46;

    // Equipment slots
    this.equipSlots = [
      {name:'Head',   x:480, y:80,  iconKey:'icon_helmet', slotKey:'head'},
      {name:'Body',   x:480, y:135, iconKey:'icon_shield',  slotKey:'armor'},
      {name:'Weapon', x:430, y:190, iconKey:'icon_sword',   slotKey:'weapon'},
      {name:'Shield', x:530, y:190, iconKey:'icon_shield2', slotKey:'shield'},
      {name:'Ring',   x:480, y:245, iconKey:'icon_gem',     slotKey:'ring'}
    ];

    // Portrait
    const portraitKey = member.portrait || 'portrait_fighter';
    const portrait = this.add.image(420, 330, portraitKey).setDisplaySize(50,50).setAlpha(0.9).setDepth(10);
    this.itemSprites.push(portrait);
    this.portraitZone = {x:395, y:305, w:50, h:50};

    // Backpack grid 5x5 (25 slots)
    this.backpackSlots = [];
    const gridCols = 5, gridRows = 5;
    for(let row=0; row<gridRows; row++) for(let col=0; col<gridCols; col++) {
      this.g.fillStyle(0x1a1a2a); this.g.fillRect(ox+col*cs, oy+row*cs, cs-2, cs-2);
      this.g.lineStyle(1,0x333344); this.g.strokeRect(ox+col*cs, oy+row*cs, cs-2, cs-2);
      this.backpackSlots.push({x:ox+col*cs, y:oy+row*cs, w:cs-2, h:cs-2, idx: row*gridCols+col});
    }

    // Equipment slot graphics
    this.equipSlots.forEach(s => {
      const esg = this.add.graphics();
      esg.fillStyle(0x2a1a1a); esg.fillRect(s.x, s.y, cs-2, cs-2);
      esg.lineStyle(1,0x554433); esg.strokeRect(s.x, s.y, cs-2, cs-2);
      this.itemSprites.push(esg);
      const lbl = this.add.text(s.x+cs/2-1, s.y-10, s.name, {fontSize:'9px',fontFamily:'monospace',color:'#887766'}).setOrigin(0.5);
      this.itemSprites.push(lbl);
      const si = this.add.image(s.x+cs/2-1, s.y+cs/2-1, s.iconKey).setDisplaySize(20,20).setAlpha(0.15);
      this.itemSprites.push(si);
    });

    // Draw items in backpack
    member.inventory.forEach((item, i) => {
      if(i >= gridCols*gridRows) return;
      const col = i%gridCols, row = Math.floor(i/gridCols);
      const ix = ox+col*cs + cs/2-1;
      const iy = oy+row*cs + cs/2-1;

      const bg = this.add.graphics();
      bg.fillStyle(item.color || 0x666666, 0.3);
      bg.fillRect(ox+col*cs+2, oy+row*cs+2, cs-6, cs-6);
      this.itemSprites.push(bg);

      const iconKey = item.icon || ITEM_ICONS[item.type] || 'icon_gem';
      const icon = this.add.image(ix, iy, iconKey).setDisplaySize(32,32);
      this.itemSprites.push(icon);
    });

    // Draw equipped items
    const eqSlotKeys = ['head','armor','weapon','shield','ring'];
    eqSlotKeys.forEach((key, i) => {
      const idx = member.equipped[key];
      if(idx >= 0 && idx < member.inventory.length) {
        const item = member.inventory[idx];
        const s = this.equipSlots[i];
        const eqBg = this.add.graphics();
        eqBg.fillStyle(0xff8800, 0.2); eqBg.fillRect(s.x+2, s.y+2, cs-6, cs-6);
        eqBg.lineStyle(1, 0xff8800); eqBg.strokeRect(s.x, s.y, cs-2, cs-2);
        this.itemSprites.push(eqBg);
        const iconKey = item.icon || ITEM_ICONS[item.type] || 'icon_gem';
        const eqIcon = this.add.image(s.x+cs/2-1, s.y+cs/2-1, iconKey).setDisplaySize(32,32);
        this.itemSprites.push(eqIcon);
      }
    });

    // Stats
    const sx = 410, sy = 290;
    const addStat = (x,y,txt,col) => {
      const t = this.add.text(x,y,txt,{fontSize:'10px',fontFamily:'monospace',color:col});
      this.statLabels.push(t);
    };

    addStat(sx,sy+70,`STR:${member.str} DEX:${member.dex} CON:${member.con}`,'#aa9988');
    addStat(sx,sy+84,`INT:${member.int} WIS:${member.wis} CHA:${member.cha}`,'#aa9988');
    addStat(sx,sy+100,`AC:${member.ac} ATK:+${member.attackMod} DMG:d${member.damageDice}+${member.damageBonus}`,'#ccbbaa');
    addStat(sx,sy+114,`HP:${member.hp}/${member.maxHp} MP:${member.mana}/${member.maxMana}`,'#cc4444');
    addStat(sx,sy+128,`Lv:${member.level} XP:${member.xp}/${member.xpNext}`,'#999988');

    // Shared resources
    addStat(sx,sy+148,`Food:${Math.floor(PLAYER.food)} Water:${Math.floor(PLAYER.water)}`,'#dd8822');
    addStat(sx,sy+162,`Keys:${PLAYER.keys} Potions:${PLAYER.potions} Gold:${PLAYER.gold}`,'#ddaa44');
    addStat(sx,sy+176,`Torch:${PLAYER.torch} Floor:${GAME.floor}`,'#888877');

    if(member.weaponCoating && member.weaponCoating.hitsLeft>0) {
      const cn = member.weaponCoating.type==='fire'?'FIRE':'POISON';
      addStat(sx,sy+190,`Coating: ${cn} (${member.weaponCoating.hitsLeft})`,member.weaponCoating.type==='fire'?'#ff6600':'#44cc44');
    }
  }

  closeInventory() {
    if (this.glowTimer) this.glowTimer.destroy();
    this.scene.resume('Dungeon');
    this.scene.stop();
  }

  getItemAtPointer(px, py) {
    const ox=30, oy=80, cs=46, gridCols=5;
    const member = this.getActiveMember();
    for(let i=0; i<Math.min(member.inventory.length, 25); i++) {
      const col = i%gridCols, row = Math.floor(i/gridCols);
      const sx = ox+col*cs, sy = oy+row*cs;
      if (px >= sx && px < sx+cs && py >= sy && py < sy+cs) return i;
    }
    return -1;
  }

  getEquipSlotAtPointer(px, py) {
    const cs = 46;
    for(let i=0; i<this.equipSlots.length; i++) {
      const s = this.equipSlots[i];
      if (px >= s.x && px < s.x+cs && py >= s.y && py < s.y+cs) return i;
    }
    return -1;
  }

  isOverPortrait(px, py) {
    const z = this.portraitZone;
    return px >= z.x && px < z.x+z.w && py >= z.y && py < z.y+z.h;
  }

  isOverKeyhole(px, py) {
    if (!this.keyholeZone) return false;
    const z = this.keyholeZone;
    return px >= z.x && px < z.x+z.w && py >= z.y && py < z.y+z.h;
  }

  isOverSconce(px, py) {
    if (!this.sconceZone) return false;
    const z = this.sconceZone;
    return px >= z.x && px < z.x+z.w && py >= z.y && py < z.y+z.h;
  }

  // Check if dropped on another character's tab
  getTabAtPointer(px, py) {
    const tabW = 180, tabH = 26;
    for (let i = 0; i < PARTY.length; i++) {
      const tx = 40 + i * (tabW + 5);
      const ty = 38;
      if (px >= tx && px < tx+tabW && py >= ty && py < ty+tabH) return i;
    }
    return -1;
  }

  onPointerDown(ptr) {
    const member = this.getActiveMember();
    const idx = this.getItemAtPointer(ptr.x, ptr.y);
    if (idx >= 0 && idx < member.inventory.length) {
      this.dragOrigIdx = idx;
      this.dragItem = member.inventory[idx];
      const iconKey = this.dragItem.icon || ITEM_ICONS[this.dragItem.type] || 'icon_gem';
      this.dragSprite = this.add.image(ptr.x, ptr.y, iconKey).setDisplaySize(40,40).setAlpha(0.6).setDepth(500);

      if (GAME.isTouchDevice) {
        this.longPressTimer = this.time.delayedCall(500, () => {
          if (this.dragItem) this.showTooltip(ptr.x, ptr.y, this.dragItem);
        });
      }
    }

    const eqIdx = this.getEquipSlotAtPointer(ptr.x, ptr.y);
    if (eqIdx >= 0) {
      const slotKey = this.equipSlots[eqIdx].slotKey;
      const invIdx = member.equipped[slotKey];
      if (invIdx >= 0 && invIdx < member.inventory.length) {
        this.dragOrigIdx = invIdx;
        this.dragItem = member.inventory[invIdx];
        this.dragFromEquip = slotKey;
        const iconKey = this.dragItem.icon || ITEM_ICONS[this.dragItem.type] || 'icon_gem';
        this.dragSprite = this.add.image(ptr.x, ptr.y, iconKey).setDisplaySize(40,40).setAlpha(0.6).setDepth(500);
      }
    }
  }

  onPointerMove(ptr) {
    if (this.dragSprite) {
      this.dragSprite.setPosition(ptr.x, ptr.y);
      if (this.longPressTimer) { this.longPressTimer.destroy(); this.longPressTimer = null; }
    }
  }

  onPointerUp(ptr) {
    if (this.longPressTimer) { this.longPressTimer.destroy(); this.longPressTimer = null; }
    if (this.tooltipText) { this.tooltipText.destroy(); this.tooltipText = null; }

    if (!this.dragSprite || !this.dragItem) return;

    const member = this.getActiveMember();
    let handled = false;

    // Check if dropped on another tab (transfer item)
    const targetTab = this.getTabAtPointer(ptr.x, ptr.y);
    if (targetTab >= 0 && targetTab !== this.activeTab) {
      // Transfer item to another party member
      const targetMember = PARTY[targetTab];
      const item = this.dragItem;
      const idx = this.dragOrigIdx;
      // Remove from current member
      member.inventory.splice(idx, 1);
      for (const slot of Object.keys(member.equipped)) {
        if (member.equipped[slot] > idx) member.equipped[slot]--;
        else if (member.equipped[slot] === idx) member.equipped[slot] = -1;
      }
      // Add to target member
      targetMember.inventory.push(item);
      AudioSys.equipSound();
      this.showFloating(ptr.x, ptr.y, `-> ${targetMember.name}`, '#44ff44');
      handled = true;
    } else if (this.isOverPortrait(ptr.x, ptr.y)) {
      handled = this.handlePortraitDrop(member);
    } else if (this.isOverKeyhole(ptr.x, ptr.y)) {
      handled = this.handleKeyholeDrop(member);
    } else if (this.isOverSconce(ptr.x, ptr.y)) {
      handled = this.handleSconceDrop(member);
    } else {
      const eqIdx = this.getEquipSlotAtPointer(ptr.x, ptr.y);
      if (eqIdx >= 0) {
        handled = this.handleEquipDrop(eqIdx, member);
      } else {
        const bpIdx = this.getItemAtPointer(ptr.x, ptr.y);
        if (bpIdx >= 0 && this.dragFromEquip) {
          member.equipped[this.dragFromEquip] = -1;
          AudioSys.equipSound();
          handled = true;
        }
      }
    }

    if (!handled && this.dragSprite) {
      const ox=30, cs=46, gridCols=5;
      const col = this.dragOrigIdx%gridCols, row = Math.floor(this.dragOrigIdx/gridCols);
      const origX = ox+col*cs+cs/2-1, origY = 80+row*cs+cs/2-1;
      this.tweens.add({
        targets: this.dragSprite, x: origX, y: origY, alpha: 0,
        duration: 200, ease: 'Power2',
        onComplete: () => { if(this.dragSprite) { this.dragSprite.destroy(); this.dragSprite = null; } }
      });
    } else {
      if(this.dragSprite) { this.dragSprite.destroy(); this.dragSprite = null; }
    }

    this.dragItem = null;
    this.dragOrigIdx = -1;
    this.dragFromEquip = null;

    if (handled) {
      this.drawMemberInventory();
    }
  }

  handlePortraitDrop(member) {
    const item = this.dragItem;
    const idx = this.dragOrigIdx;

    if (item.type === 'potion' && (item.subtype === 'health' || !item.subtype)) {
      const heal = rollDice(4) + rollDice(4) + 2;
      member.hp = Math.min(member.maxHp, member.hp + heal);
      PLAYER.potions = Math.max(0, PLAYER.potions - 1);
      this.removeItem(member, idx);
      AudioSys.healSound();
      this.showFloating(420, 310, `+${heal} HP`, '#44ff44');
      syncPlayerFromParty();
      return true;
    }
    if (item.type === 'potion' && item.subtype === 'mana') {
      const restore = rollDice(6) + 3;
      member.mana = Math.min(member.maxMana, member.mana + restore);
      this.removeItem(member, idx);
      AudioSys.healSound();
      this.showFloating(420, 310, `+${restore} MP`, '#4488ff');
      return true;
    }
    if (item.type === 'food') {
      const fr = item.foodRestore || 25;
      const wr = item.waterRestore || 0;
      PLAYER.food = Math.min(PLAYER.maxFood, PLAYER.food + fr);
      if (wr > 0) PLAYER.water = Math.min(PLAYER.maxWater, PLAYER.water + wr);
      this.removeItem(member, idx);
      AudioSys.eatSound();
      this.showFloating(420, 310, `+${fr} Food`, '#ddaa44');
      return true;
    }
    if (item.type === 'water') {
      const wr = item.waterRestore || 30;
      const fr = item.foodRestore || 0;
      PLAYER.water = Math.min(PLAYER.maxWater, PLAYER.water + wr);
      if (fr > 0) PLAYER.food = Math.min(PLAYER.maxFood, PLAYER.food + fr);
      this.removeItem(member, idx);
      AudioSys.drinkSound();
      this.showFloating(420, 310, `+${wr} Water`, '#4488ff');
      return true;
    }

    AudioSys.errorSound();
    return false;
  }

  handleKeyholeDrop(member) {
    const item = this.dragItem;
    const idx = this.dragOrigIdx;
    if (item.type !== 'key') { AudioSys.clunkSound(); this.showFloating(155, 450, "Wrong item.", '#ff4444'); return false; }

    AudioSys.keyTurnSound();
    PLAYER.keys--;
    this.removeItem(member, idx);
    if (this.keyholeZone) {
      GAME.currentMap[this.keyholeZone.tileY][this.keyholeZone.tileX] = 0;
    }
    this.showFloating(155, 450, 'Unlocked!', '#44ff44');
    if (this.keyholeGfx) { this.keyholeGfx.destroy(); this.keyholeGfx = null; }
    this.keyholeZone = null;
    return true;
  }

  handleSconceDrop(member) {
    if (PLAYER.torch < 10) { AudioSys.errorSound(); this.showFloating(85, 450, 'Low torch.', '#ff4444'); return false; }
    PLAYER.torch -= 10;
    AudioSys.sconceSound();
    if (this.sconceZone) GAME.litSconces[this.sconceZone.sconceKey] = true;
    this.showFloating(85, 450, 'Lit!', '#ffaa44');
    if (this.sconceGfx) {
      this.sconceGfx.clear();
      this.sconceGfx.fillStyle(0x2a2211); this.sconceGfx.fillRect(60,460,50,50);
      this.sconceGfx.lineStyle(2,0xffaa44); this.sconceGfx.strokeRect(60,460,50,50);
      this.sconceGfx.fillStyle(0xff8833,0.5); this.sconceGfx.fillCircle(85,480,10);
    }
    this.sconceZone = null;
    if (this.dragSprite) { this.dragSprite.destroy(); this.dragSprite = null; }
    this.dragItem = null;
    this.drawMemberInventory();
    return true;
  }

  handleEquipDrop(eqIdx, member) {
    const item = this.dragItem;
    const idx = this.dragOrigIdx;
    const slot = this.equipSlots[eqIdx];

    if (item.type === 'coating' && slot.slotKey === 'weapon') {
      if (member.equipped.weapon < 0) { AudioSys.errorSound(); return false; }
      member.weaponCoating = { type: item.subtype, hitsLeft: 3 };
      this.removeItem(member, idx);
      AudioSys.coatSound();
      this.showFloating(460, 190, `${item.subtype} coat!`, item.subtype==='fire'?'#ff6600':'#44cc44');
      return true;
    }
    if (item.type === 'weapon' && slot.slotKey === 'weapon') {
      member.equipped.weapon = idx;
      member.weapon = item.name;
      member.damageDice = item.damageDice || member.damageDice;
      member.damageBonus = item.damageBonus !== undefined ? item.damageBonus : member.damageBonus;
      AudioSys.equipSound();
      syncPlayerFromParty();
      return true;
    }
    if (item.type === 'armor' && slot.slotKey === 'armor') {
      const oldIdx = member.equipped.armor;
      if (oldIdx >= 0 && member.inventory[oldIdx]) member.ac -= (member.inventory[oldIdx].acBonus || 0);
      member.equipped.armor = idx;
      member.ac += (item.acBonus || 0);
      AudioSys.equipSound();
      syncPlayerFromParty();
      return true;
    }
    if (item.type === 'shield' && slot.slotKey === 'shield') {
      const oldIdx = member.equipped.shield;
      if (oldIdx >= 0 && member.inventory[oldIdx]) member.ac -= (member.inventory[oldIdx].acBonus || 0);
      member.equipped.shield = idx;
      member.ac += (item.acBonus || 0);
      AudioSys.equipSound();
      syncPlayerFromParty();
      return true;
    }
    if (item.type === 'head' && slot.slotKey === 'head') { member.equipped.head = idx; AudioSys.equipSound(); return true; }
    if (item.type === 'ring' && slot.slotKey === 'ring') { member.equipped.ring = idx; AudioSys.equipSound(); return true; }

    AudioSys.errorSound();
    return false;
  }

  removeItem(member, idx) {
    member.inventory.splice(idx, 1);
    for (const slot of Object.keys(member.equipped)) {
      if (member.equipped[slot] > idx) member.equipped[slot]--;
      else if (member.equipped[slot] === idx) member.equipped[slot] = -1;
    }
  }

  showFloating(x, y, text, color) {
    const ft = this.add.text(x, y, text, {fontSize:'13px',fontFamily:'monospace',color:color,fontStyle:'bold'}).setOrigin(0.5).setDepth(600);
    this.tweens.add({ targets: ft, y: y-35, alpha: 0, duration: 1000, onComplete: () => ft.destroy() });
  }

  showTooltip(x, y, item) {
    if (this.tooltipText) this.tooltipText.destroy();
    let info = item.name;
    if (item.type === 'weapon') info += ` (d${item.damageDice}+${item.damageBonus||0})`;
    if (item.type === 'armor' || item.type === 'shield') info += ` (+${item.acBonus||0} AC)`;
    if (item.type === 'food') info += ` (+${item.foodRestore} food)`;
    if (item.type === 'water') info += ` (+${item.waterRestore} water)`;
    if (item.type === 'throwable') info += ` (d${item.throwDice} throw)`;
    if (item.type === 'coating') info += ` (3 hits +d4 ${item.subtype})`;
    this.tooltipText = this.add.text(x, y-30, info, {fontSize:'9px',fontFamily:'monospace',color:'#ffcc88',backgroundColor:'#111111'}).setOrigin(0.5).setDepth(700);
  }

  updateDropZoneGlow() {
    this.dropZoneGfx.clear();
    if (!this.dragItem) return;
    const pulse = Math.sin(this.glowPhase) * 0.3 + 0.4;
    const item = this.dragItem;

    if (item.type === 'potion' || item.type === 'food' || item.type === 'water') {
      this.dropZoneGfx.lineStyle(2, 0x44ff44, pulse);
      this.dropZoneGfx.strokeRect(this.portraitZone.x, this.portraitZone.y, this.portraitZone.w, this.portraitZone.h);
    }
    if (item.type === 'key' && this.keyholeZone) {
      this.dropZoneGfx.lineStyle(2, 0xffdd44, pulse);
      this.dropZoneGfx.strokeRect(this.keyholeZone.x, this.keyholeZone.y, this.keyholeZone.w, this.keyholeZone.h);
    }
    if (this.sconceZone && PLAYER.torch >= 10) {
      this.dropZoneGfx.lineStyle(2, 0xffaa44, pulse);
      this.dropZoneGfx.strokeRect(this.sconceZone.x, this.sconceZone.y, this.sconceZone.w, this.sconceZone.h);
    }
    // Highlight other character tabs when dragging
    if (this.dragItem) {
      const tabW = 180, tabH = 26;
      for (let i = 0; i < PARTY.length; i++) {
        if (i === this.activeTab) continue;
        const tx = 40 + i * (tabW + 5);
        const ty = 38;
        this.dropZoneGfx.lineStyle(2, 0xffaa44, pulse);
        this.dropZoneGfx.strokeRect(tx, ty, tabW, tabH);
      }
    }
    if (item.type === 'coating') {
      const ws = this.equipSlots[2];
      this.dropZoneGfx.lineStyle(2, item.subtype==='fire'?0xff6600:0x44cc44, pulse);
      this.dropZoneGfx.strokeRect(ws.x, ws.y, 44, 44);
    }
    if (item.type === 'weapon') {
      const ws = this.equipSlots[2];
      this.dropZoneGfx.lineStyle(2, 0xaaaacc, pulse);
      this.dropZoneGfx.strokeRect(ws.x, ws.y, 44, 44);
    }
    if (item.type === 'armor') {
      const ws = this.equipSlots[1];
      this.dropZoneGfx.lineStyle(2, 0x8888cc, pulse);
      this.dropZoneGfx.strokeRect(ws.x, ws.y, 44, 44);
    }
    if (item.type === 'shield') {
      const ws = this.equipSlots[3];
      this.dropZoneGfx.lineStyle(2, 0x88aacc, pulse);
      this.dropZoneGfx.strokeRect(ws.x, ws.y, 44, 44);
    }
  }
}

// ============================================================
// GAME CONFIG
// ============================================================
try {
  if (typeof Phaser === 'undefined') throw new Error('Phaser not loaded');
  dxStatus('Starting Dungeon X...');
  const config = {
    type: Phaser.CANVAS,
    width: 800,
    height: 600,
    backgroundColor: '#0a0a0f',
    pixelArt: true,
    input: { activePointers: 2 },
    scene: [PreloadScene, BootScene, ClassSelectScene, TavernScene, DungeonScene, CombatScene, InventoryScene],
    physics: { default: 'arcade' },
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    callbacks: {
      postBoot: function() {
        var el = document.getElementById('dx-status');
        if (el) el.className = 'ok';
      }
    }
  };
  const game = new Phaser.Game(config);
} catch(e) {
  dxStatus('GAME ERROR: ' + e.message, true);
}
</script>
