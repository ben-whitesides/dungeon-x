<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dungeon X</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            touch-action: none;
            font-family: monospace;
        }
        canvas { display: block; image-rendering: pixelated; }
        #dx-status { position:fixed; top:0; left:0; right:0; padding:20px; color:#ff8800; font-family:monospace; font-size:16px; z-index:9999; background:#0a0a0f; text-align:center; }
        #dx-status.error { color:#ff3333; }
        #dx-status.ok { display:none; }
    </style>
</head>
<body>
<div id="dx-status">Loading Phaser engine...</div>
<script>
  window.dxStatus = function(msg, isError) {
    var el = document.getElementById('dx-status');
    if (el) { el.textContent = msg; el.className = isError ? 'error' : ''; }
  };
  window.onerror = function(msg, src, line, col, err) {
    dxStatus('ERROR: ' + msg + ' (line ' + line + ')', true);
    return false;
  };
</script>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js" onerror="dxStatus('Failed to load Phaser from CDN. Check your connection.', true)"></script>
<script>
  if (typeof Phaser === 'undefined') {
    dxStatus('Phaser not loaded — CDN blocked or slow. Retrying...', true);
  } else {
    dxStatus('Phaser loaded. Building game...');
  }
</script>

<script>
// ============================================================
// DUNGEON X — Merchant / Daily Seed / Strider Whispers Module
// Self-contained IIFE — exposes window.DX_MERCHANT, window.DX_SEED,
// and window.DX_STRIDER
// Version 0.3.0
// ============================================================

(function() {
  'use strict';

  // ============================================================
  //
  //  PART 1: DX_SEED — Daily Deterministic Seed System
  //  (Placed first because Merchant and Strider depend on it)
  //
  // ============================================================

  // ----------------------------------------------------------
  // djb2 hash: string -> 32-bit integer
  // ----------------------------------------------------------
  function djb2(str) {
    var hash = 5381;
    for (var i = 0; i < str.length; i++) {
      hash = ((hash << 5) + hash) + str.charCodeAt(i);
      hash = hash & hash; // convert to 32-bit int
    }
    return hash >>> 0; // unsigned
  }

  // ----------------------------------------------------------
  // Mulberry32 PRNG: deterministic 0-1 float from a 32-bit state
  // ----------------------------------------------------------
  function mulberry32(seed) {
    var t = (seed + 0x6D2B79F5) | 0;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }

  // ----------------------------------------------------------

  var DUNGEON_POOL = [

      floors: 4,

    },
    {

      elementalTheme: 'wind',

      description: 'A vertical nightmare. The wind screams through broken stone, and things ride the gale.'
    },
    {
      id: 'void_chambers',
      name: 'The Void Chambers',
      themeColor: 0x331166,
      primaryEnemyType: 'shadow',
      elementalTheme: 'shadow',
      floors: 5,
      difficulty: 8,
      fragment: 'Fragment of Shadow',
      description: 'Darkness so thick it has weight. Your torch means nothing here.'
    },
    {
      id: 'crystal_sanctum',
      name: 'The Crystal Sanctum',
      themeColor: 0xffffaa,
      primaryEnemyType: 'light',
      elementalTheme: 'light',
      floors: 5,
      difficulty: 9,
      fragment: 'Fragment of Light',
      description: 'Blinding radiance hides lethal guardians. The sanctum does not welcome visitors.'
    },
    {
      id: 'final_descent',
      name: 'The Final Descent',
      themeColor: 0xff0044,
      primaryEnemyType: 'all',
      elementalTheme: 'all',
      floors: 5,
      difficulty: 10,
      fragment: 'Fragment of Life',
      description: 'The last dungeon. Every horror you have faced waits here — and worse. The Sunstone lies beyond.'
    }
  ];

  // ----------------------------------------------------------
  // Cell types for dungeon grid
  // ----------------------------------------------------------
  var CELL = {
    EMPTY:       0,
    CORRIDOR:    1,
    ROOM:        2,
    LOCKED_DOOR: 3,
    TRAP:        4,
    CHEST:       5,
    STAIRS_DOWN: 6,
    ENEMY:       7,
    NPC:         8,
    SHRINE:      9,
    OBSTACLE:   10,
    STAIRS_UP:  11,
    KEY:        12,
    MARKING:    13
  };

  // ----------------------------------------------------------
  // Tavern rumor pool — 30 rumors, seed picks 3 per day
  // ----------------------------------------------------------
  var RUMOR_POOL = [
    "They say the Crypts breathe at night. Not the wind — the walls themselves.",
    "A knight went down last week. Came back without his shadow.",
    "The goblins have been quiet. That's never good.",
    "Someone found a golden key on floor three. Opened a door that wasn't there before.",
    "The Flooded Vaults are rising. Another foot of water since yesterday.",
    "A merchant in the Ember Depths? Aye. Dead merchant, mind you.",
    "The Frozen Abyss took four men last month. Sent back their boots. Just the boots.",
    "The Shattered Halls shift. Walls move when you're not looking.",
    "You can hear singing from the Howling Spire. Beautiful, they say. Before you die.",
    "The Void Chambers eat torchlight. Bring two. Or three. Or don't go.",
    "The Crystal Sanctum blinds you before it kills you. A mercy, perhaps.",
    "Nobody returns from the Final Descent. That's not rumor. That's record.",
    "The barkeep lost his brother down there. Doesn't talk about it. Ever.",
    "A cleric found a Fragment once. Said it whispered his daughter's name.",
    "The traps on floor two reset themselves. Every damn night.",
    "There's a shrine on floor three of the Crypts. Blessed me once. Cursed me twice.",
    "The creatures down there — they learn. Your patterns, your timing. Be unpredictable.",
    "I saw a man come back with a Fragment of Dawn. Eyes weren't the same after.",
    "The walls have markings. Old language. They say they're warnings. Or invitations.",
    "Gold's good, but torches are better. You can't spend coin in the dark.",
    "The locked doors — some lead to treasure. Some lead to things best left locked.",
    "An old ranger told me: the deeper floors have fewer enemies. But bigger ones.",
    "They found footprints in the Crypts. Going down. None coming back up.",
    "The constructs in the Vaults don't tire. Don't sleep. Don't forget.",
    "Some scrolls down there predate the kingdom. The words still have power.",
    "A mage tried to map the Spire once. Said the stairs go in directions that shouldn't exist.",
    "The demons in Ember Depths don't want your soul. They want your fear. It feeds them.",
    "If you find a shrine, choose carefully. The gods below are not the gods above.",
    "The Sunstone fragments call to each other. Collect enough and you'll hear the hum.",
    "An adventurer told me the Void Chambers showed her things. Things that haven't happened yet."
  ];

  // ----------------------------------------------------------
  // Wall marking pool
  // ----------------------------------------------------------
  var MARKING_POOL = [
    { text: 'TURN BACK', style: 'scratched' },
    { text: 'THE LIGHT LIES', style: 'carved' },
    { text: 'THREE LEFT THEN DOWN', style: 'chalk' },
    { text: 'HE STILL WALKS', style: 'blood' },
    { text: 'COUNT YOUR TORCHES', style: 'scratched' },
    { text: 'THE WATER REMEMBERS', style: 'carved' },
    { text: 'DO NOT OPEN THE FOURTH DOOR', style: 'chalk' },
    { text: 'SHE WAITS BELOW', style: 'blood' },
    { text: 'THE STONE SPEAKS TRUE', style: 'carved' },
    { text: 'I WAS HERE — I AM STILL HERE', style: 'scratched' },
    { text: 'THE FRAGMENT SINGS', style: 'chalk' },
    { text: 'PRAISE THE DAWN', style: 'carved' },
    { text: 'FEED THE SHRINE', style: 'blood' },
    { text: 'THE GOBLINS TRADE', style: 'chalk' },
    { text: 'FIVE WENT DOWN FOUR CAME BACK', style: 'scratched' },
    { text: 'THE KEY IS NOT THE ANSWER', style: 'carved' },
    { text: 'LISTEN', style: 'blood' },
    { text: 'THE WALLS HAVE TEETH', style: 'scratched' },
    { text: 'GOLD WEIGHS MORE THAN YOU THINK', style: 'chalk' },
    { text: 'THE LAST DESCENT HAS NO STAIRS UP', style: 'blood' }
  ];

  // ----------------------------------------------------------
  // Shrine effect pool
  // ----------------------------------------------------------
  var SHRINE_EFFECTS = [
    { name: 'Blessing of Vigor',    type: 'buff',  stat: 'maxHp',   value: 5,  description: '+5 Max HP' },
    { name: 'Blessing of Insight',  type: 'buff',  stat: 'maxMana', value: 5,  description: '+5 Max Mana' },
    { name: 'Blessing of Iron',     type: 'buff',  stat: 'ac',      value: 1,  description: '+1 AC' },
    { name: 'Blessing of the Keen', type: 'buff',  stat: 'attackMod',value: 1,  description: '+1 Attack' },
    { name: 'Blessing of Fortune',  type: 'buff',  stat: 'gold',    value: 20, description: '+20 Gold' },
    { name: 'Blessing of Light',    type: 'buff',  stat: 'torch',   value: 20, description: '+20 Torch' },
    { name: 'Curse of Frailty',     type: 'curse', stat: 'maxHp',   value: -3, description: '-3 Max HP' },
    { name: 'Curse of Fog',         type: 'curse', stat: 'maxMana', value: -3, description: '-3 Max Mana' },
    { name: 'Curse of Rust',        type: 'curse', stat: 'ac',      value: -1, description: '-1 AC' },
    { name: 'Curse of Fumbling',    type: 'curse', stat: 'attackMod',value: -1, description: '-1 Attack' },
    { name: 'Curse of the Miser',   type: 'curse', stat: 'gold',    value: -15,description: '-15 Gold' },
    { name: 'Curse of Darkness',    type: 'curse', stat: 'torch',   value: -15,description: '-15 Torch' }
  ];

  // ----------------------------------------------------------
  // DX_SEED public API
  // ----------------------------------------------------------
  var seed = {

    // Cell type constants (for external reference)
    CELL: CELL,

    // Dungeon pool (for external reference)
    DUNGEON_POOL: DUNGEON_POOL,

    // ----------------------------------------------------------
    // getSeed: returns today's seed as a 32-bit unsigned integer
    // ----------------------------------------------------------
    getSeed: function() {
      var now = new Date();
      var dateStr = now.getFullYear() + '-' +
        String(now.getMonth() + 1).padStart(2, '0') + '-' +
        String(now.getDate()).padStart(2, '0');
      return djb2(dateStr);
    },

    // ----------------------------------------------------------
    // getSeedForDate: seed for a specific date string 'YYYY-MM-DD'
    // ----------------------------------------------------------
    getSeedForDate: function(dateStr) {
      return djb2(dateStr);
    },

    // ----------------------------------------------------------
    // seededRandom: deterministic float [0,1) from seed + index
    // Each unique (seed, index) pair produces the same result.
    // ----------------------------------------------------------
    seededRandom: function(seed, index) {
      return mulberry32(seed + index * 2654435761);
    },

    // ----------------------------------------------------------
    // seededInt: deterministic integer in [min, max] inclusive
    // ----------------------------------------------------------
    seededInt: function(seed, index, min, max) {
      return min + Math.floor(this.seededRandom(seed, index) * (max - min + 1));
    },

    // ----------------------------------------------------------
    // seededPick: pick a random element from an array
    // ----------------------------------------------------------
    seededPick: function(seed, index, arr) {
      return arr[Math.floor(this.seededRandom(seed, index) * arr.length)];
    },

    // ----------------------------------------------------------
    // seededShuffle: Fisher-Yates shuffle of array copy
    // ----------------------------------------------------------
    seededShuffle: function(seed, startIndex, arr) {
      var copy = arr.slice();
      for (var i = copy.length - 1; i > 0; i--) {
        var j = Math.floor(this.seededRandom(seed, startIndex + i) * (i + 1));
        var tmp = copy[i];
        copy[i] = copy[j];
        copy[j] = tmp;
      }
      return copy;
    },

    // ----------------------------------------------------------
    // getMerchantSeed: sub-seed for merchant inventory
    // ----------------------------------------------------------
    getMerchantSeed: function(baseSeed) {
      return djb2('merchant_' + baseSeed);
    },

    // ----------------------------------------------------------
    // getRumorSeed: sub-seed for NPC rumors
    // ----------------------------------------------------------
    getRumorSeed: function(baseSeed) {
      return djb2('rumor_' + baseSeed);
    },

    // ----------------------------------------------------------
    // getShrineSeed: sub-seed for shrine effects
    // ----------------------------------------------------------
    getShrineSeed: function(baseSeed) {
      return djb2('shrine_' + baseSeed);
    },

    // ----------------------------------------------------------
    // getDungeonOptions: returns 2-3 dungeon options for the
    //   notice board. Excludes Final Descent until 9 fragments
    //   are found (handled by caller). Seed determines selection.
    // ----------------------------------------------------------
    getDungeonOptions: function(baseSeed, fragmentCount) {
      fragmentCount = fragmentCount || 0;
      var available = DUNGEON_POOL.slice(0, 9); // Exclude Final Descent
      if (fragmentCount >= 9) {
        available.push(DUNGEON_POOL[9]); // Unlock Final Descent
      }

      var dungeonSeed = djb2('dungeons_' + baseSeed);
      var count = this.seededRandom(dungeonSeed, 0) < 0.4 ? 2 : 3;
      var shuffled = this.seededShuffle(dungeonSeed, 100, available);
      var options = shuffled.slice(0, count);

      // Attach today's rumors for each dungeon
      var rumorSeed = this.getRumorSeed(baseSeed);
      var rumorShuffled = this.seededShuffle(rumorSeed, 0, RUMOR_POOL);
      for (var i = 0; i < options.length; i++) {
        options[i] = JSON.parse(JSON.stringify(options[i])); // deep copy
        options[i].rumor = rumorShuffled[i] || rumorShuffled[0];
      }

      return options;
    },

    // ----------------------------------------------------------
    // getTavernRumors: returns 3 rumors for today
    // ----------------------------------------------------------
    getTavernRumors: function(baseSeed) {
      var rumorSeed = this.getRumorSeed(baseSeed);
      var shuffled = this.seededShuffle(rumorSeed, 50, RUMOR_POOL);
      return shuffled.slice(0, 3);
    },

    // ----------------------------------------------------------
    // getShrineEffect: returns a shrine effect for a given floor
    // ----------------------------------------------------------
    getShrineEffect: function(baseSeed, dungeonId, floorNum) {
      var shrineSeed = djb2('shrine_' + baseSeed + '_' + dungeonId + '_' + floorNum);
      var idx = Math.floor(this.seededRandom(shrineSeed, 0) * SHRINE_EFFECTS.length);
      return JSON.parse(JSON.stringify(SHRINE_EFFECTS[idx]));
    },

    // ----------------------------------------------------------
    // getWallMarkings: returns 1-2 markings for a floor
    // ----------------------------------------------------------
    getWallMarkings: function(baseSeed, dungeonId, floorNum) {
      var markSeed = djb2('marking_' + baseSeed + '_' + dungeonId + '_' + floorNum);
      var count = this.seededRandom(markSeed, 0) < 0.5 ? 1 : 2;
      var shuffled = this.seededShuffle(markSeed, 10, MARKING_POOL);
      return shuffled.slice(0, count);
    },

    // ----------------------------------------------------------
    // generateFloor: produces a 7x7 grid for a dungeon floor
    //
    // Returns:
    // {
    //   grid: 7x7 array of CELL constants,
    //   stairsUp: {x, y},
    //   stairsDown: {x, y},
    //   enemies: [{x, y, type}],
    //   chests: [{x, y, contents}],
    //   npc: {x, y, type} or null,
    //   traps: [{x, y, type}],
    //   shrine: {x, y, effect} or null,
    //   keys: [{x, y}],
    //   lockedDoors: [{x, y}],
    //   markings: [{x, y, text, style}]
    // }
    // ----------------------------------------------------------
    generateFloor: function(baseSeed, dungeonId, floorNum) {
      var floorSeed = djb2(baseSeed + '_' + dungeonId + '_' + floorNum);
      var idx = 0; // running index for seededRandom calls

      // Helper: next seeded random
      var self = this;
      function rng() {
        return self.seededRandom(floorSeed, idx++);
      }
      function rngInt(min, max) {
        return min + Math.floor(rng() * (max - min + 1));
      }

      // Initialize 7x7 grid to EMPTY
      var GRID_SIZE = 7;
      var grid = [];
      for (var y = 0; y < GRID_SIZE; y++) {
        grid[y] = [];
        for (var x = 0; x < GRID_SIZE; x++) {
          grid[y][x] = CELL.EMPTY;
        }
      }

      // Result containers
      var enemies = [];
      var chests = [];
      var traps = [];
      var keys = [];
      var lockedDoors = [];
      var markings = [];
      var npc = null;
      var shrine = null;

      // ------ Step 1: Place stairs_up at a random edge cell ------
      var edges = [];
      for (var i = 1; i < GRID_SIZE - 1; i++) {
        edges.push({ x: 0, y: i });           // left edge
        edges.push({ x: GRID_SIZE - 1, y: i }); // right edge
        edges.push({ x: i, y: 0 });           // top edge
        edges.push({ x: i, y: GRID_SIZE - 1 }); // bottom edge
      }
      var stairsUpIdx = Math.floor(rng() * edges.length);
      var stairsUp = edges[stairsUpIdx];
      grid[stairsUp.y][stairsUp.x] = CELL.STAIRS_UP;

      // ------ Step 2: Random walk to carve corridors ------
      // Target: ~60% of cells as corridors
      var targetCorridors = Math.floor(GRID_SIZE * GRID_SIZE * 0.6);
      var cx = stairsUp.x;
      var cy = stairsUp.y;
      var carved = 1;
      var directions = [
        { dx: 0, dy: -1 }, // N
        { dx: 1, dy: 0 },  // E
        { dx: 0, dy: 1 },  // S
        { dx: -1, dy: 0 }  // W
      ];
      var maxSteps = 200; // safety limit
      var step = 0;

      while (carved < targetCorridors && step < maxSteps) {
        step++;
        var dirIdx = Math.floor(rng() * 4);
        var dir = directions[dirIdx];
        var nx = cx + dir.dx;
        var ny = cy + dir.dy;

        if (nx >= 0 && nx < GRID_SIZE && ny >= 0 && ny < GRID_SIZE) {
          cx = nx;
          cy = ny;
          if (grid[cy][cx] === CELL.EMPTY) {
            grid[cy][cx] = CELL.CORRIDOR;
            carved++;
          }
        }
      }

      // ------ Step 3: Place 2-3 rooms (2x2 open areas) ------
      var roomCount = rng() < 0.5 ? 2 : 3;
      var rooms = [];
      for (var r = 0; r < roomCount; r++) {
        var attempts = 0;
        while (attempts < 20) {
          attempts++;
          var rx = rngInt(0, GRID_SIZE - 2);
          var ry = rngInt(0, GRID_SIZE - 2);

          // Check the 2x2 area isn't overlapping stairs
          var canPlace = true;
          for (var ry2 = ry; ry2 <= ry + 1; ry2++) {
            for (var rx2 = rx; rx2 <= rx + 1; rx2++) {
              if (grid[ry2][rx2] === CELL.STAIRS_UP || grid[ry2][rx2] === CELL.ROOM) {
                canPlace = false;
              }
            }
          }
          if (canPlace) {
            for (var ry2 = ry; ry2 <= ry + 1; ry2++) {
              for (var rx2 = rx; rx2 <= rx + 1; rx2++) {
                grid[ry2][rx2] = CELL.ROOM;
              }
            }
            rooms.push({ x: rx, y: ry });
            break;
          }
        }
      }

      // ------ Step 4: Place stairs_down (furthest from stairs_up) ------
      var bestDist = -1;
      var stairsDown = { x: GRID_SIZE - 1 - stairsUp.x, y: GRID_SIZE - 1 - stairsUp.y };

      // Find the walkable cell furthest from stairs_up
      for (var sy = 0; sy < GRID_SIZE; sy++) {
        for (var sx = 0; sx < GRID_SIZE; sx++) {
          if (grid[sy][sx] === CELL.CORRIDOR || grid[sy][sx] === CELL.ROOM) {
            var dist = Math.abs(sx - stairsUp.x) + Math.abs(sy - stairsUp.y);
            if (dist > bestDist) {
              bestDist = dist;
              stairsDown = { x: sx, y: sy };
            }
          }
        }
      }
      grid[stairsDown.y][stairsDown.x] = CELL.STAIRS_DOWN;

      // ------ Step 5: Scatter enemies ------
      var enemyCount = floorNum * 2 + 1;
      var enemyTypes = ['shadow_lurker', 'frost_wraith', 'bone_revenant', 'goblin', 'demon_imp', 'ice_golem'];
      var placed = 0;
      var placeAttempts = 0;

      while (placed < enemyCount && placeAttempts < 100) {
        placeAttempts++;
        var ex = rngInt(0, GRID_SIZE - 1);
        var ey = rngInt(0, GRID_SIZE - 1);
        if (grid[ey][ex] === CELL.CORRIDOR || grid[ey][ex] === CELL.ROOM) {
          // Don't place too close to stairs_up (min 2 cells)
          var distFromStart = Math.abs(ex - stairsUp.x) + Math.abs(ey - stairsUp.y);
          if (distFromStart >= 2) {
            grid[ey][ex] = CELL.ENEMY;
            var eType = enemyTypes[Math.floor(rng() * enemyTypes.length)];
            enemies.push({ x: ex, y: ey, type: eType });
            placed++;
          }
        }
      }

      // ------ Step 6: Place 1-2 chests ------
      var chestCount = rng() < 0.6 ? 1 : 2;
      for (var c = 0; c < chestCount; c++) {
        placeAttempts = 0;
        while (placeAttempts < 50) {
          placeAttempts++;
          var chX = rngInt(0, GRID_SIZE - 1);
          var chY = rngInt(0, GRID_SIZE - 1);
          if (grid[chY][chX] === CELL.CORRIDOR || grid[chY][chX] === CELL.ROOM) {
            grid[chY][chX] = CELL.CHEST;
            // Generate chest contents based on floor
            var goldAmount = rngInt(5, 15) + floorNum * 3;
            var contents = { gold: goldAmount };
            if (rng() < 0.3) contents.potion = true;
            if (rng() < 0.15) contents.scroll = true;
            chests.push({ x: chX, y: chY, contents: contents });
            break;
          }
        }
      }

      // ------ Step 7: Place 0-1 NPC ------
      if (rng() < 0.4 + floorNum * 0.05) {
        placeAttempts = 0;
        while (placeAttempts < 30) {
          placeAttempts++;
          var npcX = rngInt(0, GRID_SIZE - 1);
          var npcY = rngInt(0, GRID_SIZE - 1);
          if (grid[npcY][npcX] === CELL.CORRIDOR || grid[npcY][npcX] === CELL.ROOM) {
            grid[npcY][npcX] = CELL.NPC;
            var npcTypes = ['lost_adventurer', 'wounded_soldier', 'mad_wizard', 'ghost', 'prisoner'];
            npc = { x: npcX, y: npcY, type: npcTypes[Math.floor(rng() * npcTypes.length)] };
            break;
          }
        }
      }

      // ------ Step 8: Place locked doors + keys ------
      var lockCount = Math.min(floorNum, 2);
      for (var l = 0; l < lockCount; l++) {
        // Place locked door
        placeAttempts = 0;
        var doorPlaced = false;
        while (placeAttempts < 30) {
          placeAttempts++;
          var dx = rngInt(1, GRID_SIZE - 2);
          var dy = rngInt(1, GRID_SIZE - 2);
          if (grid[dy][dx] === CELL.CORRIDOR) {
            // Check that door has walkable neighbors on at least 2 sides
            var walkableNeighbors = 0;
            if (dy > 0 && grid[dy - 1][dx] !== CELL.EMPTY) walkableNeighbors++;
            if (dy < GRID_SIZE - 1 && grid[dy + 1][dx] !== CELL.EMPTY) walkableNeighbors++;
            if (dx > 0 && grid[dy][dx - 1] !== CELL.EMPTY) walkableNeighbors++;
            if (dx < GRID_SIZE - 1 && grid[dy][dx + 1] !== CELL.EMPTY) walkableNeighbors++;
            if (walkableNeighbors >= 2) {
              grid[dy][dx] = CELL.LOCKED_DOOR;
              lockedDoors.push({ x: dx, y: dy });
              doorPlaced = true;
              break;
            }
          }
        }

        // Place corresponding key on accessible side of the door
        if (doorPlaced) {
          placeAttempts = 0;
          while (placeAttempts < 30) {
            placeAttempts++;
            var kx = rngInt(0, GRID_SIZE - 1);
            var ky = rngInt(0, GRID_SIZE - 1);
            if (grid[ky][kx] === CELL.CORRIDOR || grid[ky][kx] === CELL.ROOM) {
              grid[ky][kx] = CELL.KEY;
              keys.push({ x: kx, y: ky });
              break;
            }
          }
        }
      }

      // ------ Step 9: Place traps (density increases with floor) ------
      var trapCount = Math.floor(floorNum * 1.5);
      var trapTypes = ['spike', 'pit', 'dart', 'gas', 'collapse'];
      for (var t = 0; t < trapCount; t++) {
        placeAttempts = 0;
        while (placeAttempts < 30) {
          placeAttempts++;
          var tx = rngInt(0, GRID_SIZE - 1);
          var ty = rngInt(0, GRID_SIZE - 1);
          if (grid[ty][tx] === CELL.CORRIDOR) {
            var distFromStairs = Math.abs(tx - stairsUp.x) + Math.abs(ty - stairsUp.y);
            if (distFromStairs >= 2) {
              grid[ty][tx] = CELL.TRAP;
              traps.push({ x: tx, y: ty, type: trapTypes[Math.floor(rng() * trapTypes.length)] });
              break;
            }
          }
        }
      }

      // ------ Step 10: Place 0-1 shrine ------
      if (rng() < 0.35 + floorNum * 0.05) {
        placeAttempts = 0;
        while (placeAttempts < 30) {
          placeAttempts++;
          var shX = rngInt(0, GRID_SIZE - 1);
          var shY = rngInt(0, GRID_SIZE - 1);
          if (grid[shY][shX] === CELL.CORRIDOR || grid[shY][shX] === CELL.ROOM) {
            grid[shY][shX] = CELL.SHRINE;
            shrine = {
              x: shX,
              y: shY,
              effect: this.getShrineEffect(baseSeed, dungeonId, floorNum)
            };
            break;
          }
        }
      }

      // ------ Step 11: Place 1-2 wall markings on walkable cells ------
      var markingData = this.getWallMarkings(baseSeed, dungeonId, floorNum);
      for (var m = 0; m < markingData.length; m++) {
        placeAttempts = 0;
        while (placeAttempts < 30) {
          placeAttempts++;
          var mx = rngInt(0, GRID_SIZE - 1);
          var my = rngInt(0, GRID_SIZE - 1);
          if (grid[my][mx] === CELL.CORRIDOR) {
            grid[my][mx] = CELL.MARKING;
            markings.push({
              x: mx, y: my,
              text: markingData[m].text,
              style: markingData[m].style
            });
            break;
          }
        }
      }

      // ------ Ensure connectivity: fill any remaining EMPTY with CORRIDOR ------
      // This guarantees no unreachable areas
      for (var fy = 0; fy < GRID_SIZE; fy++) {
        for (var fx = 0; fx < GRID_SIZE; fx++) {
          if (grid[fy][fx] === CELL.EMPTY) {
            // Check if adjacent to any walkable cell
            var adjWalkable = false;
            if (fy > 0 && grid[fy - 1][fx] !== CELL.EMPTY) adjWalkable = true;
            if (fy < GRID_SIZE - 1 && grid[fy + 1][fx] !== CELL.EMPTY) adjWalkable = true;
            if (fx > 0 && grid[fy][fx - 1] !== CELL.EMPTY) adjWalkable = true;
            if (fx < GRID_SIZE - 1 && grid[fy][fx + 1] !== CELL.EMPTY) adjWalkable = true;
            if (adjWalkable) {
              grid[fy][fx] = CELL.OBSTACLE;
            } else {
              grid[fy][fx] = CELL.CORRIDOR; // make it walkable to ensure connectivity
            }
          }
        }
      }

      return {
        grid: grid,
        stairsUp: stairsUp,
        stairsDown: stairsDown,
        enemies: enemies,
        chests: chests,
        npc: npc,
        traps: traps,
        shrine: shrine,
        keys: keys,
        lockedDoors: lockedDoors,
        markings: markings,
        dungeonId: dungeonId,
        floorNum: floorNum,
        seed: floorSeed
      };
    },

    // ----------------------------------------------------------
    // getDungeonById: lookup dungeon data by id string
    // ----------------------------------------------------------
    getDungeonById: function(dungeonId) {
      for (var i = 0; i < DUNGEON_POOL.length; i++) {
        if (DUNGEON_POOL[i].id === dungeonId) {
          return JSON.parse(JSON.stringify(DUNGEON_POOL[i]));
        }
      }
      return null;
    },

    // ----------------------------------------------------------
    // getFloorCount: number of floors for a given dungeon
    // ----------------------------------------------------------
    getFloorCount: function(dungeonId) {
      var d = this.getDungeonById(dungeonId);
      return d ? d.floors : 3;
    }
  };

  // ----------------------------------------------------------
  // DX_MERCHANT public API
  // ----------------------------------------------------------
  var merchant = {

    // Reference to the item catalog
    ITEM_CATALOG: ITEM_CATALOG,

    // ----------------------------------------------------------
    // getShopInventory: returns today's available items
    //   dailySeed: today's seed from DX_SEED.getSeed()
    //   playerClass: 'Fighter', 'Ranger', 'Mage', 'Cleric'
    //
    // Returns array of item objects from ITEM_CATALOG with
    //   an added 'available' count.
    // ----------------------------------------------------------
    getShopInventory: function(dailySeed, playerClass) {
      var merchantSeed = seed.getMerchantSeed(dailySeed);
      var inventory = [];
      var idx = 0;

      // --- All consumables are always available ---
      for (var i = 0; i < CONSUMABLE_IDS.length; i++) {
        var item = JSON.parse(JSON.stringify(ITEM_CATALOG[CONSUMABLE_IDS[i]]));
        item.available = item.maxStack;
        inventory.push(item);
      }

      // --- 1-2 scrolls, seeded ---
      var scrollCount = seed.seededRandom(merchantSeed, idx++) < 0.5 ? 1 : 2;
      var scrollOrder = seed.seededShuffle(merchantSeed, 200, SCROLL_IDS);
      for (var s = 0; s < scrollCount; s++) {
        var scrollItem = JSON.parse(JSON.stringify(ITEM_CATALOG[scrollOrder[s]]));
        scrollItem.available = 1;
        inventory.push(scrollItem);
      }

      // --- 1-2 gear, class-filtered, seeded ---
      var gearCount = seed.seededRandom(merchantSeed, idx++) < 0.5 ? 1 : 2;

      // Filter gear: include items that match player class or have no restriction
      var classGear = [];
      for (var g = 0; g < GEAR_IDS.length; g++) {
        var gearDef = ITEM_CATALOG[GEAR_IDS[g]];
        if (!gearDef.classRestriction || gearDef.classRestriction === playerClass) {
          classGear.push(GEAR_IDS[g]);
        }
      }

      var gearOrder = seed.seededShuffle(merchantSeed, 300, classGear);
      for (var gi = 0; gi < gearCount && gi < gearOrder.length; gi++) {
        var gearItem = JSON.parse(JSON.stringify(ITEM_CATALOG[gearOrder[gi]]));
        gearItem.available = 1;
        inventory.push(gearItem);
      }

      return inventory;
    },

    // ----------------------------------------------------------
    // getPrice: returns CHA-adjusted price for an item
    //   itemId: string ID from ITEM_CATALOG
    //   chaMod: CHA modifier ( Math.floor((cha - 10) / 2) )
    //
    // Formula: price = baseCost * (1 - (chaMod * 0.05))
    //   CHA 18 (+4 mod) = 20% discount
    //   CHA 8 (-1 mod) = 5% markup
    //   Minimum price: 1 gold
    // ----------------------------------------------------------
    getPrice: function(itemId, chaMod) {
      var item = ITEM_CATALOG[itemId];
      if (!item) return 0;
      chaMod = chaMod || 0;
      var multiplier = 1 - (chaMod * 0.05);
      var price = Math.max(1, Math.round(item.baseCost * multiplier));
      return price;
    },

    // ----------------------------------------------------------
    // getSellPrice: returns sell-back price (40% of base)
    // ----------------------------------------------------------
    getSellPrice: function(itemId) {
      var item = ITEM_CATALOG[itemId];
      if (!item) return 0;
      return Math.max(1, Math.floor(item.baseCost * 0.4));
    },

    // ----------------------------------------------------------
    // buyItem: attempt to purchase an item
    //   itemId: string ID
    //   player: reference to PLAYER object (needs .gold, .cha, .inventory)
    //
    // Returns:
    //   { success: true, message: '...', item: {...} } or
    //   { success: false, message: '...' }
    // ----------------------------------------------------------
    buyItem: function(itemId, player) {
      var item = ITEM_CATALOG[itemId];
      if (!item) {
        return { success: false, message: "I don't carry that." };
      }

      var chaMod = Math.floor((player.cha - 10) / 2);
      var price = this.getPrice(itemId, chaMod);

      // Check gold
      if ((player.gold || 0) < price) {
        return {
          success: false,
          message: this.getMerchantLine('broke'),
          price: price
        };
      }

      // Check stack limit in player inventory
      var currentCount = 0;
      if (player.inventory) {
        for (var i = 0; i < player.inventory.length; i++) {
          if (player.inventory[i].id === itemId) {
            currentCount++;
          }
        }
      }
      if (currentCount >= item.maxStack) {
        return {
          success: false,
          message: "Ye're carrying all ye can of those. No more room.",
          price: price
        };
      }

      // Deduct gold, add item
      player.gold = (player.gold || 0) - price;
      if (!player.inventory) player.inventory = [];

      // Create inventory entry
      var invItem = {
        id: item.id,
        name: item.name,
        type: item.type,
        subtype: item.subtype || item.type,
        letter: item.letter,
        color: item.color,
        effect: JSON.parse(JSON.stringify(item.effect)),
        description: item.description
      };

      // Add class restriction info if relevant
      if (item.classRestriction) {
        invItem.classRestriction = item.classRestriction;
      }

      player.inventory.push(invItem);

      return {
        success: true,
        message: this.getMerchantLine('buy'),
        item: invItem,
        price: price
      };
    },

    // ----------------------------------------------------------
    // sellItem: sell an item back at 40% value
    //   itemId: string ID of item to sell
    //   player: reference to PLAYER object
    //   inventoryIndex: index in player.inventory to remove
    //
    // Returns:
    //   { success: true, message: '...', goldReceived: N } or
    //   { success: false, message: '...' }
    // ----------------------------------------------------------
    sellItem: function(itemId, player, inventoryIndex) {
      if (!player.inventory || inventoryIndex < 0 || inventoryIndex >= player.inventory.length) {
        return { success: false, message: "Nothing to sell." };
      }

      var invItem = player.inventory[inventoryIndex];
      if (invItem.id !== itemId) {
        return { success: false, message: "That item doesn't match." };
      }

      var sellPrice = this.getSellPrice(itemId);

      // Remove from inventory and add gold

    _showWhisper: function() {

      var self = this;

      // Destroy previous text if still lingering
      if (this._currentText) {
        this._currentText.destroy();
        this._currentText = null;
      }

      // Pick random edge position
      var edge = EDGE_POSITIONS[Math.floor(Math.random() * EDGE_POSITIONS.length)];

      // Add slight random offset to prevent repetitive placement
      var offsetX = (Math.random() - 0.5) * 200;
      var offsetY = (Math.random() - 0.5) * 80;
      var posX = edge.x + offsetX;
      var posY = edge.y + offsetY;

      // Clamp to screen bounds

      posY = Math.max(10, Math.min(590, posY));

      // Generate whisper text

      // Determine max width based on edge
      var maxWidth = 350;
      if (edge.name === 'left' || edge.name === 'right') {
        maxWidth = 250;
      }

        fontFamily: 'monospace',
        fontStyle: 'italic',
        color: '#c8b48c',       // parchment gold rgb(200, 180, 140)
        wordWrap: { width: maxWidth },

      });

      text.setOrigin(edge.anchorX, edge.anchorY);
      text.setAlpha(0);
      text.setDepth(1000); // On top of everything

      this._currentText = text;

        targets: text,
        alpha: { from: 0, to: 0.6 },
        duration: 2000,
        ease: 'Sine.easeIn',

            scene.tweens.add({
              targets: text,
              alpha: { from: 0.6, to: 0 },
              duration: 2000,
              ease: 'Sine.easeOut',
              onComplete: function() {
                if (text && text.scene) {
                  text.destroy();
                }
                if (self._currentText === text) {
                  self._currentText = null;
                }
              }
            });
          });
        }
      });

      // Schedule next whisper (15-30 seconds from now)
      if (this._active && scene && scene.time) {
        var delay = this._minInterval + Math.random() * (this._maxInterval - this._minInterval);
        this._timer = scene.time.delayedCall(delay, function() {
          self._showWhisper();
        });
      }
    },

    // setInterval: adjust whisper frequency (min/max in ms)
    // ----------------------------------------------------------

      this._maxInterval = max || 30000;

    // ----------------------------------------------------------

        this._meta = metaOverride;
      }
      if (this._scene && this._meta) {
        this._showWhisper();
      }
    }
  };

          fragments_5_6: [
            "Five! FIVE! I need more ale. I need — listen. When I went into the Warrens, I was brave. Stupidly brave. I kicked open doors. I laughed at goblins. Then I saw what was on the third floor and I stopped laughing. I have not laughed about dungeons since. Until now. Five fragments. That is something worth laughing about.",
            "Six fragments. You are not just an adventurer anymore. You are something else. I do not have a word for it. Aldric does not have a word for it. Even Elden does not have a word for it, and he has three hundred years of vocabulary.",
            "You remind me of Joren. Not in how you fight. In how you look when you come back. Like you left something behind and you know you have to go back for it."
          ],
          fragments_7_8: [
            "Seven fragments. I do not joke about this. I want to, but I cannot. Something has changed. The tavern feels different. The air tastes different. You are carrying something that was not meant to be carried.",
            "Eight. I am frightened for you. I am not good at being frightened for other people. I am good at punching things and drinking and telling stories. But this — this is bigger than punching.",
            "I dreamed about the Warrens last night. First time in years. Something was calling from the third floor. Something that sounded like Joren. But Joren is dead. Joren has been dead for years."
          ],
          fragments_9: [
            "Nine. You are going to Aldenmere. The place from the stories. The place I thought was a fairy tale told to sell maps. I — I want to give you something. It is not much. It is a dagger. It was Joren's. I found it on the first floor of the Warrens, in a pile of goblin scrap. They did not know what it was worth. I did.",
            "Come back. Do you hear me? I need you to come back. I cannot go in there with you. My leg will not allow it. My courage will not allow it. But I need someone to come back from a dungeon for once."
          ]
        },

        combat_tips: [
          "The Crypt Crawlers are slow. Fire finishes them fast. But the Shadow Lurkers — those you need to watch. They resist ice and they are faster than they look.",
          "The Bone Revenant on Floor Two hits like a collapsing wall. Sixteen armor class. Holy damage works. Fire does not — they already burned once.",
          "Goblins fight in packs. Kill the shaman first. Always kill the shaman first. The scrapper are annoying but the shaman is the one that makes you lose.",
          "The Vault Warden has a shield. Destroy the shield first or you are fighting a wall. Fire works on the shield. Then the real fight begins.",
          "The Frost Wraith — do not let it get close. Its touch is cold. Not winter-cold. Forgetting-cold. Like your muscles forget how to move."
        ],

        idle: [
          "I tell the good stories loud. The bad ones — I keep those quiet. You learn which is which after enough dungeons.",
          "This limp saved my life. I cannot go back in, so I am still alive. The dungeon gave me a limp and a lifetime. Fair trade.",
          "HA! Did I tell you about the goblin that threw a cooking pot at me? Twelve damage from a cooking pot. I still have the dent in my shield. And my skull.",
          "Some nights I wake up and I can hear goblin laughter. Then I remember I am in the tavern and the laughter is Aldric doing inventory. Similar sounds."
        ]
      },

      // --------------------------------------------------------
      // BESSA — The Fence / Merchant
      // Sharp, streetwise. Values competence, dismisses fools.
      // Pragmatic. Knows product quality. Fair, not generous.
      // --------------------------------------------------------
      bessa: {
        greeting: {
          first_visit: [
            "Browsing or buying? I do not do browsing. My time is worth money. Your time should be worth money. If it is not, fix that before you go underground.",
            "Bessa. Supplies. I will give you fair value. Not generous value. Fair. If you want generous, find a charity. If you want to survive, find me.",
            "New to the Flagon? I run the supply corner. Torches, potions, arrows, food. Everything costs what it costs. I do not negotiate. The dungeon does not negotiate either."
          ],
          fragments_0: [
            "No fragments. That means you are either new or cautious. New I can help. Cautious — you are already helping yourself. What do you need?",
            "I sell what keeps you alive. Torches because the dark is not your friend. Potions because the creatures are not your friend. Food because starvation is no way to die underground.",
            "Most adventurers buy too many weapons and not enough torches. The weapon you have is fine. The darkness is what will kill you."
          ],
          fragments_1_2: [
            "One fragment and you are still shopping. Good. The ones who stop shopping are the ones who stop breathing.",
            "Two fragments. I will not raise my prices. That would be predatory. I will, however, suggest you buy more potions. The dungeons get harder and your body does not get tougher fast enough.",
            "A fragment-hunter. Business has been better since you started coming back alive. Other adventurers see you and think they can do it too. They buy supplies. Most of them die. But they buy supplies first."
          ],
          fragments_3_4: [
            "Three. I have rare stock today. It costs more because it is rare. That is how rarity works.",
            "Four fragments and I am starting to take you seriously. I take very few people seriously. Buy something worthy of the compliment.",
            "You are my best customer. Not because you spend the most. Because you come back to spend more. Repeat business. That is what I respect.",
            "I acquired something you might want. I will not say where I acquired it. I will say it works."
          ],
          fragments_5_6: [
            "Five fragments. I have been holding something for someone worthy. I believe that person is you. It will cost you, but it is worth what it costs.",
            "Six. I do not give speeches. I sell goods. But if I were the speech-giving type, I would say this: whatever you are doing, do not stop. You are changing the mathematics of this place.",
            "Half the Sunstone. I have adjusted my inventory accordingly. You need better equipment now. I have better equipment. The prices reflect the quality."
          ],
          fragments_7_8: [
            "Seven. I have things you cannot buy anywhere else. I have things I should not have. You need them. I have them. That is the beginning and end of the negotiation.",
            "Eight fragments and I am selling you supplies that I do not fully understand. The smith in the back alley made this blade from metal he found near the dungeon entrance. It hums. I do not ask questions. I set prices.",
            "I do not frighten easily. But the things you need for where you are going — they frighten me. Not the items. The fact that they are necessary."
          ],
          fragments_9: [
            "Nine. This is everything I have. Take it. All of it. No — I am not being generous. I am being practical. If you fail, none of this inventory matters. If you succeed, I will rebuild. Either way, you need it more than I do.",
            "The last dungeon. I have prepared a kit. It contains everything I would bring if I were the kind of person who went underground. I am not. But you are. Take it."
          ]
        },

        shop_lines: [
          "Torches. Two copper each. Buy four. You think you need two. You need four.",
          "Health potions. Ten gold. They taste terrible. They work perfectly. Priorities.",
          "Iron keys. Fifteen gold. I do not ask where they were made and you should not ask where I got them.",
          "Arrows. One gold per five. Cheap because they break. Buy more than you think you need.",
          "That sword is serviceable. Not elegant. Not magic. It cuts things. Sometimes that is enough."
        ],

        appraisal: [
          "Let me see that. Hmm. The craftsmanship is adequate. I will give you fair value. Seven gold.",
          "Goblin-crafted. I can tell by the smell. Functional but crude. Five gold and I am being generous.",
          "This is Aureate work. Three thousand years old and still sharp. One hundred gold and I am underpaying.",
          "Cursed. I can tell by the way it sits in your hand — like it does not want to let go. I do not buy cursed goods. Get rid of it yourself."
        ],

        idle: [
          "I am not here to chat. I am here to sell. If you are not buying, move along. The inventory does not admire itself.",
          "Quality speaks for itself. So do I. Briefly.",
          "Every item in my corner has been tested. Not by me. By the people who sold it to me. Some of them are dead, but the products held up.",
          "I respect competence. Buy what you need, use it well, and come back for more. That is the only relationship I value."
        ]
      }
    },

          { text: "FIRE ALONE WILL NOT SAVE YOU HERE", type: "warning" },

          { text: "DO NOT OPEN THE SARCOPHAGI. I opened the sarcophagi. I should not have opened the sarcophagi.", type: "graffiti" },
          { text: "The Vault Warden does not die. It waits.", type: "warning" },

          { text: "The Warden's shield consumes fire. But fire consumes the shield first. Strike fast.", type: "hint" },
          { text: "Joren Vane. Floor 3. He didn't make it out.", type: "graffiti" },
          { text: "the air is older down here. the stone remembers a time before the Circle. before the Sunstone. what was here before?", type: "graffiti" },
          { text: "THE FIRST LIGHT THAT EVER FELL ON THIS WORLD RESTS BEHIND THIS STONE", type: "lore" },
          { text: "The Warden knelt when the fragment was placed. It has been kneeling for three thousand years. Do not mistake patience for mercy.", type: "warning" }

          { text: "HUMANZ GO HOME — signed, Gretchka", type: "graffiti" },
          { text: "The goblins built on top of older ruins. The stairs down do not match goblin architecture. Someone was here before them.", type: "lore" },
          { text: "Rope bridges. The goblins cut them when cornered. Cut them first.", type: "hint" },
          { text: "The Chief's Favorite is loud. Follow the sound. Or avoid it. Both are strategies.", type: "hint" },
          { text: "They stole everything in this room from adventurers. The swords. The shields. The bones. The goblins do not distinguish between loot and remains.", type: "lore" },
          { text: "KEEP OUT — WE FOUND IT FIRST — IT IS OURS — THE PRETTY ROCK IS OURS", type: "graffiti" },

        floor2: [
          { text: "Gretchka has dens. Three of them. Destroy the dens or she summons endlessly. The dens smell like old mushrooms.", type: "hint" },

          { text: "I came looking for my sibling. I found this instead. Whoever reads this — tell Orin I am sorry. — J.V.", type: "graffiti" },

          { text: "Three valves. Wrong order floods everything. Right order: read the instruction plate in the first room.", type: "hint" },
          { text: "the mimics look like chests. they do not look like mimics. that is the entire problem. trust your instincts. — a survivor", type: "graffiti" },
          { text: "Iron golems hate stone spells. They are made of what opposes them. The rust is your ally.", type: "hint" },
          { text: "The Drowned were people once. The water preserved their bodies but not their minds. What walks down here does not remember being human.", type: "lore" }

          { text: "The Fragment of Storm crackles even underwater. The fish avoid it. So should anything made of metal.", type: "lore" },

      ember_depths: {

          { text: "The heat kills before the creatures do. Fire resistance is not optional here. It is arithmetic.", type: "warning" },
          { text: "Ember Hounds burn on death. Do not stand close when they fall.", type: "hint" },
          { text: "The Flame Salamanders maintain distance. Close the gap or die at range. Your choice.", type: "hint" },
          { text: "something lives in the lava. not in the caves. IN the lava. I saw it move.", type: "graffiti" }
        ],
        floor2: [
          { text: "The Furnace Warden is immune to fire. Ice creates steam — halved visibility, enemy confusion. Use it.", type: "hint" },
          { text: "The collapsed bridge can be crossed. Wind and stone create a column. Or throw a block. Or shoot a rope.", type: "hint" },
          { text: "The Fragment of Flame was not placed here. It landed here during the Fracture and set everything within a mile on fire. The fire has never gone out.", type: "lore" },
          { text: "THIS IS NOT A DUNGEON. THIS IS A FURNACE THAT FORGOT TO STOP.", type: "graffiti" }
        ],
        floor3: [
          { text: "IGNIS SLEEPS. DO NOT WAKE IGNIS. I WOKE IGNIS. I REGRET WAKING IGNIS.", type: "warning" },
          { text: "The wyrm opens lava vents when wounded. Wind and stone can seal them. Seal them or drown in fire.", type: "hint" },

      frozen_abyss: {

          { text: "The ice is clear enough to see through. Not everything on the other side is dead. Not everything on the other side should be thawed.", type: "warning" },
          { text: "Spiked boots prevent sliding. The ice floor does not forgive bare feet. Or pride.", type: "hint" },
          { text: "Ice sprites are incorporeal. Half your physical attacks will pass through them. Magic works. Patience works better.", type: "hint" },
          { text: "the cold does not hate. it does not love. it simply waits. and it waits forever. — Cassius", type: "graffiti" }
        ],
        floor2: [
          { text: "A man in Aureate robes is frozen in the east wall. He has been there for three thousand years. He is not dead. Fire will thaw him. Whether you should is another question.", type: "lore" },
          { text: "The Glacial Bear freezes the floor with its body heat. It is too cold to be warm. That sentence makes sense here.", type: "hint" },
          { text: "Cassius Aldenmere. The last name. The last scholar. He chose the ice because the ice preserves. He chose correctly.", type: "lore" }
        ],
        floor3: [
          { text: "THE WARDEN OF THE ABYSS HAS BEEN HERE SINCE THE FRACTURE. IT DID NOT CHOOSE TO BE HERE. IT CHOSE TO STAY.", type: "lore" },
          { text: "Fire and Wind together create the Inferno Gust. It melts ice walls. It opens paths. It reminds the cold that fire was here first.", type: "hint" },
          { text: "The Fragment of Frost dropped the temperature of the vault by four degrees the moment the Ranger picked it up. It has been that cold ever since.", type: "lore" }

      shattered_halls: {

          { text: "Pull the lever. Something opens. Something else closes. Something you did not expect floods. Welcome to dwarven engineering.", type: "warning" },
          { text: "Gear Spiders use web. The web burns. Fire is the universal solvent in the Shattered Halls.", type: "hint" },
          { text: "the trolls regenerate. fire stops it. acid stops it. everything else is buying time.", type: "graffiti" },

        floor2: [
          { text: "Six mechanisms. One sequence. The clues are on the walls if you know how to read them. Every class reads differently.", type: "hint" },
          { text: "Second-order effects. Every lever does two things. One you see. One you discover.", type: "warning" },
          { text: "The Forgemaster did not die. He fused. The line between engineer and engine blurred three thousand years ago. It has not cleared since.", type: "lore" }
        ],
        floor3: [
          { text: "THE FORGEMASTER'S LEGACY RUNS ON STEAM AND SPITE. DISABLE THE VALVES. THERE ARE FOUR.", type: "hint" },
          { text: "The Fragment of Stone is impossibly heavy. A Ranger could not lift it. A Mage solved the problem with Wind. Every problem has more than one door.", type: "lore" },

        floor3: [

      void_chambers: {

          { text: "Reality is a suggestion here. The walls shift. The floor lies. Trust your compass. Do not trust your eyes.", type: "warning" },
          { text: "Shadow creatures Phase between turns. Physical attacks miss during Phase. Spells connect. Time your strikes.", type: "hint" },
          { text: "the Shadow Clone mirrors your actions. it does what you did last turn. change your pattern or fight yourself forever.", type: "graffiti" }

        ],

          { text: "The automata maintain order. They have maintained order for three thousand years. Do not disrupt order unless you are prepared for judgment.", type: "warning" },
          { text: "Judgment points accumulate. Loot costs 5. Attacking neutral automata costs 10. Breaking wards costs 15. At 25, they come for you.", type: "hint" },
          { text: "This place was built by the Circle to protect something. Not the fragment. Something older. Something the Circle built the fragment to contain.", type: "lore" },
          { text: "The Cleric feels at home here. The sanctum recognizes faith. Judgment accumulates slower for those who believe.", type: "hint" }

        floor2: [

        ]

          { text: "Aldenmere. The name still echoes. The city still stands, partially. The darkness at its center has not moved in three thousand years. It does not need to move. It is already everywhere.", type: "lore" },
          { text: "The dungeon adapts to your class. Fighter: combat corridors. Mage: spell puzzles. Ranger: traps and navigation. Cleric: divine trials. It knows you.", type: "warning" },

        ],

    getLine: function(category, subcategory, replacements) {
      var lines;
      if (subcategory) {
        if (typeof subcategory !== 'string') subcategory = String(subcategory);
        var parts = subcategory.split('.');
        lines = this[category];
        for (var i = 0; i < parts.length; i++) {
          if (lines) lines = lines[parts[i]];
        }
      } else {
        lines = this[category];
      }

      if (!lines) return '';
      if (typeof lines === 'string') {
        var result = lines;
        if (replacements) {
          for (var key in replacements) {
            result = result.replace(new RegExp('\\{' + key + '\\}', 'g'), replacements[key]);
          }
        }
        return result;
      }
      if (!Array.isArray(lines)) return '';

      var line = lines[Math.floor(Math.random() * lines.length)];
      if (replacements) {
        for (var key in replacements) {
          line = line.replace(new RegExp('\\{' + key + '\\}', 'g'), replacements[key]);
        }
      }
      return line;

            result.hints.push('Darkness empowers this creature!');
          }
          // Sunburst devastation
          if (isSunburst && entry.sunburstVulnerable) {
            var sbDmg = entry.sunburstDamage ? rollMultiple(entry.sunburstDamage.rolls, entry.sunburstDamage.dice) : 0;
            result.sunburstDamage = sbDmg;
            result.stunned = true;
            result.stunnedTurns = entry.sunburstStun || 1;
            result.hints.push('SUNBURST! The creature recoils in agony! ' + sbDmg + ' radiant damage!');
          }
          break;

        case 'light_neutral':
          // No modifiers from light
          break;

        case 'sound_hunter':
          result.hints.push(entry.description || 'This creature hunts by sound.');
          break;

        case 'light_scatter':
          if (isSunburst && entry.fleeOnSunburst) {
            result.flees = true;
            result.hints.push('The creature flees from the blinding light!');
          }
          if (isDark && entry.darknessAggro) {
            result.attackMod = entry.darknessAttackBonus || 2;
            result.hints.push('The creature is emboldened by darkness!');
          }
          break;

        case 'light_cautious':
          if (isBright) {
            result.attackMod = entry.lightAttackPenalty || 0;
            result.hints.push('The creature fights cautiously in the light.');
          } else if (isDark) {
            result.attackMod = entry.darkAttackBonus || 0;
            result.hints.push('Darkness makes this creature bolder!');
          }
          break;

        case 'light_immune':
          result.hints.push(entry.description || 'Light level has no effect on this creature.');

    },

    /**
     * Apply sunburst combat effects to an enemy.

    applySunburstCombat: function(enemyType) {

    /**

    resetFirstSight: function() {

    // ========================================================
    // FIREBALL SCOUT

    /**

     * @returns {object} { success, revealedTiles[], revealedEnemies[], messages[], manaCost }
     */
    fireballScout: function(direction) {
      var SCOUT_MANA_COST = 5;
      var SCOUT_RANGE = 4;

      if (typeof PLAYER === 'undefined') {
        return { success: false, message: 'No player context.' };
      }

      if (PLAYER.class !== 'Mage') {
        return { success: false, message: 'Only a Mage can scout with Fireball.' };
      }

      if (PLAYER.mana < SCOUT_MANA_COST) {
        return { success: false, message: 'Not enough mana. Fireball Scout costs ' + SCOUT_MANA_COST + ' MP.' };
      }

      PLAYER.mana -= SCOUT_MANA_COST;

      if (direction === undefined || direction === null) {
        direction = PLAYER.dir;
      }

      var dx = [0, 1, 0, -1]; // N, E, S, W
      var dy = [-1, 0, 1, 0];

      var revealedTiles = [];
      var revealedEnemies = [];
      var messages = ['You hurl a Fireball down the corridor!'];

      var cx = PLAYER.x;
      var cy = PLAYER.y;

      for (var i = 1; i <= SCOUT_RANGE; i++) {
        var nx = cx + dx[direction] * i;
        var ny = cy + dy[direction] * i;

        // Bounds check
        if (typeof GAME !== 'undefined' && GAME.currentMap) {
          if (nx < 0 || nx >= GAME.mapWidth || ny < 0 || ny >= GAME.mapHeight) break;
          var tile = GAME.currentMap[ny][nx];
          if (tile === 1) break; // Hit a wall
          if (tile === 2 || tile === 3) break; // Hit a door

          revealedTiles.push({ x: nx, y: ny, tile: tile });
        }

        // Check for enemies
        if (typeof getEncounterAt === 'function') {
          var enc = getEncounterAt(nx, ny);
          if (enc) {
            revealedEnemies.push({
              x: nx, y: ny,
              enemy: enc.enemy,
              name: (typeof ENEMIES !== 'undefined' && ENEMIES[enc.enemy]) ? ENEMIES[enc.enemy].name : enc.enemy
            });
            // Enemy is now aware
            messages.push('The fireball reveals a ' + ((typeof ENEMIES !== 'undefined' && ENEMIES[enc.enemy]) ? ENEMIES[enc.enemy].name : enc.enemy) + '!');
            messages.push('It has spotted you!');
          }
        }
      }

      if (revealedTiles.length === 0) {
        messages.push('The fireball splashes against the wall. Nothing ahead.');
      } else if (revealedEnemies.length === 0) {
        messages.push('The corridor ahead is clear for ' + revealedTiles.length + ' tiles.');
      }

      return {
        success: true,
        revealedTiles: revealedTiles,
        revealedEnemies: revealedEnemies,
        messages: messages,
        manaCost: SCOUT_MANA_COST,
        range: SCOUT_RANGE,

    canSolveObstacle: function(obstacleType) {

    solveObstacle: function(obstacleType) {

        case 'gas_cloud':

        case 'mechanism':

        case 'water':

        case 'fire_hazard':

      return {

    /**
     * Get all obstacles solvable with currently known combos.
     * Useful for UI hints.
     */
    getSolvableObstacles: function() {
      if (typeof PLAYER === 'undefined' || !PLAYER.knownCombos) return [];

      var solvable = [];
      for (var key in COMBINATIONS) {
        var combo = COMBINATIONS[key];
        if (PLAYER.knownCombos.indexOf(combo.name) === -1) continue;
        if (combo.utility && combo.utility.types) {
          combo.utility.types.forEach(function(type) {
            solvable.push({ type: type, comboName: combo.name, description: combo.utility.description });
          });
        }
      }
      return solvable;

    // ========================================================
    // NPC TEACHING
    // ========================================================

    /**
     * NPC teaches a specific combo to the player.

     * @param {string} npcName - 'Elden' or 'Mira'
     * @returns {object} { taught, comboName, messages[] }

    npcTeachCombo: function(npcName) {
      var comboName = null;
      var teachMessages = [];

      switch (npcName) {
        case 'Elden':
          comboName = 'Reveal';
          teachMessages = [
            '"Shadow and Light," Elden murmurs, tracing runes in the air.',
            '"Two forces that deny each other. But forced together..."',
            '"They reveal what neither could alone. Remember this."'
          ];
          break;
        case 'Mira':
          comboName = 'Frost Lock';
          teachMessages = [
            'Mira presses a frozen crystal into your palm.',
            '"Ice seeks stone. Stone holds ice. Together, they lock the world in place."',
            '"Use it wisely. Some things, once frozen, never thaw."'
          ];
          break;
        default:
          return { taught: false, comboName: null, messages: ['This person has nothing to teach you about magic.'] };
      }

      var alreadyKnown = this.isKnown(comboName);
      if (alreadyKnown) {
        return {
          taught: false,
          comboName: comboName,
          messages: ['"You already know ' + comboName + '. Go. Use it well."']
        };
      }

      this.learnCombo(comboName);
      teachMessages.push('You have learned ' + comboName + '!');

      return {
        taught: true,
        comboName: comboName,
        messages: teachMessages
      };
    },

    // ========================================================
    // COMBAT INTEGRATION HELPERS
    // ========================================================

    /**
     * Get the effective enemy stats after light modifiers.
     * Returns a modified copy — does NOT mutate the original enemy.
     *
     * @param {string} enemyType
     * @param {object} enemy - the enemy instance from combat
     * @returns {object} { modifiedEnemy, messages[] }
     */
    applyLightModsToEnemy: function(enemyType, enemy) {
      var mods = this.getCreatureModifiers(enemyType);
      var modifiedEnemy = {};
      for (var k in enemy) {
        modifiedEnemy[k] = enemy[k];
      }

      var messages = [];

      // Apply AC modifier
      if (mods.acMod !== 0) {
        modifiedEnemy.ac = Math.max(1, enemy.ac + mods.acMod);
        if (mods.acMod < 0) {
          messages.push(enemy.name + ' AC reduced to ' + modifiedEnemy.ac + ' (light weakness).');
        } else {
          messages.push(enemy.name + ' AC increased to ' + modifiedEnemy.ac + ' (darkness bonus).');
        }
      }

      // Apply damage modifier
      if (mods.damageMod !== 0) {
        modifiedEnemy.damageBonus = Math.max(0, enemy.damageBonus + mods.damageMod);
      }

      // Apply attack modifier
      if (mods.attackMod !== 0) {
        modifiedEnemy.attackMod = enemy.attackMod + mods.attackMod;
      }

      // First sight text
      if (mods.firstSightText) {
        messages.unshift(mods.firstSightText);
      }

      // Add hints
      mods.hints.forEach(function(hint) {
        messages.push(hint);
      });

      return {
        modifiedEnemy: modifiedEnemy,
        messages: messages,
        stunned: mods.stunned,
        stunnedTurns: mods.stunnedTurns || 0,
        flees: mods.flees,
        sunburstDamage: mods.sunburstDamage || 0,
        noFirstStrike: mods.noFirstStrike || false
      };
    },

    // ========================================================
    // DOT (DAMAGE OVER TIME) TRACKER
    // ========================================================

    /**
     * Active DOT effects on the current enemy.
     * Managed by combat scene integration.
     */
    _activeDots: [],
    _activeFreeze: 0,    // Turns remaining where enemy cannot act

    _dodgeAllRounds: 0,  // Turns remaining where player dodges all attacks

    /**
     * Apply a DOT effect from a combo result.

    applyDot: function(dot) {
      if (dot && dot.rounds > 0) {

      }
    },

    /**
     * Apply freeze effect.

    applyFreeze: function(turns) {
      this._activeFreeze = Math.max(this._activeFreeze, turns);
    },

    /**
     * Apply slow effect.

    applySlow: function(turns) {
      this._activeSlow = Math.max(this._activeSlow, turns);
    },

    /**
     * Apply dodge-all effect.

    applyDodgeAll: function(rounds) {
      this._dodgeAllRounds = Math.max(this._dodgeAllRounds, rounds);

    /**
     * Process start of enemy turn. Returns:

    processEnemyTurnStart: function() {
      var messages = [];
      var dotDamage = 0;
      var canAct = true;
      var slowPenalty = 0;

      // Process DOTs
      var remainingDots = [];
      this._activeDots.forEach(function(dot) {
        dotDamage += dot.damagePerRound;
        messages.push('Burning! ' + dot.damagePerRound + ' fire damage.');
        dot.rounds--;
        if (dot.rounds > 0) remainingDots.push(dot);
      });
      this._activeDots = remainingDots;

      // Process freeze
      if (this._activeFreeze > 0) {
        canAct = false;
        messages.push('The enemy is FROZEN and cannot act!');
        this._activeFreeze--;
      }

      // Process slow
      if (this._activeSlow > 0) {
        slowPenalty = -2;
        messages.push('The enemy is SLOWED (-2 attack).');
        this._activeSlow--;
      }

      return {
        canAct: canAct,
        dotDamage: dotDamage,
        messages: messages,
        slowPenalty: slowPenalty
      };
    },

    /**
     * Check if player is in dodge-all mode.
     * Returns true if all attacks are dodged this round.
     */
    checkDodgeAll: function() {
      if (this._dodgeAllRounds > 0) {
        this._dodgeAllRounds--;
        return true;
      }
      return false;
    },

    /**
     * Reset all combat status effects (call at combat start/end).
     */
    resetCombatEffects: function() {
      this._activeDots = [];
      this._activeFreeze = 0;
      this._activeSlow = 0;
      this._dodgeAllRounds = 0;
    },

    // ========================================================
    // UI DATA: Element selector info for Phaser scene
    // ========================================================

    /**
     * Get element orb data for the combination UI.
     * Returns array of { name, color, x, y } for rendering 6 orbs.
     */
    getElementOrbLayout: function(centerX, centerY, radius) {
      centerX = centerX || 300;
      centerY = centerY || 250;
      radius = radius || 80;

      var orbs = [];
      for (var i = 0; i < ELEMENTS.length; i++) {
        var angle = (i / ELEMENTS.length) * Math.PI * 2 - Math.PI / 2; // Start from top
        orbs.push({
          name: ELEMENTS[i],
          color: ELEMENT_COLORS[ELEMENTS[i]],
          x: centerX + Math.cos(angle) * radius,
          y: centerY + Math.sin(angle) * radius,
          index: i

      }
      return orbs;
    },

    /**
     * Get the visual flash parameters for a combo or light spell.
     * Used by Phaser scene for screenFlash.
     */
    getSpellFlash: function(spellNameOrTier) {
      // Check combinations
      for (var key in COMBINATIONS) {
        if (COMBINATIONS[key].name === spellNameOrTier) {
          return { color: COMBINATIONS[key].color, alpha: 0.35, duration: 400 };
        }
      }
      // Check light spells
      if (LIGHT_SPELLS[spellNameOrTier]) {
        var ls = LIGHT_SPELLS[spellNameOrTier];
        switch (spellNameOrTier) {
          case 'sunburst':
            return { color: 0xffffff, alpha: 0.9, duration: 800 };
          case 'darkvision':
            return { color: 0x6633aa, alpha: 0.3, duration: 500 };
          case 'torchlight':
            return { color: 0xffaa44, alpha: 0.2, duration: 300 };
          case 'spark':
            return { color: 0xffdd88, alpha: 0.1, duration: 200 };
        }
      }
      // Fireball scout
      if (spellNameOrTier === 'fireball_scout') {
        return { color: 0xff6600, alpha: 0.4, duration: 2000 };
      }
      return { color: 0xffffff, alpha: 0.2, duration: 200 };
    },

    // ========================================================
    // VERSION & DEBUG
    // ========================================================

    VERSION: '1.0.0',

    /**
     * Debug: dump current state to console.
     */
    debugState: function() {
      console.log('=== DX_SPELLS Debug ===');
      console.log('Known Combos:', typeof PLAYER !== 'undefined' ? PLAYER.knownCombos : 'N/A');
      console.log('Active Light Spell:', _activeLightSpell);
      console.log('Current Light Level:', computeLightLevel());
      console.log('Active DOTs:', this._activeDots);
      console.log('Freeze turns:', this._activeFreeze);
      console.log('Slow turns:', this._activeSlow);
      console.log('Dodge-All rounds:', this._dodgeAllRounds);
      console.log('Darkvision Scrolls:', typeof PLAYER !== 'undefined' ? PLAYER.darkvisionScrolls : 'N/A');
      console.log('=======================');
    }
  };

})();

    NOTES.A3, NOTES.Bb3, NOTES.C4, NOTES.Db4, NOTES.E4,
    NOTES.Db4, NOTES.C4, NOTES.Bb3

  // Audio Manager

    ctx: null,
    masterGain: null,

    _dangerGain: null,

    // ----------------------------------------------------------

    // ----------------------------------------------------------

    _startAmbient: function() {

      filter.type = 'lowpass';
      filter.frequency.value = 80;
      filter.Q.value = 1;

      gain.gain.value = 0.05;

      source.connect(filter);
      filter.connect(gain);
      gain.connect(this.compressor);
      source.start(0);

      this._ambientNodes = { source: source, filter: filter, gain: gain };
    },

    _stopAmbient: function() {
      if (this._ambientNodes) {
        try { this._ambientNodes.source.stop(); } catch(e) {}
        this._ambientNodes = null;
      }
    },

    // ----------------------------------------------------------
    // Exploration melody: 8-bar minor pentatonic, 70 BPM
    // ----------------------------------------------------------
    _startExploration: function() {
      this._stopExploration();
      if (!this.ctx) return;

      var ctx = this.ctx;
      var self = this;
      var noteIndex = 0;
      var beatMs = Math.round(60000 / 70); // ~857ms per beat

      // Create a gain and filter for the melody
      var melodyGain = ctx.createGain();
      melodyGain.gain.value = 0.15 * self._currentVolMod;
      self._melodyGain = melodyGain;

      var melodyFilter = ctx.createBiquadFilter();
      melodyFilter.type = 'lowpass';
      melodyFilter.frequency.value = self._currentFilterFreq;
      self._melodyFilter = melodyFilter;

      melodyGain.connect(melodyFilter);
      melodyFilter.connect(self.compressor);

      var playNote = function() {
        if (!self.ctx || self.currentLayer !== 'exploration') return;

        var freq = EXPLORATION_NOTES[noteIndex % EXPLORATION_NOTES.length];
        noteIndex++;

        var osc = ctx.createOscillator();
        // Alternate square and triangle for texture
        osc.type = (noteIndex % 2 === 0) ? 'square' : 'triangle';
        osc.frequency.value = freq;
        osc.detune.value = self._currentDetune;

        var noteGain = ctx.createGain();
        var now = ctx.currentTime;
        noteGain.gain.setValueAtTime(0, now);
        noteGain.gain.linearRampToValueAtTime(0.5, now + 0.02);
        noteGain.gain.linearRampToValueAtTime(0.3, now + 0.15);
        noteGain.gain.linearRampToValueAtTime(0, now + 0.3);

        osc.connect(noteGain);
        noteGain.connect(melodyGain);

        osc.start(now);
        osc.stop(now + 0.35);
      };

      playNote();
      self._melodyInterval = setInterval(function() {
        if (!self.enabled || !self.ctx) return;
        // Update reactive parameters
        if (self._melodyGain) self._melodyGain.gain.value = 0.15 * self._currentVolMod;
        if (self._melodyFilter) self._melodyFilter.frequency.value = self._currentFilterFreq;
        playNote();
      }, beatMs);
